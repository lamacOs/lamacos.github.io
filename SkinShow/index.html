<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7a00">
<title>lamacOs Skin Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
:root{
    --accent:#ff7a00;
    --accent2:#ff8c22;
    --bg:#f5f5f7;
    --glass:rgba(255,255,255,.68);
    --glass2:rgba(255,255,255,.88);
    --text:#171717;
    --muted:#77777f;
    --border:rgba(0,0,0,.08);
    --shadow:
        0 25px 80px rgba(0,0,0,.09),
        0 4px 20px rgba(0,0,0,.04);
}
@media(prefers-color-scheme:dark){
    :root{
        --bg:#08090b;
        --glass:rgba(24,25,29,.68);
        --glass2:rgba(31,32,37,.9);
        --text:#f5f5f7;
        --muted:#9999a2;
        --border:rgba(255,255,255,.09);
        --shadow:
            0 25px 90px rgba(0,0,0,.45),
            0 4px 20px rgba(0,0,0,.25);
    }
}
*{
    box-sizing:border-box;
}
html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}
body{
    min-height:100svh;
    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(255,122,0,.13),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(255,122,0,.07),
            transparent 30%
        ),
        var(--bg);
    color:var(--text);
    font-family:Inter,sans-serif;
}
button,
input{
    font:inherit;
}
button{
    cursor:pointer;
}
.app{
    min-height:100svh;
    padding:
        max(10px,env(safe-area-inset-top))
        max(10px,env(safe-area-inset-right))
        max(10px,env(safe-area-inset-bottom))
        max(10px,env(safe-area-inset-left));
}
/* NAVBAR */
.navbar{
    width:min(1500px,100%);
    height:64px;
    margin:0 auto 14px;
    padding:0 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:1px solid var(--border);
    border-radius:20px;
    background:var(--glass);
    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);
    box-shadow:var(--shadow);
}
.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:Poppins,sans-serif;
    font-size:18px;
    font-weight:700;
}
.logo{
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:var(--accent);
    color:white;
    box-shadow:
        0 8px 25px rgba(255,122,0,.3);
}
.nav-pill{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border:1px solid var(--border);
    border-radius:999px;
    background:var(--glass2);
    color:var(--muted);
    font-size:11px;
    font-weight:600;
}
.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#43d483;
    box-shadow:0 0 12px rgba(67,212,131,.8);
}
/* LAYOUT */
.layout{
    width:min(1500px,100%);
    min-height:calc(100svh - 92px);
    margin:auto;
    display:grid;
    grid-template-columns:350px minmax(0,1fr);
    gap:14px;
}
/* SIDEBAR */
.sidebar{
    padding:26px;
    border:1px solid var(--border);
    border-radius:28px;
    background:var(--glass);
    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
}
.eyebrow{
    margin-bottom:8px;
    color:var(--accent);
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.2px;
}
h1{
    margin:0;
    font-family:Poppins,sans-serif;
    font-size:35px;
    line-height:1.02;
    letter-spacing:-1.5px;
}
.subtitle{
    margin:12px 0 24px;
    color:var(--muted);
    font-size:13px;
    line-height:1.55;
}
/* SEARCH */
.label{
    margin-bottom:8px;
    color:var(--muted);
    font-size:12px;
    font-weight:600;
}
.search{
    display:flex;
    gap:8px;
}
.search input{
    min-width:0;
    flex:1;
    height:48px;
    padding:0 14px;
    border:1px solid var(--border);
    border-radius:14px;
    outline:none;
    background:var(--glass2);
    color:var(--text);
    transition:.2s;
}
.search input:focus{
    border-color:rgba(255,122,0,.6);
    box-shadow:
        0 0 0 4px rgba(255,122,0,.1);
}
.search button{
    width:48px;
    height:48px;
    flex-shrink:0;
    border:0;
    border-radius:14px;
    color:white;
    background:var(--accent);
    font-size:20px;
    box-shadow:
        0 8px 25px rgba(255,122,0,.24);
    transition:.2s;
}
.search button:hover{
    background:var(--accent2);
    transform:translateY(-1px);
}
/* ERROR */
.error{
    display:none;
    margin-top:12px;
    padding:12px 14px;
    border:1px solid rgba(255,70,70,.18);
    border-radius:14px;
    background:rgba(255,70,70,.08);
    color:#ff7070;
    font-size:12px;
    line-height:1.45;
}
/* INFO */
.info{
    margin-top:20px;
    padding:16px;
    border:1px solid var(--border);
    border-radius:18px;
    background:var(--glass2);
}
.info-title{
    margin-bottom:10px;
    font-family:Poppins,sans-serif;
    font-size:13px;
}
.row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:7px 0;
    font-size:12px;
}
.row span:first-child{
    color:var(--muted);
}
.row span:last-child{
    max-width:190px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:600;
}
/* BUTTONS */
.buttons{
    margin-top:auto;
    padding-top:18px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}
.btn{
    min-height:43px;
    border:1px solid var(--border);
    border-radius:13px;
    background:var(--glass2);
    color:var(--text);
    font-size:12px;
    font-weight:600;
    transition:.2s;
}
.btn:hover{
    transform:translateY(-1px);
    border-color:rgba(255,122,0,.3);
    background:rgba(255,122,0,.07);
}
.btn.accent{
    color:white;
    background:var(--accent);
    border-color:var(--accent);
}
/* VIEWER */
.viewer{
    position:relative;
    min-width:0;
    min-height:600px;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:28px;
    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(255,122,0,.14),
            transparent 32%
        ),
        #0b0c0f;
    box-shadow:var(--shadow);
}
#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}
/* VIEWER HEADER */
.viewer-header{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
    z-index:5;
}
.badge{
    padding:9px 12px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:999px;
    background:rgba(20,20,23,.65);
    backdrop-filter:blur(18px);
    color:#aaa;
    font-size:11px;
    font-weight:600;
}
.badge.player{
    color:white;
}
/* LOADING */
.loading{
    position:absolute;
    inset:0;
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    background:rgba(5,5,7,.5);
    backdrop-filter:blur(10px);
}
.spinner{
    width:34px;
    height:34px;
    border:3px solid rgba(255,255,255,.12);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .8s linear infinite;
}
@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
/* VIEWER CONTROLS */
.viewer-controls{
    position:absolute;
    right:16px;
    bottom:50px;
    z-index:8;
    display:flex;
    flex-direction:column;
    gap:7px;
}
.viewer-button{
    width:42px;
    height:42px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:13px;
    background:rgba(20,20,23,.68);
    backdrop-filter:blur(18px);
    color:white;
    font-size:18px;
    transition:.2s;
}
.viewer-button:hover{
    background:rgba(255,122,0,.8);
}
/* HINT */
.hint{
    position:absolute;
    left:50%;
    bottom:16px;
    transform:translateX(-50%);
    padding:8px 13px;
    max-width:calc(100% - 130px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:999px;
    background:rgba(20,20,23,.62);
    backdrop-filter:blur(18px);
    color:#999;
    font-size:10px;
    white-space:nowrap;
    pointer-events:none;
}
/* COPYRIGHT */
.copyright{
    position:absolute;
    right:16px;
    bottom:16px;
    color:rgba(255,255,255,.35);
    font-size:9px;
    pointer-events:none;
}
/* RESPONSIVE */
@media(max-width:900px){
    .layout{
        grid-template-columns:1fr;
        min-height:auto;
    }
    .viewer{
        min-height:68svh;
    }
    .buttons{
        margin-top:18px;
    }
}
@media(max-width:600px){
    .navbar{
        height:57px;
        margin-bottom:9px;
        border-radius:17px;
    }
    .nav-pill{
        display:none;
    }
    .logo{
        width:34px;
        height:34px;
    }
    .sidebar{
        padding:20px;
        border-radius:22px;
    }
    h1{
        font-size:28px;
    }
    .viewer{
        min-height:64svh;
        border-radius:22px;
    }
    .viewer-header{
        top:10px;
        left:10px;
        right:10px;
    }
    .viewer-controls{
        right:10px;
        bottom:48px;
    }
    .hint{
        left:10px;
        right:65px;
        max-width:none;
        transform:none;
        overflow:hidden;
        text-overflow:ellipsis;
    }
    .copyright{
        display:none;
    }
}
@media(max-width:390px){
    .buttons{
        grid-template-columns:1fr;
    }
    .info{
        display:none;
    }
}
</style>
</head>
<body>
<div class="app">
<header class="navbar">
    <div class="brand">
        <div class="logo">🦙</div>
        <span>lamacOs</span>
    </div>
    <div class="nav-pill">
        <span class="dot"></span>
        Minecraft Skin Viewer
    </div>
</header>
<main class="layout">
<aside class="sidebar">
    <div class="eyebrow">
        Minecraft Tool
    </div>
    <h1>
        Skin<br>
        Viewer
    </h1>
    <p class="subtitle">
        Gib einen Minecraft-Spielernamen ein
        und betrachte seinen aktuellen Skin
        als interaktives 3D-Modell.
    </p>
    <div class="label">
        Spielername
    </div>
    <div class="search">
        <input
            id="username"
            type="text"
            maxlength="16"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="z. B. lamacOs"
        >
        <button
            id="search"
            aria-label="Spieler suchen"
        >→</button>
    </div>
    <div
        id="error"
        class="error"
    ></div>
    <section class="info">
        <div class="info-title">
            Spielerdaten
        </div>
        <div class="row">
            <span>Name</span>
            <span id="name">–</span>
        </div>
        <div class="row">
            <span>UUID</span>
            <span id="uuid">–</span>
        </div>
        <div class="row">
            <span>Modell</span>
            <span id="model">–</span>
        </div>
    </section>
    <div class="buttons">
        <button
            class="btn"
            id="reset"
        >
            ↻ Zurücksetzen
        </button>
        <button
            class="btn"
            id="front"
        >
            🧍 Front
        </button>
        <button
            class="btn"
            id="random"
        >
            🎲 Beispiel
        </button>
        <button
            class="btn accent"
            id="openSkin"
        >
            🖼 Skin öffnen
        </button>
    </div>
</aside>
<section class="viewer">
    <canvas id="canvas"></canvas>
    <div class="viewer-header">
        <div
            class="badge player"
            id="viewerName"
        >
            lamacOs
        </div>
        <div class="badge">
            3D
        </div>
    </div>
    <div
        id="loading"
        class="loading"
    >
        <div class="spinner"></div>
        <div>
            Skin wird geladen…
        </div>
    </div>
    <div class="viewer-controls">
        <button
            class="viewer-button"
            id="zoomIn"
            aria-label="Hineinzoomen"
        >+</button>
        <button
            class="viewer-button"
            id="zoomOut"
            aria-label="Herauszoomen"
        >−</button>
        <button
            class="viewer-button"
            id="fullscreen"
            aria-label="Vollbild"
        >⛶</button>
    </div>
    <div class="hint">
        Ziehen = drehen · Mausrad/Pinch = zoomen
    </div>
    <div class="copyright">
        © 2026 lamacHub
    </div>
</section>
</main>
</div>
<script>
"use strict";
/* =========================================================
   API
========================================================= */
const MCSTATE =
    "https://www.mcstate.net/api/player/";
const MOJANG =
    "https://api.mojang.com/users/profiles/minecraft/";
const SESSION =
    "https://sessionserver.mojang.com/session/minecraft/profile/";
/* =========================================================
   DOM
========================================================= */
const canvas =
    document.getElementById("canvas");
const username =
    document.getElementById("username");
const search =
    document.getElementById("search");
const errorBox =
    document.getElementById("error");
const loading =
    document.getElementById("loading");
const nameBox =
    document.getElementById("name");
const uuidBox =
    document.getElementById("uuid");
const modelBox =
    document.getElementById("model");
const viewerName =
    document.getElementById("viewerName");
const reset =
    document.getElementById("reset");
const front =
    document.getElementById("front");
const random =
    document.getElementById("random");
const openSkin =
    document.getElementById("openSkin");
const zoomIn =
    document.getElementById("zoomIn");
const zoomOut =
    document.getElementById("zoomOut");
const fullscreen =
    document.getElementById("fullscreen");
/* =========================================================
   STATE
========================================================= */
let currentSkinURL = null;
let player = null;
let playerGroup = null;
let rotationY = 0;
let targetRotationY = 0;
let rotationX = 0;
let targetRotationX = 0;
let zoom = 8;
let targetZoom = 8;
let dragging = false;
let lastX = 0;
let lastY = 0;
/* =========================================================
   THREE
========================================================= */
const scene =
    new THREE.Scene();
scene.background =
    new THREE.Color(0x0b0c0f);
const camera =
    new THREE.PerspectiveCamera(
        32,
        1,
        .1,
        100
    );
camera.position.set(
    0,
    1,
    8
);
const renderer =
    new THREE.WebGLRenderer({
        canvas,
        antialias:true
    });
renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);
renderer.outputColorSpace =
    THREE.SRGBColorSpace;
/* LIGHTING */
scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x222222,
        2.5
    )
);
const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );
keyLight.position.set(
    5,
    8,
    7
);
scene.add(keyLight);
const orangeLight =
    new THREE.PointLight(
        0xff7a00,
        22,
        15
    );
orangeLight.position.set(
    -4,
    3,
    4
);
scene.add(orangeLight);
/* FLOOR */
const floor =
    new THREE.Mesh(
        new THREE.CircleGeometry(
            2.8,
            64
        ),
        new THREE.MeshBasicMaterial({
            color:0x15161a,
            transparent:true,
            opacity:.8
        })
    );
floor.rotation.x =
    -Math.PI / 2;
floor.position.y =
    -3.2;
scene.add(floor);
/* =========================================================
   RESIZE
========================================================= */
function resize(){
    const rect =
        canvas.getBoundingClientRect();
    const w =
        Math.max(rect.width,1);
    const h =
        Math.max(rect.height,1);
    camera.aspect =
        w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(
        w,
        h,
        false
    );
}
window.addEventListener(
    "resize",
    resize
);
resize();
/* =========================================================
   UI
========================================================= */
function showLoading(){
    loading.style.display =
        "flex";
}
function hideLoading(){
    loading.style.display =
        "none";
}
function error(message){
    errorBox.textContent =
        message;
    errorBox.style.display =
        "block";
}
function clearError(){
    errorBox.style.display =
        "none";
}
/* =========================================================
   FETCH
========================================================= */
async function getJSON(url){
    const response =
        await fetch(
            url,
            {
                method:"GET",
                cache:"no-store",
                headers:{
                    Accept:"application/json"
                }
            }
        );
    if(!response.ok){
        throw new Error(
            "HTTP " +
            response.status
        );
    }
    return response.json();
}
/* =========================================================
   MCSTATE
========================================================= */
async function lookupMCState(name){
    const data =
        await getJSON(
            MCSTATE +
            encodeURIComponent(name)
        );
    if(
        !data ||
        !data.uuid
    ){
        throw new Error(
            "MCState konnte den Spieler nicht auflösen."
        );
    }
    if(
        !data.skinUrl
    ){
        throw new Error(
            "MCState hat den Spieler gefunden, aber keine Skin-URL geliefert."
        );
    }
    return {
        username:
            data.name ||
            data.username ||
            name,
        uuid:
            data.uuid,
        skin:
            data.skinUrl,
        model:
            String(
                data.variant ||
                data.model ||
                ""
            ).toLowerCase() === "slim"
                ? "slim"
                : "classic"
    };
}
/* =========================================================
   MOJANG FALLBACK
========================================================= */
async function lookupMojang(name){
    const profile =
        await getJSON(
            MOJANG +
            encodeURIComponent(name)
        );
    if(
        !profile ||
        !profile.id
    ){
        throw new Error(
            "Mojang hat keinen Spieler gefunden."
        );
    }
    const session =
        await getJSON(
            SESSION +
            encodeURIComponent(
                profile.id
            )
        );
    const property =
        session?.properties?.find(
            p =>
                p.name ===
                "textures"
        );
    if(
        !property?.value
    ){
        throw new Error(
            "Mojang hat keine Texturdaten geliefert."
        );
    }
    const decoded =
        JSON.parse(
            new TextDecoder()
                .decode(
                    Uint8Array.from(
                        atob(property.value),
                        c => c.charCodeAt(0)
                    )
                )
        );
    const skin =
        decoded?.textures?.SKIN;
    if(
        !skin?.url
    ){
        throw new Error(
            "Mojang hat keinen Skin geliefert."
        );
    }
    return {
        username:
            session.name ||
            profile.name,
        uuid:
            profile.id,
        skin:
            skin.url.replace(
                /^http:/,
                "https:"
            ),
        model:
            skin?.metadata?.model ===
            "slim"
                ? "slim"
                : "classic"
    };
}
/* =========================================================
   PLAYER LOOKUP
========================================================= */
async function lookup(name){
    let mcstateError = null;
    try{
        return await lookupMCState(
            name
        );
    }catch(e){
        console.warn(
            "MCState:",
            e
        );
        mcstateError = e;
    }
    try{
        return await lookupMojang(
            name
        );
    }catch(e){
        console.warn(
            "Mojang:",
            e
        );
        throw new Error(
            "Spieler „" +
            name +
            "“ konnte nicht gefunden werden. Beide Spieler-Dienste haben keine gültigen Profildaten geliefert."
        );
    }
}
/* =========================================================
   TEXTURE
========================================================= */
function loadTexture(url){
    return new Promise(
        (resolve,reject)=>{
            const loader =
                new THREE.TextureLoader();
            loader.setCrossOrigin(
                "anonymous"
            );
            loader.load(
                url,
                texture=>{
                    texture.colorSpace =
                        THREE.SRGBColorSpace;
                    texture.magFilter =
                        THREE.NearestFilter;
                    texture.minFilter =
                        THREE.NearestFilter;
                    texture.generateMipmaps =
                        false;
                    resolve(texture);
                },
                undefined,
                reject
            );
        }
    );
}
/* =========================================================
   REGION
========================================================= */
function region(
    texture,
    x,
    y,
    w,
    h
){
    const t =
        texture.clone();
    t.needsUpdate =
        true;
    t.wrapS =
        THREE.ClampToEdgeWrapping;
    t.wrapT =
        THREE.ClampToEdgeWrapping;
    t.repeat.set(
        w / 64,
        h / 64
    );
    t.offset.set(
        x / 64,
        1 -
        (y + h) / 64
    );
    t.magFilter =
        THREE.NearestFilter;
    t.minFilter =
        THREE.NearestFilter;
    t.generateMipmaps =
        false;
    return t;
}
function mat(
    texture,
    r
){
    return new THREE.MeshLambertMaterial({
        map:region(
            texture,
            r[0],
            r[1],
            r[2],
            r[3]
        ),
        transparent:true,
        alphaTest:.05
    });
}
/* =========================================================
   CUBE
========================================================= */
function cube(
    texture,
    size,
    pos,
    r
){
    const geometry =
        new THREE.BoxGeometry(
            size[0],
            size[1],
            size[2]
        );
    const materials = [
        mat(texture,r.right),
        mat(texture,r.left),
        mat(texture,r.top),
        mat(texture,r.bottom),
        mat(texture,r.front),
        mat(texture,r.back)
    ];
    const mesh =
        new THREE.Mesh(
            geometry,
            materials
        );
    mesh.position.set(
        pos[0],
        pos[1],
        pos[2]
    );
    return mesh;
}
/* =========================================================
   HEAD
========================================================= */
function head(
    texture,
    group
){
    group.add(
        cube(
            texture,
            [2,2,2],
            [0,2.5,0],
            {
                top:[8,0,8,8],
                bottom:[16,0,8,8],
                left:[0,8,8,8],
                front:[8,8,8,8],
                right:[16,8,8,8],
                back:[24,8,8,8]
            }
        )
    );
    group.add(
        cube(
            texture,
            [2.12,2.12,2.12],
            [0,2.5,0],
            {
                top:[40,0,8,8],
                bottom:[48,0,8,8],
                left:[32,8,8,8],
                front:[40,8,8,8],
                right:[48,8,8,8],
                back:[56,8,8,8]
            }
        )
    );
}
/* =========================================================
   BODY
========================================================= */
function body(
    texture,
    group
){
    group.add(
        cube(
            texture,
            [2,2.5,1],
            [0,.25,0],
            {
                top:[20,16,8,4],
                bottom:[28,16,8,4],
                left:[16,20,4,12],
                front:[20,20,8,12],
                right:[28,20,4,12],
                back:[32,20,8,12]
            }
        )
    );
    group.add(
        cube(
            texture,
            [2.12,2.62,1.12],
            [0,.25,0],
            {
                top:[20,32,8,4],
                bottom:[28,32,8,4],
                left:[16,36,4,12],
                front:[20,36,8,12],
                right:[28,36,4,12],
                back:[32,36,8,12]
            }
        )
    );
}
/* =========================================================
   ARMS
========================================================= */
function arm(
    texture,
    group,
    side,
    slim
){
    const width =
        slim ? .75 : 1;
    const x =
        side === "right"
            ? 1.5
            : -1.5;
    const w =
        slim ? 3 : 4;
    let r;
    if(
        side === "right"
    ){
        r = {
            top:[44,16,w,4],
            bottom:[48,16,w,4],
            left:[40,20,4,12],
            front:[44,20,w,12],
            right:[44+w,20,4,12],
            back:[48,20,w,12]
        };
    }else{
        r = {
            top:[36,48,w,4],
            bottom:[40,48,w,4],
            left:[32,52,4,12],
            front:[36,52,w,12],
            right:[36+w,52,4,12],
            back:[40,52,w,12]
        };
    }
    group.add(
        cube(
            texture,
            [width,2.5,1],
            [x,.25,0],
            r
        )
    );
}
/* =========================================================
   LEGS
========================================================= */
function leg(
    texture,
    group,
    side
){
    const x =
        side === "right"
            ? .5
            : -.5;
    const bx =
        side === "right"
            ? 0
            : 16;
    group.add(
        cube(
            texture,
            [1,2.5,1],
            [x,-2.25,0],
            {
                top:[bx+4,16,4,4],
                bottom:[bx+8,16,4,4],
                left:[bx,20,4,12],
                front:[bx+4,20,4,12],
                right:[bx+8,20,4,12],
                back:[bx+12,20,4,12]
            }
        )
    );
    group.add(
        cube(
            texture,
            [1.12,2.62,1.12],
            [x,-2.25,0],
            {
                top:[bx+4,48,4,4],
                bottom:[bx+8,48,4,4],
                left:[bx,36,4,12],
                front:[bx+4,36,4,12],
                right:[bx+8,36,4,12],
                back:[bx+12,36,4,12]
            }
        )
    );
}
/* =========================================================
   BUILD
========================================================= */
function build(
    texture,
    model
){
    if(playerGroup){
        scene.remove(
            playerGroup
        );
    }
    playerGroup =
        new THREE.Group();
    playerGroup.position.y =
        .2;
    scene.add(
        playerGroup
    );
    head(
        texture,
        playerGroup
    );
    body(
        texture,
        playerGroup
    );
    arm(
        texture,
        playerGroup,
        "right",
        model === "slim"
    );
    arm(
        texture,
        playerGroup,
        "left",
        model === "slim"
    );
    leg(
        texture,
        playerGroup,
        "right"
    );
    leg(
        texture,
        playerGroup,
        "left"
    );
}
/* =========================================================
   LOAD PLAYER
========================================================= */
async function loadPlayer(
    value
){
    const name =
        value.trim();
    if(!name){
        error(
            "Bitte gib einen Minecraft-Spielernamen ein."
        );
        return;
    }
    if(
        !/^[A-Za-z0-9_]{1,16}$/.test(
            name
        )
    ){
        error(
            "Ungültiger Minecraft-Name. Erlaubt sind Buchstaben, Zahlen und _."
        );
        return;
    }
    clearError();
    showLoading();
    try{
        const data =
            await lookup(name);
        const texture =
            await loadTexture(
                data.skin
            );
        player =
            data;
        currentSkinURL =
            data.skin;
        nameBox.textContent =
            data.username;
        uuidBox.textContent =
            data.uuid;
        modelBox.textContent =
            data.model === "slim"
                ? "Alex / Slim"
                : "Steve / Classic";
        viewerName.textContent =
            data.username;
        build(
            texture,
            data.model
        );
        resetView();
    }catch(e){
        console.error(e);
        error(
            e.message ||
            "Der Spieler konnte nicht geladen werden."
        );
    }finally{
        hideLoading();
    }
}
/* =========================================================
   VIEW
========================================================= */
function resetView(){
    targetRotationY =
        0;
    rotationY =
        0;
    targetRotationX =
        0;
    rotationX =
        0;
    targetZoom =
        8;
    zoom =
        8;
}
function changeZoom(
    amount
){
    targetZoom +=
        amount;
    targetZoom =
        THREE.MathUtils.clamp(
            targetZoom,
            4.5,
            13
        );
}
/* =========================================================
   BUTTONS
========================================================= */
search.addEventListener(
    "click",
    () =>
        loadPlayer(
            username.value
        )
);
username.addEventListener(
    "keydown",
    e => {
        if(
            e.key === "Enter"
        ){
            loadPlayer(
                username.value
            );
        }
    }
);
reset.addEventListener(
    "click",
    resetView
);
front.addEventListener(
    "click",
    () => {
        targetRotationY =
            0;
        targetRotationX =
            0;
    }
);
random.addEventListener(
    "click",
    () => {
        const names = [
            "Notch",
            "jeb_",
            "Dinnerbone",
            "Grumm",
            "Technoblade"
        ];
        const selected =
            names[
                Math.floor(
                    Math.random() *
                    names.length
                )
            ];
        username.value =
            selected;
        loadPlayer(
            selected
        );
    }
);
openSkin.addEventListener(
    "click",
    () => {
        if(currentSkinURL){
            window.open(
                currentSkinURL,
                "_blank",
                "noopener,noreferrer"
            );
        }
    }
);
zoomIn.addEventListener(
    "click",
    () =>
        changeZoom(-.7)
);
zoomOut.addEventListener(
    "click",
    () =>
        changeZoom(.7)
);
/* =========================================================
   FULLSCREEN
========================================================= */
fullscreen.addEventListener(
    "click",
    async () => {
        const viewer =
            document.querySelector(
                ".viewer"
            );
        try{
            if(
                document.fullscreenElement
            ){
                await document.exitFullscreen();
            }else{
                await viewer.requestFullscreen();
            }
        }catch(e){
            console.warn(
                "Fullscreen nicht verfügbar:",
                e
            );
        }
    }
);
document.addEventListener(
    "fullscreenchange",
    () => {
        setTimeout(
            resize,
            50
        );
    }
);
/* =========================================================
   POINTER ROTATION
========================================================= */
canvas.addEventListener(
    "pointerdown",
    e => {
        dragging =
            true;
        lastX =
            e.clientX;
        lastY =
            e.clientY;
        canvas.setPointerCapture(
            e.pointerId
        );
    }
);
canvas.addEventListener(
    "pointermove",
    e => {
        if(!dragging)
            return;
        const dx =
            e.clientX -
            lastX;
        const dy =
            e.clientY -
            lastY;
        lastX =
            e.clientX;
        lastY =
            e.clientY;
        targetRotationY +=
            dx * .012;
        targetRotationX +=
            dy * .006;
        targetRotationX =
            THREE.MathUtils.clamp(
                targetRotationX,
                -.65,
                .65
            );
    }
);
canvas.addEventListener(
    "pointerup",
    () => {
        dragging = false;
    }
);
canvas.addEventListener(
    "pointercancel",
    () => {
        dragging = false;
    }
);
/* =========================================================
   MOUSE WHEEL
========================================================= */
canvas.addEventListener(
    "wheel",
    e => {
        e.preventDefault();
        changeZoom(
            e.deltaY * .008
        );
    },
    {
        passive:false
    }
);
/* =========================================================
   PINCH ZOOM
========================================================= */
let pinchStart = null;
canvas.addEventListener(
    "touchstart",
    e => {
        if(
            e.touches.length === 2
        ){
            const a =
                e.touches[0];
            const b =
                e.touches[1];
            pinchStart =
                Math.hypot(
                    a.clientX-b.clientX,
                    a.clientY-b.clientY
                );
        }
    },
    {
        passive:true
    }
);
canvas.addEventListener(
    "touchmove",
    e => {
        if(
            e.touches.length !== 2 ||
            pinchStart === null
        )
            return;
        const a =
            e.touches[0];
        const b =
            e.touches[1];
        const distance =
            Math.hypot(
                a.clientX-b.clientX,
                a.clientY-b.clientY
            );
        const difference =
            distance -
            pinchStart;
        changeZoom(
            -difference * .01
        );
        pinchStart =
            distance;
    },
    {
        passive:true
    }
);
canvas.addEventListener(
    "touchend",
    () => {
        pinchStart =
            null;
    },
    {
        passive:true
    }
);
/* =========================================================
   ANIMATION
========================================================= */
function animate(){
    requestAnimationFrame(
        animate
    );
    rotationY +=
        (
            targetRotationY -
            rotationY
        ) * .12;
    rotationX +=
        (
            targetRotationX -
            rotationX
        ) * .12;
    zoom +=
        (
            targetZoom -
            zoom
        ) * .12;
    if(playerGroup){
        playerGroup.rotation.y =
            rotationY;
        playerGroup.rotation.x =
            rotationX;
    }
    camera.position.z =
        zoom;
    camera.position.y =
        1;
    camera.lookAt(
        0,
        .15,
        0
    );
    renderer.render(
        scene,
        camera
    );
}
animate();
/* =========================================================
   INITIAL PLAYER
========================================================= */
username.value =
    "lamacOs";
loadPlayer(
    "lamacOs"
);
</script>
