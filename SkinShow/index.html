<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>lamacHub — Minecraft Skin Viewer</title>

<meta name="description" content="Interaktiver Minecraft Skin Viewer mit 3D-Modell.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
:root {
    --accent: #ff7a00;
    --accent-hover: #ff8b1f;

    --bg: #f5f5f7;
    --glass: rgba(255,255,255,.68);
    --glass-strong: rgba(255,255,255,.86);

    --text: #171717;
    --muted: #77777d;

    --border: rgba(0,0,0,.08);

    --shadow:
        0 25px 80px rgba(0,0,0,.08),
        0 3px 15px rgba(0,0,0,.04);

    --radius-xl: 28px;
    --radius-lg: 20px;
    --radius-md: 14px;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #08090b;
        --glass: rgba(24,25,29,.66);
        --glass-strong: rgba(31,32,37,.86);

        --text: #f5f5f7;
        --muted: #9999a1;

        --border: rgba(255,255,255,.09);

        --shadow:
            0 25px 90px rgba(0,0,0,.42),
            0 3px 15px rgba(0,0,0,.25);
    }
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    min-height: 100svh;

    color: var(--text);
    background:
        radial-gradient(
            circle at 12% 8%,
            rgba(255,122,0,.13),
            transparent 27%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(255,122,0,.07),
            transparent 30%
        ),
        var(--bg);

    font-family: Inter, sans-serif;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    min-height: 100svh;

    padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {
    width: min(1500px, 100%);
    height: 64px;

    margin: 0 auto 16px;

    padding: 0 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: var(--glass);

    border: 1px solid var(--border);
    border-radius: 20px;

    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);

    box-shadow: var(--shadow);
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    font-family: Poppins, sans-serif;
    font-size: 18px;
    font-weight: 700;
}

.brand-icon {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    color: white;

    border-radius: 12px;

    background: var(--accent);

    box-shadow:
        0 8px 25px rgba(255,122,0,.28);
}

.nav-status {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 8px 12px;

    border: 1px solid var(--border);
    border-radius: 999px;

    background: var(--glass-strong);

    color: var(--muted);

    font-size: 11px;
    font-weight: 600;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #44d483;

    box-shadow:
        0 0 12px rgba(68,212,131,.75);
}


/* =========================================================
   MAIN
========================================================= */

.layout {
    width: min(1500px, 100%);
    min-height: calc(100svh - 96px);

    margin: 0 auto;

    display: grid;
    grid-template-columns: 350px minmax(0,1fr);

    gap: 16px;
}


/* =========================================================
   GLASS PANEL
========================================================= */

.panel,
.viewer {
    border: 1px solid var(--border);

    background: var(--glass);

    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);

    box-shadow: var(--shadow);
}


/* =========================================================
   SIDEBAR
========================================================= */

.panel {
    padding: 26px;

    border-radius: var(--radius-xl);

    display: flex;
    flex-direction: column;
}

.eyebrow {
    color: var(--accent);

    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: 1.2px;

    margin-bottom: 8px;
}

h1 {
    margin: 0;

    font-family: Poppins, sans-serif;

    font-size: 34px;
    line-height: 1.05;

    letter-spacing: -1.5px;
}

.subtitle {
    margin: 12px 0 24px;

    color: var(--muted);

    font-size: 13px;
    line-height: 1.55;
}


/* =========================================================
   SEARCH
========================================================= */

.search-label {
    display: block;

    margin-bottom: 8px;

    color: var(--muted);

    font-size: 12px;
    font-weight: 600;
}

.search {
    display: flex;
    gap: 8px;
}

.search input {
    min-width: 0;
    flex: 1;

    height: 48px;

    padding: 0 14px;

    color: var(--text);

    background: var(--glass-strong);

    border: 1px solid var(--border);
    border-radius: var(--radius-md);

    outline: none;

    transition: .2s ease;
}

.search input:focus {
    border-color: rgba(255,122,0,.6);

    box-shadow:
        0 0 0 4px rgba(255,122,0,.1);
}

.search input::placeholder {
    color: var(--muted);
}

.search-button {
    width: 48px;
    height: 48px;

    flex-shrink: 0;

    border: 0;
    border-radius: var(--radius-md);

    color: white;

    background: var(--accent);

    box-shadow:
        0 8px 25px rgba(255,122,0,.22);

    transition: .2s ease;
}

.search-button:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
}

.search-button:active {
    transform: scale(.96);
}


/* =========================================================
   ERROR
========================================================= */

.error {
    display: none;

    margin-top: 12px;

    padding: 12px 14px;

    color: #ff7777;

    background: rgba(255,70,70,.08);

    border: 1px solid rgba(255,70,70,.15);

    border-radius: 14px;

    font-size: 12px;
    line-height: 1.45;
}


/* =========================================================
   PLAYER CARD
========================================================= */

.player-card {
    margin-top: 20px;

    padding: 16px;

    background: var(--glass-strong);

    border: 1px solid var(--border);

    border-radius: 18px;
}

.card-title {
    margin-bottom: 12px;

    font-family: Poppins, sans-serif;

    font-size: 13px;
    font-weight: 600;
}

.info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    padding: 7px 0;

    font-size: 12px;
}

.info-row .label {
    color: var(--muted);
}

.info-row .value {
    max-width: 185px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    font-weight: 600;
}


/* =========================================================
   BUTTONS
========================================================= */

.controls {
    margin-top: auto;
    padding-top: 20px;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 8px;
}

.control {
    min-height: 42px;

    border: 1px solid var(--border);
    border-radius: 13px;

    color: var(--text);

    background: var(--glass-strong);

    font-size: 12px;
    font-weight: 600;

    transition: .2s ease;
}

.control:hover {
    transform: translateY(-1px);

    background:
        rgba(255,122,0,.07);

    border-color:
        rgba(255,122,0,.25);
}

.control.accent {
    color: white;

    background: var(--accent);

    border-color: var(--accent);
}


/* =========================================================
   VIEWER
========================================================= */

.viewer {
    position: relative;

    min-width: 0;
    min-height: 600px;

    overflow: hidden;

    border-radius: var(--radius-xl);

    background:
        radial-gradient(
            circle at 50% 43%,
            rgba(255,122,0,.12),
            transparent 31%
        ),
        #0b0c0f;
}

#viewer {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    touch-action: none;
}


/* =========================================================
   VIEWER BADGES
========================================================= */

.viewer-top {
    position: absolute;

    top: 16px;
    left: 16px;
    right: 16px;

    display: flex;
    justify-content: space-between;

    pointer-events: none;

    z-index: 5;
}

.badge {
    padding: 9px 12px;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 999px;

    background: rgba(20,20,23,.62);

    backdrop-filter: blur(20px);

    color: #aaa;

    font-size: 11px;
    font-weight: 600;
}

.badge.player {
    color: white;
}


/* =========================================================
   LOADING
========================================================= */

.loading {
    position: absolute;

    inset: 0;

    z-index: 10;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    gap: 12px;

    background:
        rgba(5,5,7,.48);

    backdrop-filter: blur(10px);
}

.spinner {
    width: 34px;
    height: 34px;

    border: 3px solid rgba(255,255,255,.12);

    border-top-color:
        var(--accent);

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}

.loading-text {
    color: #aaa;

    font-size: 12px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   HINT
========================================================= */

.hint {
    position: absolute;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    padding: 9px 14px;

    max-width: calc(100% - 30px);

    border-radius: 999px;

    background: rgba(20,20,23,.62);

    border: 1px solid rgba(255,255,255,.08);

    backdrop-filter: blur(20px);

    color: #999;

    font-size: 11px;

    white-space: nowrap;

    pointer-events: none;
}


/* =========================================================
   COPYRIGHT
========================================================= */

.copyright {
    position: absolute;

    right: 17px;
    bottom: 17px;

    color: rgba(255,255,255,.38);

    font-size: 9px;

    pointer-events: none;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .layout {
        grid-template-columns: 1fr;
        min-height: auto;
    }

    .panel {
        min-height: auto;
    }

    .viewer {
        min-height: 65svh;
    }

    .controls {
        margin-top: 18px;
    }
}


@media (max-width: 600px) {

    .app {
        padding:
            max(9px, env(safe-area-inset-top))
            max(9px, env(safe-area-inset-right))
            max(9px, env(safe-area-inset-bottom))

    .navbar {
        height: 57px;
        margin-bottom: 9px;

        border-radius: 17px;
    }

    .brand {
        font-size: 16px;
    }

    .brand-icon {
        width: 34px;
        height: 34px;
    }

    .nav-status {
        display: none;
    }

    .layout {
        gap: 9px;
    }

    .panel {
        padding: 20px;
        border-radius: 22px;
    }

    h1 {
        font-size: 27px;
    }

    .subtitle {
        margin-bottom: 18px;
    }

    .viewer {
        min-height: 58svh;
        border-radius: 22px;
    }

    .viewer-top {
        top: 11px;
        left: 11px;
        right: 11px;
    }

    .hint {
        bottom: 11px;
    }

    .copyright {

    }
}


@media (max-width: 390px) {

    .controls {
        grid-template-columns: 1fr;
    }

    .player-card {
        display: none;
    }
}
</style>

<script>
"use strict";


/* =========================================================
   API CONFIGURATION
========================================================= */

/*
    Primary:
    Mojang username -> UUID
    Mojang UUID -> session profile -> skin

    Fallback:
    Ashcon username -> everything

    Ashcon's current API documents:
    /mojang/v2/user/<username|uuid>

    The Mojang API flow is:
    /users/profiles/minecraft/<username>
    /session/minecraft/profile/<uuid>
*/

const MOJANG_PROFILE_API =
    "https://api.mojang.com/users/profiles/minecraft/";

const MOJANG_SESSION_API =
    "https://sessionserver.mojang.com/session/minecraft/profile/";

const ASHCON_API =
    "https://api.ashcon.app/mojang/v2/user/";


/* =========================================================
   DOM
========================================================= */

const canvas =
    document.getElementById("viewer");

const usernameInput =
    document.getElementById("username");

const searchButton =
    document.getElementById("searchButton");

const resetButton =
    document.getElementById("resetButton");

const frontButton =
    document.getElementById("frontButton");

const exampleButton =
    document.getElementById("exampleButton");

const skinButton =
    document.getElementById("skinButton");

const errorElement =
    document.getElementById("error");

const loadingElement =
    document.getElementById("loading");

const nameValue =
    document.getElementById("nameValue");

const uuidValue =
    document.getElementById("uuidValue");

const modelValue =
    document.getElementById("modelValue");

const viewerPlayer =
    document.getElementById("viewerPlayer");


/* =========================================================
   THREE.JS
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x0b0c0f);


const camera =
    new THREE.PerspectiveCamera(
        32,
        1,
        .1,
        100
    );

camera.position.set(
    4.5,
    2.3,
    8
);


const renderer =
    new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;


/* =========================================================
   LIGHTS
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x222222,
        2.4
    );

scene.add(hemi);


const key =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

key.position.set(
    5,
    8,
    7
);

scene.add(key);


const fill =
    new THREE.PointLight(
        0xff7a00,
        25,
        14
    );

fill.position.set(
    -4,
    3,
    4
);

scene.add(fill);


/* =========================================================
   GROUND
========================================================= */

const ground =
    new THREE.Mesh(
        new THREE.CircleGeometry(
            2.7,
            64
        ),
        new THREE.MeshBasicMaterial({
            color: 0x15161a,
            transparent: true,
            opacity: .75
        })
    );

ground.rotation.x =
    -Math.PI / 2;

ground.position.y =
    -3.3;

scene.add(ground);


/* =========================================================
   STATE
========================================================= */

let playerGroup = null;

let currentPlayer = null;

let currentSkinURL = null;

let currentModel = "classic";

let targetRotationY = 0;
let currentRotationY = 0;

let targetRotationX = 0;
let currentRotationX = 0;

let targetZoom = 8;
let currentZoom = 8;

let dragging = false;

let pointerX = 0;
let pointerY = 0;


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    const rect =
        canvas.getBoundingClientRect();

    const width =
        Math.max(
            rect.width,
            1
        );

    const height =
        Math.max(
            rect.height,
            1
        );

    camera.aspect =
        width / height;

    camera.updateProjectionMatrix();

    renderer.setSize(
        width,
        height,
        false
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   HELPERS
========================================================= */

function showLoading() {
    loadingElement.style.display =
        "flex";
}


function hideLoading() {
    loadingElement.style.display =
        "none";
}


function showError(message) {

    errorElement.textContent =
        message;

    errorElement.style.display =
        "block";
}


function hideError() {

    errorElement.style.display =
        "none";
}


function cleanUsername(value) {

    return value
        .trim()
        .replace(/\s+/g, "");
}


function uuidWithoutDashes(uuid) {

    return uuid
        .replace(/-/g, "")
        .toLowerCase();
}


/* =========================================================
   FETCH JSON
========================================================= */

async function fetchJSON(url) {

    const response =
        await fetch(
            url,
            {
                method: "GET",
                cache: "no-store",
                headers: {
                    "Accept":
                        "application/json"
                }
            }
        );

    if (!response.ok) {

        throw new Error(
            `HTTP ${response.status}`
        );
    }

    return response.json();
}


/* =========================================================
   MOJANG LOOKUP
========================================================= */

async function lookupMojang(
    username
) {

    /*
        Step 1:
        Username -> UUID
    */

    const profile =
        await fetchJSON(
            MOJANG_PROFILE_API +
            encodeURIComponent(
                username
            )
        );


    if (
        !profile ||
        !profile.id
    ) {

        throw new Error(
            "Mojang hat keinen Spieler gefunden."
        );
    }


    /*
        Step 2:
        UUID -> session profile
    */

    const uuid =
        profile.id;

    const session =
        await fetchJSON(
            MOJANG_SESSION_API +
            encodeURIComponent(
                uuid
            ) +
            "?unsigned=false"
        );


    if (
        !session ||
        !Array.isArray(
            session.properties
        )
    ) {

        throw new Error(
            "Das Mojang-Profil enthält keine Texturen."
        );
    }


    const textureProperty =
        session.properties.find(
            property =>
                property.name ===
                "textures"
        );


    if (
        !textureProperty ||
        !textureProperty.value
    ) {

        throw new Error(
            "Keine Skin-Textur gefunden."
        );
    }


    /*
        The texture property is
        Base64 encoded JSON.
    */

    const textureJSON =
        JSON.parse(
            decodeBase64(
                textureProperty.value
            )
        );


    const skin =
        textureJSON
            ?.textures
            ?.SKIN;


    if (
        !skin ||
        !skin.url
    ) {

        throw new Error(
            "Dieser Spieler hat keinen abrufbaren Skin."
        );
    }


    /*
        Model can be included by Mojang
        as metadata.model = slim.
    */

    const metadata =
        skin.metadata || {};

    const model =
        metadata.model === "slim"
            ? "slim"
            : "classic";


    return {
        uuid,
        username:
            session.name ||
            profile.name ||
            username,
        skinURL:
            skin.url.replace(
                /^http:/,
                "https:"
            ),
        model
    };
}


/* =========================================================
   BASE64 DECODER
========================================================= */

function decodeBase64(value) {

    /*
        Mojang's texture value is
        normal Base64, but this implementation
        also tolerates URL-safe Base64.
    */

    let normalized =
        value
            .replace(/-/g, "+")
            .replace(/_/g, "/");

    while (
        normalized.length % 4 !== 0
    ) {
        normalized += "=";
    }


    const binary =
        atob(normalized);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for (
        let i = 0;
        i < binary.length;
        i++
    ) {
        bytes[i] =
            binary.charCodeAt(i);
    }


    return new TextDecoder()
        .decode(bytes);
}


/* =========================================================
   ASHCON FALLBACK
========================================================= */

async function lookupAshcon(
    username
) {

    const data =
        await fetchJSON(
            ASHCON_API +
            encodeURIComponent(
                username
            )
        );


    if (
        !data ||
        !data.uuid
    ) {

        throw new Error(
            "Der Fallback-Dienst hat keinen Spieler gefunden."
        );
    }


    /*
        Current Ashcon response uses:

        textures.skin.url
        textures.slim
    */

    const skinURL =
        data
            ?.textures
            ?.skin
            ?.url;


    if (!skinURL) {

        throw new Error(
            "Der Spieler wurde gefunden, aber es wurde kein Skin geliefert."
        );
    }


    const slim =
        Boolean(
            data
                ?.textures
                ?.slim
        );


    return {
        uuid:
            data.uuid,

        username:
            data.username ||
            username,

        skinURL:
            skinURL.replace(
                /^http:/,
                "https:"
            ),

        model:
            slim
                ? "slim"
                : "classic"
    };
}


/* =========================================================
   MAIN PLAYER LOOKUP
========================================================= */

async function lookupPlayer(
    username
) {

    let firstError =
        null;


    /*
        Try Mojang first.
    */

    try {

        return await lookupMojang(
            username
        );

    } catch (error) {

        console.warn(
            "Mojang lookup failed:",
            error
        );

        firstError =
            error;
    }


    /*
        Fallback.
    */

    try {

        return await lookupAshcon(
            username
        );

    } catch (error) {

        console.warn(
            "Ashcon fallback failed:",
            error
        );

        throw new Error(
            "Spieler nicht gefunden. Bitte überprüfe den Namen und versuche es erneut."
        );
    }
}


/* =========================================================
   TEXTURE LOADING
========================================================= */

function loadTexture(url) {

    return new Promise(
        (resolve, reject) => {

            const loader =
                new THREE.TextureLoader();

            loader.setCrossOrigin(
                "anonymous"
            );

            loader.load(
                url,

                texture => {

                    texture.colorSpace =
                        THREE.SRGBColorSpace;

                    texture.magFilter =
                        THREE.NearestFilter;

                    texture.minFilter =
                        THREE.NearestFilter;

                    texture.generateMipmaps =
                        false;

                    texture.wrapS =
                        THREE.ClampToEdgeWrapping;

                    texture.wrapT =
                        THREE.ClampToEdgeWrapping;

                    resolve(texture);
                },

                undefined,

                error => {
                    reject(error);
                }
            );
        }
    );
}


/* =========================================================
   TEXTURE REGION
========================================================= */

/*
    Creates a separate texture view of
    a rectangular region of the 64x64
    Minecraft skin atlas.

    This avoids the broken UV approach from
    the previous version.
*/

function createRegionTexture(
    source,
    x,
    y,
    width,
    height
) {

    const texture =
        source.clone();

    texture.needsUpdate =
        true;

    texture.wrapS =
        THREE.ClampToEdgeWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;

    texture.repeat.set(
        width / 64,
        height / 64
    );

    texture.offset.set(
        x / 64,
        1 -
        ((y + height) / 64)
    );

    texture.minFilter =
        THREE.NearestFilter;

    texture.magFilter =
        THREE.NearestFilter;

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.generateMipmaps =
        false;

    return texture;
}


/* =========================================================
   FACE MATERIALS
========================================================= */

function materialFor(
    source,
    region
) {

    return new THREE.MeshLambertMaterial({
        map:
            createRegionTexture(
                source,
                region.x,
                region.y,
                region.w,
                region.h
            ),

        transparent: true,

        alphaTest: .05
    });
}


/* =========================================================
   CUBE WITH MINECRAFT UV
========================================================= */

function minecraftCube(
    source,
    size,
    position,
    regions
) {

    const geometry =
        new THREE.BoxGeometry(
            size.x,
            size.y,
            size.z
        );


    /*
        BoxGeometry material order:

        +X
        -X
        +Y
        -Y
        +Z
        -Z
    */

    const materials = [

        materialFor(
            source,
            regions.right
        ),

        materialFor(
            source,
            regions.left
        ),

        materialFor(
            source,
            regions.top
        ),

        materialFor(
            source,
            regions.bottom
        ),

        materialFor(
            source,
            regions.front
        ),

        materialFor(
            source,
            regions.back
        )
    ];


    const mesh =
        new THREE.Mesh(
            geometry,
            materials
        );

    mesh.position.set(
        position.x,
        position.y,
        position.z
    );


    return mesh;
}


/* =========================================================
   REGION HELPERS
========================================================= */

function R(
    x,
    y,
    w,
    h
) {
    return {
        x,
        y,
        w,
        h
    };
}


/* =========================================================
   BUILD HEAD
========================================================= */

function buildHead(
    source,
    group
) {

    const head =
        minecraftCube(
            source,

            {
                x: 2,
                y: 2,
                z: 2
            },

            {
                x: 0,
                y: 2.9,
                z: 0
            },

            {
                top:
                    R(8,0,8,8),

                bottom:
                    R(16,0,8,8),

                left:
                    R(0,8,8,8),

                front:
                    R(8,8,8,8),

                right:
                    R(16,8,8,8),

                back:
                    R(24,8,8,8)
            }
        );

    group.add(
        head
    );


    /*
        Head outer layer / hat.
        It is slightly larger and uses
        the second-layer head UV region.
    */

    const hat =
        minecraftCube(
            source,

            {
                x: 2.12,
                y: 2.12,
                z: 2.12
            },

            {
                x: 0,
                y: 2.9,
                z: 0
            },

            {
                top:
                    R(40,0,8,8),

                bottom:
                    R(48,0,8,8),

                left:
                    R(32,8,8,8),

                front:
                    R(40,8,8,8),

                right:
                    R(48,8,8,8),

                back:
                    R(56,8,8,8)
            }
        );

    group.add(
        hat
    );
}


/* =========================================================
   BUILD BODY
========================================================= */

function buildBody(
    source,
    group
) {

    const body =
        minecraftCube(
            source,

            {
                x: 2,
                y: 2.5,
                z: 1
            },

            {
                x: 0,
                y: .55,
                z: 0
            },

            {
                top:
                    R(20,16,8,4),

                bottom:
                    R(28,16,8,4),

                left:
                    R(16,20,4,12),

                front:
                    R(20,20,8,12),

                right:
                    R(28,20,4,12),

                back:
                    R(32,20,8,12)
            }
        );

    group.add(
        body
    );


    /*
        Jacket outer layer.
    */

    const jacket =
        minecraftCube(
            source,

            {
                x: 2.12,
                y: 2.62,
                z: 1.12
            },

            {
                x: 0,
                y: .55,
                z: 0
            },

            {
                top:
                    R(20,32,8,4),

                bottom:
                    R(28,32,8,4),

                left:
                    R(16,36,4,12),

                front:
                    R(20,36,8,12),

                right:
                    R(28,36,4,12),

                back:
                    R(32,36,8,12)
            }
        );

    group.add(
        jacket
    );
}


/* =========================================================
   BUILD ARM
========================================================= */

function buildArm(
    source,
    group,
    side,
    slim
) {

    const width =
        slim ? 0.75 : 1;


    const x =
        side === "right"
            ? 1.5
            : -1.5;


    /*
        Character right arm:
        x = 44..56

        Character left arm:
        x = 36..48, y = 52
    */

    let regions;


    if (
        side === "right"
    ) {

        const armW =
            slim ? 3 : 4;

        regions = {

            top:
                R(44,16,armW,4),

            bottom:
                R(48,16,armW,4),

            left:
                R(40,20,4,12),

            front:
                R(44,20,armW,12),

            right:
                R(
                    44 + armW,
                    20,
                    4,
                    12
                ),

            back:
                R(
                    48 + (slim ? -1 : 0),
                    20,
                    armW,
                    12
                )
        };

    } else {

        const armW =
            slim ? 3 : 4;


        regions = {

            top:
                R(36,48,armW,4),

            bottom:
                R(
                    40,
                    48,
                    armW,
                    4
                ),

            left:
                R(
                    32,
                    52,
                    4,
                    12
                ),

            front:
                R(
                    36,
                    52,
                    armW,
                    12
                ),

            right:
                R(
                    36 + armW,
                    52,
                    4,
                    12
                ),

            back:
                R(
                    40 + (slim ? -1 : 0),
                    52,
                    armW,
                    12
                )
        };
    }


    const arm =
        minecraftCube(
            source,

            {
                x: width,
                y: 2.5,
                z: 1
            },

            {
                x,
                y: .55,
                z: 0
            },

            regions
        );


    group.add(
        arm
    );


    /*
        Sleeve layer.
    */

    let overlay;


    if (
        side === "right"
    ) {

        overlay = {

            top:
                R(44,36,4,4),

            bottom:
                R(48,36,4,4),

            left:
                R(40,36,4,12),

            front:
                R(44,36,4,12),

            right:
                R(48,36,4,12),

            back:
                R(52,36,4,12)
        };

    } else {

        overlay = {

            top:
                R(52,48,4,4),

            bottom:
                R(56,48,4,4),

            left:
                R(48,52,4,12),

            front:
                R(52,52,4,12),

            right:
                R(56,52,4,12),

            back:
                R(60,52,4,12)
        };
    }


    const sleeve =
        minecraftCube(
            source,

            {
                x:
                    width + .12,

                y:
                    2.62,

                z:
                    1.12
            },

            {
                x,
                y: .55,
                z: 0
            },

            overlay
        );


    group.add(
        sleeve
    );
}


/* =========================================================
   BUILD LEG
========================================================= */

function buildLeg(
    source,
    group,
    side
) {

    const x =
        side === "right"
            ? .5
            : -.5;


    const baseX =
        side === "right"
            ? 0
            : 16;


    const leg =
        minecraftCube(
            source,

            {
                x: 1,
                y: 2.5,
                z: 1
            },

            {
                x,
                y: -1.95,
                z: 0
            },

            {
                top:
                    R(
                        baseX + 4,
                        16,
                        4,
                        4
                    ),

                bottom:
                    R(
                        baseX + 8,
                        16,
                        4,
                        4
                    ),

                left:
                    R(
                        baseX,
                        20,
                        4,
                        12
                    ),

                front:
                    R(
                        baseX + 4,
                        20,
                        4,
                        12
                    ),

                right:
                    R(
                        baseX + 8,
                        20,
                        4,
                        12
                    ),

                back:
                    R(
                        baseX + 12,
                        20,
                        4,
                        12
                    )
            }
        );

    group.add(
        leg
    );


    /*
        Trouser / boot outer layer.
    */

    const overlayX =
        side === "right"
            ? 0
            : 16;


    const pants =
        minecraftCube(
            source,

            {
                x: 1.12,
                y: 2.62,
                z: 1.12
            },

            {
                x,
                y: -1.95,
                z: 0
            },

            {
                top:
                    R(
                        overlayX + 4,
                        48,
                        4,
                        4
                    ),

                bottom:
                    R(
                        overlayX + 8,
                        48,
                        4,
                        4
                    ),

                left:
                    R(
                        overlayX,
                        36,
                        4,
                        12
                    ),

                front:
                    R(
                        overlayX + 4,
                        36,
                        4,
                        12
                    ),

                right:
                    R(
                        overlayX + 8,
                        36,
                        4,
                        12
                    ),

                back:
                    R(
                        overlayX + 12,
                        36,
                        4,
                        12
                    )
            }
        );

    group.add(
        pants
    );
}


/* =========================================================
   BUILD COMPLETE PLAYER
========================================================= */

function buildPlayer(
    texture,
    model
) {

    if (playerGroup) {

        scene.remove(
            playerGroup
        );
    }


    playerGroup =
        new THREE.Group();


    playerGroup.position.y =
        .15;


    scene.add(
        playerGroup
    );


    const slim =
        model === "slim";


    buildHead(
        texture,
        playerGroup
    );


    buildBody(
        texture,
        playerGroup
    );


    buildArm(
        texture,
        playerGroup,
        "right",
        slim
    );


    buildArm(
        texture,
        playerGroup,
        "left",
        slim
    );


    buildLeg(
        texture,
        playerGroup,
        "right"
    );


    buildLeg(
        texture,
        playerGroup,
        "left"
    );
}


/* =========================================================
   LOAD PLAYER
========================================================= */

async function loadPlayer(
    username
) {

    const clean =
        cleanUsername(
            username
        );


    if (!clean) {

        showError(
            "Bitte gib einen Minecraft-Spielernamen ein."
        );

        return;
    }


    if (
        !/^[A-Za-z0-9_]{1,16}$/.test(
            clean
        )
    ) {

        showError(
            "Minecraft-Namen dürfen nur Buchstaben, Zahlen und _ enthalten und maximal 16 Zeichen lang sein."
        );

        return;
    }


    hideError();

    showLoading();


    try {

        const player =
            await lookupPlayer(
                clean
            );


        const texture =
            await loadTexture(
                player.skinURL
            );


        currentPlayer =
            player;

        currentSkinURL =
            player.skinURL;

        currentModel =
            player.model;


        nameValue.textContent =
            player.username;

        uuidValue.textContent =
            player.uuid;

        modelValue.textContent =
            player.model === "slim"
                ? "Alex / Slim"
                : "Steve / Classic";


        viewerPlayer.textContent =
            player.username;


        buildPlayer(
            texture,
            player.model
        );


        resetView();


    } catch (error) {

        console.error(
            error
        );

        showError(
            error.message ||
            "Der Spieler konnte nicht geladen werden."
        );

    } finally {

        hideLoading();
    }
}


/* =========================================================
   VIEW CONTROLS
========================================================= */

function resetView() {

    targetRotationY =
        0;

    currentRotationY =
        0;

    targetRotationX =
        0;

    currentRotationX =
        0;

    targetZoom =
        8;

    currentZoom =
        8;
}


searchButton.addEventListener(
    "click",
    () => {
        loadPlayer(
            usernameInput.value
        );
    }
);


usernameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            loadPlayer(
                usernameInput.value
            );
        }
    }
);


resetButton.addEventListener(
    "click",
    resetView
);


frontButton.addEventListener(
    "click",
    () => {

        targetRotationY =
            0;

        targetRotationX =
            0;
    }
);


exampleButton.addEventListener(
    "click",
    () => {

        const examples = [
            "Notch",
            "jeb_",
            "Dinnerbone",
            "Grumm",
            "CaptainSparklez"
        ];


        const selected =
            examples[
                Math.floor(
                    Math.random() *
                    examples.length
                )
            ];


        usernameInput.value =
            selected;


        loadPlayer(
            selected
        );
    }
);


skinButton.addEventListener(
    "click",
    () => {

        if (
            currentSkinURL
        ) {

            window.open(
                currentSkinURL,
                "_blank",
                "noopener,noreferrer"
            );
        }
    }
);


/* =========================================================
   MOUSE / TOUCH
========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        dragging =
            true;

        pointerX =
            event.clientX;

        pointerY =
            event.clientY;

        canvas.setPointerCapture(
            event.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (!dragging)
            return;


        const dx =
            event.clientX -
            pointerX;

        const dy =
            event.clientY -
            pointerY;


        pointerX =
            event.clientX;

        pointerY =
            event.clientY;


        targetRotationY +=
            dx * .012;

        targetRotationX +=
            dy * .006;


        targetRotationX =
            THREE.MathUtils.clamp(
                targetRotationX,
                -.55,
                .55
            );
    }
);


canvas.addEventListener(
    "pointerup",
    () => {

        dragging =
            false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        dragging =
            false;
    }
);


canvas.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        targetZoom +=
            event.deltaY * .008;


        targetZoom =
            THREE.MathUtils.clamp(
                targetZoom,
                4.5,
                12
            );

    },
    {
        passive: false
    }
);


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    currentRotationY +=
        (
            targetRotationY -
            currentRotationY
        ) * .12;


    currentRotationX +=
        (
            targetRotationX -
            currentRotationX
        ) * .12;


    currentZoom +=
        (
            targetZoom -
            currentZoom
        ) * .1;


    if (playerGroup) {

        playerGroup.rotation.y =
            currentRotationY;

        playerGroup.rotation.x =
            currentRotationX;
    }


    camera.position.z =
        currentZoom;


    camera.lookAt(
        0,
        .15,
        0
    );


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   INITIAL PLAYER
========================================================= */

loadPlayer(
    "Notch"
);
</script>
