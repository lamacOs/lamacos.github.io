<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --accent:#ff7a00;
    --bg:#f6f8fb;
    --card:rgba(255,255,255,.88);
    --text:#111827;
    --muted:#64748b;
    --border:rgba(0,0,0,.08);
    --shadow:0 10px 30px rgba(0,0,0,.08);
}

[data-theme="dark"]{
    --bg:#0b1220;
    --card:rgba(15,23,42,.88);
    --text:#ffffff;
    --muted:#94a3b8;
    --border:rgba(255,255,255,.08);
    --shadow:0 10px 30px rgba(0,0,0,.35);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:.25s;
}

.navbar{
    max-width:1400px;
    margin:auto;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand img{
    width:44px;
    height:44px;
    object-fit:contain;
}

.brand span{
    font-weight:800;
    font-size:1.2rem;
}

button{
    border:none;
    cursor:pointer;
    transition:.2s;
}

.theme-btn,
.action-btn{
    background:var(--accent);
    color:white;
    border-radius:12px;
    padding:12px 18px;
    font-weight:600;
}

button:hover{
    transform:translateY(-2px);
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.hero{
    text-align:center;
    margin-bottom:30px;
}

.hero h1{
    color:var(--accent);
    font-size:3rem;
    margin-bottom:10px;
}

.hero p{
    color:var(--muted);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card{
    background:var(--card);
    backdrop-filter:blur(14px);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:20px;
}

h1,h2,h3,h4,h5,h6{
    color:var(--accent);
}

.card h2{
    margin-bottom:15px;
}

textarea{
    width:100%;
    min-height:250px;
    resize:vertical;

    border-radius:12px;
    border:1px solid var(--border);

    background:transparent;
    color:var(--text);

    padding:14px;
    font-family:monospace;
    font-size:14px;
}

.actions{
    margin-top:20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.output{
    margin-top:20px;
}

#output{
    min-height:250px;
}

.preview{
    width:100%;
    height:500px;
    border:none;
    border-radius:16px;
    background:white;
}

footer{
    text-align:center;
    margin-top:40px;
    padding:30px;
    color:var(--muted);
}

@media(max-width:1000px){

    .grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:2rem;
    }
}
</style>
</head>
<div id="lamac-ai">
  <button id="lamac-ai-open" aria-label="Kundensupport öffnen">💬</button>

  <section id="lamac-ai-window" aria-label="lamachub Kundensupport">
    <header>
      <div>
        <strong>lamachub Kundenservice</strong>
        <small>KI-gestützter Support</small>
      </div>
      <button id="lamac-ai-close" aria-label="Chat schließen">×</button>
    </header>

    <div id="lamac-ai-messages">
      <div class="lamac-bot">Hallo! Wie kann ich Ihnen weiterhelfen?</div>
    </div>

    <form id="lamac-ai-form">
      <input id="lamac-ai-input" placeholder="Nachricht schreiben" maxlength="1800">
      <button aria-label="Senden">➤</button>
    </form>
  </section>
</div>

<style>
  #lamac-ai { font-family:Arial,sans-serif; }
  #lamac-ai-open {
    position:fixed; right:24px; bottom:24px; z-index:9999;
    width:58px; height:58px; border:0; border-radius:50%;
    background:#007e62; color:#fff; font-size:25px; cursor:pointer;
    box-shadow:0 8px 24px #0004;
  }
  #lamac-ai-window {
    display:none; position:fixed; right:24px; bottom:94px; z-index:9999;
    width:min(370px,calc(100vw - 32px)); height:520px;
    overflow:hidden; border-radius:16px; background:#efeae2;
    box-shadow:0 12px 40px #0004;
  }
  #lamac-ai-window.open { display:flex; flex-direction:column; }
  #lamac-ai-window header {
    display:flex; justify-content:space-between; align-items:center;
    padding:15px; color:#fff; background:#11211d;
  }
  #lamac-ai-window small { display:block; margin-top:2px; color:#b5c6bf; font-size:11px; }
  #lamac-ai-close { border:0; background:transparent; color:#fff; font-size:27px; cursor:pointer; }
  #lamac-ai-messages { flex:1; overflow:auto; padding:15px; }
  .lamac-bot, .lamac-user {
    max-width:82%; margin:8px 0; padding:10px; border-radius:10px;
    white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px;
  }
  .lamac-bot { background:#fff; }
  .lamac-user { margin-left:auto; background:#d8f8e8; }
  #lamac-ai-form { display:flex; gap:8px; padding:11px; background:#f0f2f5; }
  #lamac-ai-input { flex:1; min-width:0; border:0; border-radius:20px; padding:11px; }
  #lamac-ai-form button { width:42px; border:0; border-radius:50%; background:#007e62; color:#fff; cursor:pointer; }
</style>

<script>
  const WORKER_URL = "https://lamacai.oslamu.workers.dev/chat";

  const chatWindow = document.querySelector("#lamac-ai-window");
  const chatMessages = document.querySelector("#lamac-ai-messages");
  const chatInput = document.querySelector("#lamac-ai-input");
  let history = [];
  let messageCount = 0;

  document.querySelector("#lamac-ai-open").onclick = () => {
    chatWindow.classList.add("open");
    chatInput.focus();
  };

  document.querySelector("#lamac-ai-close").onclick = () => {
    chatWindow.classList.remove("open");
  };

  function addMessage(text, type) {
    const item = document.createElement("div");
    item.className = type;
    item.textContent = text;
    chatMessages.appendChild(item);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  document.querySelector("#lamac-ai-form").onsubmit = async event => {
    event.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;

    addMessage(text, "lamac-user");
    chatInput.value = "";
    messageCount++;

    if (messageCount === 15) {
      addMessage(
        "Hinweis: Bitte fassen Sie Ihr Anliegen möglichst in wenigen, konkreten Nachrichten zusammen.",
        "lamac-bot"
      );
    }

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error);

      addMessage(data.reply, "lamac-bot");
      history.push(
        { role: "user", content: text },
        { role: "assistant", content: data.reply }
      );

      history = history.slice(-12);
    } catch {
      addMessage(
        "Der Kundenservice ist gerade nicht erreichbar. Bitte versuchen Sie es später erneut.",
        "lamac-bot"
      );
    }
  };
</script>
<body>

<nav class="navbar">
    <div class="brand">
        <img src="https://raw.githubusercontent.com/lamacOs/lamacos.github.io/refs/heads/main/logo.png" alt="Logo">
        <span>lamacOs</span>
    </div>

    <button id="themeToggle" class="theme-btn">
        Dark Mode
    </button>
</nav>

<div class="container">

    <div class="hero">
        <h1>HTML Builder</h1>
        <p>HTML, CSS und JavaScript eingeben und als vollständige HTML-Datei generieren.</p>
    </div>

    <div class="grid">

        <div class="card">

            <h2>HTML</h2>

            <textarea id="htmlInput" placeholder="<h1>Hallo Welt</h1>"></textarea>

            <h2 style="margin-top:20px;">CSS</h2>

            <textarea id="cssInput" placeholder="body{background:red;}"></textarea>

            <h2 style="margin-top:20px;">JavaScript</h2>

            <textarea id="jsInput" placeholder="console.log('Hallo');"></textarea>

            <div class="actions">
                <button class="action-btn" onclick="generateHTML()">
                    HTML generieren
                </button>

                <button class="action-btn" onclick="copyHTML()">
                    Kopieren
                </button>

                <button class="action-btn" onclick="downloadHTML()">
                    Herunterladen
                </button>

                <button class="action-btn" onclick="updatePreview()">
                    Vorschau aktualisieren
                </button>

                <!-- 🔥 NEU -->
                <button class="action-btn" onclick="toggleFullscreen()">
                    Vollbild
                </button>
            </div>

        </div>

        <div class="card">

            <h2>Generierter HTML-Code</h2>

            <textarea id="output" readonly></textarea>

            <h2 style="margin-top:20px;">Live Vorschau</h2>

            <iframe id="preview" class="preview"></iframe>

        </div>

    </div>

</div>

<footer>
    © 2026 lamacHub
</footer>

<script>
const themeToggle =
document.getElementById("themeToggle");

if(localStorage.getItem("theme")==="dark"){
    document.documentElement.setAttribute(
        "data-theme",
        "dark"
    );
    themeToggle.textContent="Light Mode";
}

themeToggle.onclick=()=>{

    const dark =
    document.documentElement.getAttribute(
        "data-theme"
    )==="dark";

    if(dark){

        document.documentElement.setAttribute(
            "data-theme",
            "light"
        );

        localStorage.setItem(
            "theme",
            "light"
        );

        themeToggle.textContent=
        "Dark Mode";

    }else{

        document.documentElement.setAttribute(
            "data-theme",
            "dark"
        );

        localStorage.setItem(
            "theme",
            "dark"
        );

        themeToggle.textContent=
        "Light Mode";
    }
};

function buildHTML(){

    const html =
    document.getElementById(
        "htmlInput"
    ).value;

    const css =
    document.getElementById(
        "cssInput"
    ).value;

    const js =
    document.getElementById(
        "jsInput"
    ).value;

    return `<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
${css}
</style>
</head>
<body>

${html}

<script>
${js}
<\/script>

</body>
</html>`;
}

function generateHTML(){

    document.getElementById(
        "output"
    ).value = buildHTML();
}

function updatePreview(){

    const iframe =
    document.getElementById(
        "preview"
    );

    iframe.srcdoc = buildHTML();

    generateHTML();
}

function copyHTML(){

    generateHTML();

    navigator.clipboard.writeText(
        document.getElementById(
            "output"
        ).value
    );

    alert(
        "HTML kopiert."
    );
}

function downloadHTML(){

    generateHTML();

    const content =
    document.getElementById(
        "output"
    ).value;

    const blob =
    new Blob(
        [content],
        {
            type:"text/html"
        }
    );

    const a =
    document.createElement(
        "a"
    );

    a.href =
    URL.createObjectURL(
        blob
    );

    a.download =
    "website.html";

    a.click();

    URL.revokeObjectURL(
        a.href
    );
}

/* 🔥 NEU: FULLSCREEN */
function toggleFullscreen(){

    const iframe =
    document.getElementById("preview");

    if(!document.fullscreenElement){
        iframe.requestFullscreen();
    }else{
        document.exitFullscreen();
    }
}

updatePreview();
</script>

</body>
</html>
