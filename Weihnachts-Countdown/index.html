


<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Christmas Countdown</title>

<!-- iOS Web-App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Christmas">

<!-- Android -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#071b13">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  padding: 20px;

  background: radial-gradient(
    circle at top,
    #17452e 0%,
    #071b13 55%,
    #020806 100%
  );

  color: white;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  text-align: center;
  position: relative;
}

h1 {
  font-size: clamp(2rem, 6vw, 4rem);
  text-shadow: 0 0 20px #e6b84b;
  z-index: 1;
}

#countdown {
  font-size: clamp(1.4rem, 5vw, 3rem);
  margin-top: 15px;
  letter-spacing: 2px;
  color: #ffe5a0;
  text-shadow: 0 0 15px #d49b35;
  z-index: 1;
}

.subtitle {
  color: #c8e8d3;
  margin-top: 15px;
  font-size: 1.1rem;
  z-index: 1;
}

#newyear {
  display: none;
  font-size: clamp(2.5rem, 9vw, 5rem);
  margin-top: 25px;
  color: #ffe5a0;
  text-shadow: 0 0 25px gold, 0 0 55px #ff3333;
  animation: pop 1.2s ease forwards;
  z-index: 1;
}

@keyframes pop {
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}

.snow {
  position: absolute;
  top: -15px;
  color: white;
  pointer-events: none;
  animation: snowfall linear forwards;
  z-index: 0;
}

@keyframes snowfall {
  to {
    transform: translateY(110vh) translateX(60px);
    opacity: 0.2;
  }
}

.tree {
  font-size: clamp(3rem, 8vw, 5rem);
  margin-top: 10px;
  filter: drop-shadow(0 0 15px #27ae60);
  z-index: 1;
}

.gift {
  position: absolute;
  bottom: 15px;
  font-size: 3rem;
  animation: gift 2s ease-in-out infinite alternate;
  z-index: 1;
}

@keyframes gift {
  to { transform: translateY(-15px) rotate(10deg); }
}

/* Vollbild-Button */

#fullscreenBtn {
  position: fixed;
  top: max(15px, env(safe-area-inset-top));
  right: max(15px, env(safe-area-inset-right));
  z-index: 1000;

  padding: 12px 18px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 12px;

  background: rgba(255,255,255,0.12);
  color: white;

  font-size: 15px;
  font-weight: 600;
  cursor: pointer;

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* iOS Installationshinweis */

#iosHint {
  display: none;
  position: fixed;
  left: 50%;
  bottom: max(65px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(90%, 360px);

  padding: 16px;
  border-radius: 16px;

  background: rgba(0,0,0,0.85);
  border: 1px solid rgba(255,255,255,0.2);

  color: white;
  font-size: 14px;
  line-height: 1.5;
  z-index: 2000;
}

#iosHint button {
  margin-top: 10px;
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  background: #27ae60;
  color: white;
  font-weight: bold;
}

/* Querformat */

@media (orientation: landscape) {
  body {
    padding: 10px 80px;
  }

  h1 {
    font-size: clamp(1.5rem, 5vw, 3rem);
    margin: 5px 0;
  }

  .tree {
    font-size: clamp(2rem, 6vw, 3.5rem);
    margin-top: 0;
  }

  #countdown {
    font-size: clamp(1.3rem, 4vw, 2.5rem);
    margin-top: 5px;
  }

  .subtitle {
    margin-top: 5px;
    font-size: 1rem;
  }

  .gift {
    font-size: 2rem;
  }
}

@media (max-width: 500px) {
  #countdown {
    letter-spacing: 0;
  }

  h1 {
    max-width: 95%;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<button id="fullscreenBtn" onclick="toggleFullscreen()">
  ⛶ Vollbild
</button>

<div id="iosHint">
  <strong>📱 Vollbild auf dem iPhone</strong>
  <br><br>
  Tippe auf das Teilen-Symbol in Safari und anschließend auf
  <strong>„Zum Home-Bildschirm“</strong>.
  <br>
  Öffne danach den Countdown über das neue Symbol.
  <button onclick="closeHint()">Verstanden</button>
</div>

<h1>🎄 Countdown bis Weihnachten 🎄</h1>

<div class="tree">🎄</div>

<div id="countdown">Lädt...</div>

<div class="subtitle">
  Die schönste Zeit des Jahres steht bevor ✨
</div>

<div id="newyear">
  🎅 MERRY CHRISTMAS! 🎁
</div>

<div class="gift">🎁</div>

<script>
const countdownEl = document.getElementById("countdown");
const newyearEl = document.getElementById("newyear");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const iosHint = document.getElementById("iosHint");

let finished = false;

/* Geräteerkennung */

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

const isStandalone =
  window.navigator.standalone === true ||
  window.matchMedia("(display-mode: standalone)").matches;

/* Vollbild */

async function toggleFullscreen() {

  // iOS: Eine installierte Web-App läuft bereits
  // im eigenständigen Vollbildmodus.
  if (isIOS) {

    if (!isStandalone) {
      iosHint.style.display = "block";
    } else {
      fullscreenBtn.style.display = "none";
    }

    return;
  }

  // Andere Geräte
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();

      if (screen.orientation?.lock) {
        try {
          await screen.orientation.lock("landscape");
        } catch (e) {}
      }
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.log("Vollbild nicht verfügbar:", error);
  }

  updateFullscreenButton();
}

function updateFullscreenButton() {

  if (isIOS && isStandalone) {
    fullscreenBtn.style.display = "none";
    return;
  }

  fullscreenBtn.textContent = document.fullscreenElement
    ? "✕ Vollbild verlassen"
    : "⛶ Vollbild";
}

function closeHint() {
  iosHint.style.display = "none";
}

document.addEventListener("fullscreenchange", updateFullscreenButton);

updateFullscreenButton();

/* Weihnachten */

function getChristmas() {
  const now = new Date();
  return new Date(now.getFullYear(), 11, 24, 0, 0, 0);
}

const target = getChristmas();

function updateCountdown() {

  if (finished) return;

  const now = new Date();
  const diff = target - now;

  if (diff <= 0) {

    finished = true;

    countdownEl.style.display = "none";
    document.querySelector(".subtitle").style.display = "none";
    newyearEl.style.display = "block";

    speak("Merry Christmas! Frohe Weihnachten!");
    createSnow(150);

    if (navigator.vibrate) {
      navigator.vibrate([200, 100, 200, 100, 400]);
    }

    return;
  }

  const d = Math.floor(diff / 86400000);
  const h = Math.floor(diff / 3600000) % 24;
  const m = Math.floor(diff / 60000) % 60;
  const s = Math.floor(diff / 1000) % 60;

  countdownEl.textContent =
    `${d} Tage ${h} Std. ${m} Min. ${s} Sek.`;
}

/* Sprachausgabe */

function speak(text) {

  if (!("speechSynthesis" in window)) return;

  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-US";
  msg.rate = 0.9;

  speechSynthesis.speak(msg);
}

/* Schneefall */

function createSnow(amount) {

  for (let i = 0; i < amount; i++) {

    const snow = document.createElement("div");

    snow.className = "snow";
    snow.textContent = Math.random() > 0.5 ? "❄" : "❅";

    snow.style.left = Math.random() * 100 + "vw";
    snow.style.fontSize = 10 + Math.random() * 20 + "px";
    snow.style.animationDuration = 3 + Math.random() * 5 + "s";

    document.body.appendChild(snow);

    setTimeout(() => snow.remove(), 8500);
  }
}

/* Ständiger Schneefall */

setInterval(() => createSnow(3), 250);

/* Countdown starten */

updateCountdown();
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
