  <div id="lamac-ai">
  <button id="lamac-ai-open" aria-label="Kundensupport öffnen">💬</button>

  <section id="lamac-ai-window" aria-label="lamachub Kundensupport">
    <header>
      <div>
        <strong>lamachub Kundenservice</strong>
        <small>KI-gestützter Support</small>
      </div>
      <button id="lamac-ai-close" aria-label="Chat schließen">×</button>
    </header>

    <div id="lamac-ai-messages">
      <div class="lamac-bot">Hallo! Wie kann ich Ihnen weiterhelfen?</div>
    </div>

    <form id="lamac-ai-form">
      <input id="lamac-ai-input" placeholder="Nachricht schreiben" maxlength="1800">
      <button aria-label="Senden">➤</button>
    </form>

<style>
  #lamac-ai { font-family:Arial,sans-serif; }
  #lamac-ai-open {
    position:fixed; right:24px; bottom:24px; z-index:9999;
    width:58px; height:58px; border:0; border-radius:50%;
    background:#007e62; color:#fff; font-size:25px; cursor:pointer;
    box-shadow:0 8px 24px #0004;
  }
  #lamac-ai-window {
    display:none; position:fixed; right:24px; bottom:94px; z-index:9999;
    width:min(370px,calc(100vw - 32px)); height:520px;
    overflow:hidden; border-radius:16px; background:#efeae2;
    box-shadow:0 12px 40px #0004;
  }
  #lamac-ai-window.open { display:flex; flex-direction:column; }
  #lamac-ai-window header {
    display:flex; justify-content:space-between; align-items:center;
    padding:15px; color:#fff; background:#11211d;
  }
  #lamac-ai-window small { display:block; margin-top:2px; color:#b5c6bf; font-size:11px; }
  #lamac-ai-close { border:0; background:transparent; color:#fff; font-size:27px; cursor:pointer; }
  #lamac-ai-messages { flex:1; overflow:auto; padding:15px; }
  .lamac-bot, .lamac-user {
    max-width:82%; margin:8px 0; padding:10px; border-radius:10px;
    white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px;
  }
  .lamac-bot { background:#fff; }
  .lamac-user { margin-left:auto; background:#d8f8e8; }
  #lamac-ai-form { display:flex; gap:8px; padding:11px; background:#f0f2f5; }
  #lamac-ai-input { flex:1; min-width:0; border:0; border-radius:20px; padding:11px; }
  #lamac-ai-form button { width:42px; border:0; border-radius:50%; background:#007e62; color:#fff; cursor:pointer; }
</style>

<script>
  const WORKER_URL = "https://lamacai.oslamu.workers.dev/chat";

  const chatWindow = document.querySelector("#lamac-ai-window");
  const chatMessages = document.querySelector("#lamac-ai-messages");
  const chatInput = document.querySelector("#lamac-ai-input");
  let history = [];
  let messageCount = 0;

  document.querySelector("#lamac-ai-open").onclick = () => {
    chatWindow.classList.add("open");
    chatInput.focus();
  };

  document.querySelector("#lamac-ai-close").onclick = () => {
    chatWindow.classList.remove("open");
  };

  function addMessage(text, type) {
    const item = document.createElement("div");
    item.className = type;
    item.textContent = text;
    chatMessages.appendChild(item);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  document.querySelector("#lamac-ai-form").onsubmit = async event => {
    event.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;

    addMessage(text, "lamac-user");
    chatInput.value = "";
    messageCount++;

    if (messageCount === 15) {
      addMessage(
        "Hinweis: Bitte fassen Sie Ihr Anliegen möglichst in wenigen, konkreten Nachrichten zusammen.",
        "lamac-bot"
      );
    }

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error);

      addMessage(data.reply, "lamac-bot");
      history.push(
        { role: "user", content: text },
        { role: "assistant", content: data.reply }
      );

      history = history.slice(-12);
    } catch {
      addMessage(
        "Der Kundenservice ist gerade nicht erreichbar. Bitte versuchen Sie es später erneut.",
        "lamac-bot"
      );
    }
  };
</script>
<body>
<title>FlohmarktScanner</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f5f6f8;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --accent:#ff7a00;

  --bg:#0b0f17;
  --card:#111827;
  --text:#e5e7eb;
  --muted:#9ca3af;

body{
  margin:0;
  font-family:Inter, sans-serif;

  max-width:1000px;

/* CAMERA */
#cameraArea{

  margin-top:20px;

video, canvas{
  width:100%;

<body class="light">

<div class="container">

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">
      <img src="https://raw.githubusercontent.com/lamacos/lamacos.github.io/refs/heads/main/logo.png">
      <span>FlohmarktScanner</span>
    </div>

    <button class="toggleBtn" onclick="toggleMode()">🌗</button>
  </div>

  <!-- HERO -->
  <div class="hero">
    <h1>FlohmarktScanner</h1>
    <p>Scanne Gegenstände und speichere Preise smarter 🔍</p>
  </div>

  <div class="card">

    <div class="buttonGrid" id="startButtons">
      <button class="mainButton" onclick="startAdd()">📦 Neues Objekt hinzufügen</button>
      <button class="mainButton" onclick="startScan()">🔍 Objekt scannen</button>
    </div>

    <div id="cameraArea">
      <video id="camera" autoplay playsinline></video>
      <canvas id="snapshot"></canvas>

      <div class="controls">
        <button class="smallButton" onclick="takePicture()">📸 Foto</button>
        <button class="smallButton" onclick="switchCamera()">🔄 Kamera</button>
        <button class="smallButton" onclick="cancel()">✖ Abbrechen</button>
      </div>
    </div>

    <div id="priceInput">
      <input type="text" id="price" placeholder="z.B. 3.50">
      <button class="mainButton" onclick="saveObject()">Speichern</button>
    </div>

  </div>
</div>

<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('snapshot');
const ctx = canvas.getContext('2d');

const priceDiv = document.getElementById('priceInput');
const priceInput = document.getElementById('price');
const startButtons = document.getElementById('startButtons');
const cameraArea = document.getElementById('cameraArea');

let mode = '';
let currentImageData = null;
let stream = null;
let useFront = false;

/* DARK/LIGHT */
function toggleMode(){
  document.body.classList.toggle('dark');
  document.body.classList.toggle('light');
}

/* CAMERA */
function startCamera(){
  if(stream){
    stream.getTracks().forEach(t => t.stop());
  }

  navigator.mediaDevices.getUserMedia({
    video:{ facingMode: useFront ? 'user' : 'environment' }
  }).then(s=>{
    stream = s;
    video.srcObject = stream;
    cameraArea.style.display = 'block';
  }).catch(e=>{
    alert('Kamera Fehler: ' + e);
  });
}

function switchCamera(){
  useFront = !useFront;
  startCamera();
}

/* MODES */
function startAdd(){
  mode='add';
  startButtons.style.display='none';
  priceDiv.style.display='none';
  startCamera();
}

function startScan(){
  mode='scan';
  startButtons.style.display='none';
  priceDiv.style.display='none';
  startCamera();
}

/* PHOTO */
function takePicture(){
  const temp = document.createElement('canvas');
  const tctx = temp.getContext('2d');

  temp.width = 200;
  temp.height = 200;

  tctx.drawImage(video,0,0,video.videoWidth,video.videoHeight,0,0,200,200);

  currentImageData = temp.toDataURL('image/jpeg',0.6);

  canvas.width = 200;
  canvas.height = 200;
  ctx.drawImage(temp,0,0);

  video.style.display='none';
  canvas.style.display='block';

  if(mode==='add'){
    priceDiv.style.display='block';
  } else {
    scanObject();
  }
}

/* CANCEL */
function cancel(){
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
  cameraArea.style.display='none';
  priceDiv.style.display='none';
  startButtons.style.display='grid';
  video.style.display='block';
  canvas.style.display='none';
}

/* SAVE */
function saveObject(){
  const price = parseFloat(priceInput.value.replace(',','.'));

  if(!currentImageData || isNaN(price)){
    alert('Ungültig');
    return;
  }

  const list = JSON.parse(localStorage.getItem('objects')||'[]');

  list.push({image:currentImageData,price:price.toFixed(2)});
  localStorage.setItem('objects',JSON.stringify(list));

  alert('Gespeichert!');
  cancel();
}

/* SCAN */
async function scanObject(){
  const ref = await getAvgColor(currentImageData);
  const list = JSON.parse(localStorage.getItem('objects')||'[]');

  let best=null;
  let bestScore=999999;

  for(const obj of list){
    const cmp = await getAvgColor(obj.image);

    const d = Math.sqrt(
      (ref.r-cmp.r)**2 +
      (ref.g-cmp.g)**2 +
      (ref.b-cmp.b)**2
    );

    if(d<bestScore){
      bestScore=d;
      best=obj;
    }
  }

  if(best && bestScore<40){
    alert('Preis: '+best.price+' €');
  } else {
    alert('Kein Treffer');
  }

  cancel();
}

/* COLOR */
function getAvgColor(dataUrl){
  return new Promise(resolve=>{
    const img=new Image();

    img.onload=()=>{
      const c=document.createElement('canvas');
      const x=c.getContext('2d');

      c.width=img.width;
      c.height=img.height;

      x.drawImage(img,0,0);

      const d=x.getImageData(0,0,20,20).data;

      let r=0,g=0,b=0,n=0;

      for(let i=0;i<d.length;i+=4){
        r+=d[i];
        g+=d[i+1];
        b+=d[i+2];
        n++;
      }

      resolve({r:r/n,g:g/n,b:b/n});
    };

    img.src=dataUrl;
  });
}
</script>
<script>
(function () {
  if (typeof window === 'undefined' || typeof document === 'undefined') return;

  // 1) Nur anzeigen, wenn der Referrer exakt https://www.lamachub.de ist
  let referrer = '';
  try { referrer = new URL(document.referrer); } catch (e) {}
  if (
    referrer.protocol !== 'https:' ||
    referrer.hostname.toLowerCase() !== 'www.lamachub.de'
  ) return;

  // 2) Container in Shadow DOM, damit die Styles der Host-Seite nicht stören
  const root = document.createElement('div');
  root.setAttribute('data-lamachub-back', '');
  Object.assign(root.style, {
    all: 'initial',
    position: 'fixed',
    top: '0',
    left: '0',
    zIndex: '2147483647',
    pointerEvents: 'none'
  });
  document.documentElement.appendChild(root);

  const shadow = root.attachShadow({ mode: 'open' });
  shadow.innerHTML = `
    <style>
      :host { all: initial; }
      button {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 12px;
        padding: 10px 16px;
        background: #ff6a00;
        color: #fff;
        font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,.2);
        transition: background .15s ease, transform .1s ease;
      }
      button:hover  { background: #e65f00; }
      button:active { transform: scale(.97); }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .arrow { font-size: 16px; line-height: 1; }
    </style>
    <button type="button" aria-label="Zurück zu lamachub.de">
      <span class="arrow">←</span>
      <span>Zurück</span>
    </button>
  `;

  shadow.querySelector('button').addEventListener('click', () => {
    // Navigation im selben Tab (window.top bricht ggf. aus iFrames aus)
    window.top.location.href = 'https://www.lamachub.de/';
  });
})();
</script>
