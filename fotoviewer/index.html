<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Viewer</title>
<style>
* {
    box-sizing: border-box;
}
:root {
    --orange: #ff7a00;
    --background: #f5f5f7;
    --card: #ffffff;
    --text: #171717;
    --muted: #777777;
    --border: #dddddd;
}
body.dark {
    --background: #111111;
    --card: #1c1c1e;
    --text: #ffffff;
    --muted: #aaaaaa;
    --border: #38383a;
}
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--background);
    color: var(--text);
}
/* HEADER */
header {
    height: 70px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--card);
}
.logo {
    color: var(--orange);
    font-size: 22px;
    font-weight: 800;
}
.theme {
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--card);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
}
/* MAIN */
main {
    width: min(900px, calc(100% - 30px));
    margin: 70px auto;
}
.hero {
    text-align: center;
    margin-bottom: 35px;
}
h1 {
    margin: 0;
    color: var(--orange);
    font-size: clamp(38px, 7vw, 64px);
    font-weight: 800;
}
.subtitle {
    margin-top: 15px;
    color: var(--muted);
    font-size: 17px;
}
/* CARD */
.card {
    padding: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.08);
}
/* INPUT */
.input-row {
    display: flex;
    gap: 10px;
}
#imageUrl {
    flex: 1;
    width: 100%;
    min-width: 0;
    height: 52px;
    padding: 0 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    outline: none;
    opacity: 1;
    -webkit-text-fill-color: var(--text);
}
#imageUrl::placeholder {
    color: var(--muted);
    opacity: 1;
}
#imageUrl:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(255,122,0,0.15);
}
/* BUTTON */
.show-button {
    height: 52px;
    padding: 0 24px;
    border: none;
    border-radius: 12px;
    background: var(--orange);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
.show-button:hover {
    background: #ff8c20;
}
/* MESSAGE */
.message {
    display: none;
    margin-top: 15px;
    padding: 13px;
    border-radius: 10px;
    font-size: 14px;
}
.message.error {
    display: block;
    background: #ffe5e5;
    color: #b00000;
}
.message.success {
    display: block;
    background: #e4f8e9;
    color: #08752c;
}
/* PREVIEW */
.preview {
    display: none;
    margin-top: 25px;
}
.preview.visible {
    display: block;
}
.image-container {
    padding: 20px;
    max-height: 70vh;
    overflow: auto;
    border-radius: 14px;
    background:
        repeating-conic-gradient(
            #dddddd 0% 25%,
            #ffffff 0% 50%
        ) 50% / 20px 20px;
}
body.dark .image-container {
    background:
        repeating-conic-gradient(
            #333333 0% 25%,
            #222222 0% 50%
        ) 50% / 20px 20px;
}
#previewImage {
    display: block;
    max-width: 100%;
    max-height: 65vh;
    margin: auto;
    border-radius: 8px;
}
.image-info {
    margin-top: 12px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    word-break: break-all;
}
/* ACTIONS */
.actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}
.action {
    height: 44px;
    padding: 0 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    font-weight: 600;
}
.action:hover {
    border-color: var(--orange);
}
/* FOOTER */
footer {
    margin: 45px 0 25px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
}
/* MOBILE */
@media (max-width: 600px) {
    header {
        padding: 0 15px;
    }
    main {
        margin-top: 40px;
    }
    .card {
        padding: 16px;
    }
    .input-row {
        flex-direction: column;
    }
    .show-button {
        width: 100%;
    }
}
</style>
</head>
<body>
<header>
    <div class="logo">
        Image Viewer
    </div>
    <button
        class="theme"
        id="themeButton"
        onclick="toggleTheme()"
        type="button"
    >
        🌙
    </button>
</header>
<main>
    <section class="hero">
        <h1>Bild anzeigen</h1>
        <div class="subtitle">
            Füge einen direkten Bild-Link ein und sehe das Bild sofort.
        </div>
    </section>
    <section class="card">
        <div class="input-row">
            <input
                id="imageUrl"
                type="text"
                placeholder="https://example.com/bild.jpg"
                autocomplete="off"
                spellcheck="false"
            >
            <button
                class="show-button"
                id="showButton"
                type="button"
            >
                Anzeigen
            </button>
        </div>
        <div
            id="message"
            class="message"
        ></div>
        <div
            id="preview"
            class="preview"
        >
            <div class="image-container">
                <img
                    id="previewImage"
                    alt="Bildvorschau"
                >
            </div>
            <div
                id="imageInfo"
                class="image-info"
            ></div>
            <div class="actions">
                <button
                    class="action"
                    id="copyButton"
                    type="button"
                >
                    🔗 Link kopieren
                </button>
                <button
                    class="action"
                    id="openButton"
                    type="button"
                >
                    ↗ Bild öffnen
                </button>
            </div>
        </div>
    </section>
    <footer>
        © 2026 lamacHub
    </footer>
</main>
<script>
const input = document.getElementById("imageUrl");
const showButton = document.getElementById("showButton");
const preview = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");
const message = document.getElementById("message");
const imageInfo = document.getElementById("imageInfo");
const copyButton = document.getElementById("copyButton");
const openButton = document.getElementById("openButton");
const themeButton = document.getElementById("themeButton");
let currentUrl = "";
/* ---------------------------
   BILD ANZEIGEN
--------------------------- */
function showImage() {
    const url = input.value.trim();
    message.className = "message";
    message.textContent = "";
    preview.classList.remove("visible");
    if (url === "") {
        showError(
            "Bitte gib einen Bild-Link ein."
        );
        return;
    }
    try {
        new URL(url);
    } catch {
        showError(
            "Das ist kein gültiger Link."
        );
        return;
    }
    currentUrl = url;
    previewImage.onload = function() {
        preview.classList.add("visible");
        imageInfo.textContent =
            "Bildgröße: " +
            previewImage.naturalWidth +
            " × " +
            previewImage.naturalHeight +
            " Pixel";
        showSuccess(
            "Bild erfolgreich geladen."
        );
    };
    previewImage.onerror = function() {
        preview.classList.remove("visible");
        showError(
            "Das Bild konnte nicht geladen werden. Der Link muss direkt auf ein Bild zeigen."
        );
    };
    previewImage.src = url;
}
/* ---------------------------
   ENTER
--------------------------- */
input.addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            showImage();
        }
    }
);
/* ---------------------------
   BUTTON
--------------------------- */
showButton.addEventListener(
    "click",
    showImage
);
/* ---------------------------
   LINK KOPIEREN
--------------------------- */
copyButton.addEventListener(
    "click",
    async function() {
        if (!currentUrl) return;
        try {
            await navigator.clipboard.writeText(
                currentUrl
            );
            showSuccess(
                "Link wurde kopiert."
            );
        } catch {
            showError(
                "Der Link konnte nicht kopiert werden."
            );
        }
    }
);
/* ---------------------------
   BILD ÖFFNEN
--------------------------- */
openButton.addEventListener(
    "click",
    function() {
        if (!currentUrl) return;
        window.open(
            currentUrl,
            "_blank"
        );
    }
);
/* ---------------------------
   DARK MODE
--------------------------- */
function toggleTheme() {
    document.body.classList.toggle("dark");
    const dark =
        document.body.classList.contains("dark");
    localStorage.setItem(
        "imageViewerDark",
        dark
    );
    themeButton.textContent =
        dark ? "☀️" : "🌙";
}
/* ---------------------------
   DARK MODE LADEN
--------------------------- */
if (
    localStorage.getItem("imageViewerDark") === "true"
) {
    document.body.classList.add("dark");
    themeButton.textContent = "☀️";
}
/* ---------------------------
   MESSAGES
--------------------------- */
function showError(text) {
    message.className =
        "message error";
    message.textContent =
        text;
}
function showSuccess(text) {
    message.className =
        "message success";
    message.textContent =
        text;
}
</script>
</body>
</html>
