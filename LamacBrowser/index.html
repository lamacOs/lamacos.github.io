
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<title>lamacBrowser</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#111b2d;--card:#19263b;--border:#2a3a53;--accent:#01c7fc;--text:#f3f7ff;--muted:#96a9c3}
*{box-sizing:border-box}
body{margin:0;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
button{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:10px;cursor:pointer}
button:disabled{opacity:.35}
header{flex-shrink:0;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:9px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:var(--accent);color:#07111f;font-size:22px;font-weight:900}
.brand-info{flex:1}.brand h1{font-size:17px;margin:0}.brand small{color:var(--muted)}
.tabs,.bookmarks{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.tab{min-width:90px;max-width:170px;display:flex;align-items:center;gap:6px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);white-space:nowrap;flex-shrink:0}
.tab.active{border-color:var(--accent);background:#163047}
.tab-name{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab button{border:0;background:transparent;padding:0 3px}
.newtab{color:var(--accent)}
.controls{display:flex;gap:5px;align-items:center}
.controls>button{min-width:38px;min-height:41px;font-size:18px}
#addressForm{display:flex;align-items:center;flex:1;min-width:0;border:1px solid var(--border);border-radius:11px;background:var(--bg);padding-left:9px}
#address{min-width:0;width:100%;border:0;outline:0;background:transparent;padding:12px 7px;font-size:14px}
#addressForm button{border:0;background:transparent;padding:8px}
#go{background:var(--accent);color:#06111f;border-color:var(--accent);font-weight:700}
.bookmarks button{padding:7px 10px;white-space:nowrap;font-size:12px}
#workspace{position:relative;flex:1;min-height:0}
#home{height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.compass{color:var(--accent);font-size:64px}
#home h2{font-size:28px;margin:15px 0 8px}
#home p{color:var(--muted);line-height:1.6;max-width:420px}
.shortcuts{width:100%;max-width:430px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
.shortcuts button{text-align:left;min-height:58px}
.shortcuts strong,.shortcuts small{display:block}.shortcuts small{color:var(--muted);margin-top:4px}
#viewer{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:white}
#fallback{display:none;position:absolute;inset:0;overflow:auto;text-align:center;padding:30px 20px;background:var(--bg)}
#fallback p{color:var(--muted);line-height:1.6}
#fallback a{color:var(--accent);overflow-wrap:anywhere}
#fallback button{margin:5px}
footer{flex-shrink:0;display:flex;justify-content:space-between;gap:10px;padding:9px 12px max(9px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--border);color:var(--muted);font-size:11px}
#status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.light{color-scheme:light;--bg:#f3f6fb;--panel:#fff;--card:#edf2f9;--border:#d6dfeb;--text:#17253a;--muted:#60728a}
@media(min-width:800px){header{padding-left:24px;padding-right:24px}#home h2{font-size:36px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">L</div>
    <div class="brand-info"><h1>lamacBrowser</h1><small>Your web. Your way.</small></div>
    <button id="theme" aria-label="Design wechseln">☼</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="controls">
    <button id="back" aria-label="Zurück">‹</button>
    <button id="forward" aria-label="Vorwärts">›</button>
    <button id="reload" aria-label="Neu laden">↻</button>
    <form id="addressForm">
      <span>⌕</span>
      <input id="address" placeholder="Website oder Suchbegriff" autocapitalize="none" autocomplete="off" spellcheck="false">
      <button type="button" id="star" aria-label="Lesezeichen">☆</button>
    </form>
    <button id="go">Los</button>
  </div>
  <div class="bookmarks" id="bookmarks"></div>
</header>
<main id="workspace">
  <section id="home">
    <div class="compass">◎</div>
    <h2>Das Internet. Dein Browser.</h2>
    <p>Gib eine Website oder einen Suchbegriff ein.</p>
    <div class="shortcuts">
      <button data-url="https://www.google.com"><strong>🔎 Google</strong><small>Web durchsuchen</small></button>
      <button data-url="https://www.youtube.com"><strong>▶ YouTube</strong><small>Videos ansehen</small></button>
      <button data-url="https://www.wikipedia.org"><strong>📚 Wikipedia</strong><small>Wissen entdecken</small></button>
      <button data-url="https://www.minecraft.net"><strong>⛏ Minecraft</strong><small>Minecraft</small></button>
    </div>
  </section>
  <iframe id="viewer" title="Website" allow="fullscreen; autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <section id="fallback">
    <h2>Website in Safari öffnen</h2>
    <p>Diese Website erlaubt keine Einbettung in lamacBrowser. Öffne sie direkt, um sie zu verwenden.</p>
    <p id="blockedUrl"></p>
    <button id="openExternal">In Safari öffnen ↗</button>
    <button id="backHome">Zur Startseite</button>
  </section>
</main>
<footer><span id="status">Bereit</span><span>lamacBrowser · 2026</span></footer>
<script>
(()=>{
const $=id=>document.getElementById(id);
const viewer=$("viewer"),home=$("home"),fallback=$("fallback");
let nextId=2,activeId=1,externalUrl="",bookmarks=[],visits=[];
let tabs=[{id:1,title:"Startseite",url:"",history:[],index:-1}];
try{
bookmarks=JSON.parse(localStorage.getItem("lb-bookmarks")||"[]");
visits=JSON.parse(localStorage.getItem("lb-history")||"[]");
}catch{}
function active(){return tabs.find(t=>t.id===activeId)}
function save(){try{localStorage.setItem("lb-bookmarks",JSON.stringify(bookmarks));localStorage.setItem("lb-history",JSON.stringify(visits.slice(0,100)))}catch{}}
function normalize(input){
input=input.trim();if(!input)return "";
if(/^https?:\/\//i.test(input)){try{const u=new URL(input);return ["http:","https:"].includes(u.protocol)?u.href:""}catch{return ""}}
if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/i.test(input))return "https://"+input;
return "https://www.google.com/search?q="+encodeURIComponent(input)
}
function renderTabs(){
const root=$("tabs");root.replaceChildren();
tabs.forEach(tab=>{
const item=document.createElement("div");item.className="tab"+(tab.id===activeId?" active":"");
const name=document.createElement("span");name.className="tab-name";name.textContent=tab.title;
const close=document.createElement("button");close.textContent="×";close.setAttribute("aria-label","Tab schließen");
close.onclick=e=>{e.stopPropagation();closeTab(tab.id)};
item.append(name,close);item.onclick=()=>activate(tab.id);root.append(item)
});
const add=document.createElement("button");add.className="newtab";add.textContent="+";add.onclick=()=>newTab();root.append(add)
}
function renderBookmarks(){
const root=$("bookmarks");root.replaceChildren();
const start=document.createElement("button");start.textContent="⌂ Start";start.onclick=()=>showHome(true);root.append(start);
bookmarks.forEach(b=>{
const btn=document.createElement("button");btn.textContent="★ "+b.title;btn.title=b.url;
btn.onclick=()=>navigate(b.url);
btn.oncontextmenu=e=>{e.preventDefault();if(confirm("Lesezeichen entfernen?")){bookmarks=bookmarks.filter(x=>x.url!==b.url);save();render()}};
root.append(btn)
})
}
function render(){
renderTabs();renderBookmarks();
const tab=active();$("address").value=tab.url||"";
$("star").textContent=bookmarks.some(b=>b.url===tab.url)?"★":"☆";
$("back").disabled=tab.index<=0;
$("forward").disabled=tab.index>=tab.history.length-1;
$("status").textContent=tab.url||"Bereit"
}
function showHome(clear){
if(clear){const t=active();t.url="";t.title="Startseite"}
viewer.style.display="none";viewer.removeAttribute("src");
fallback.style.display="none";home.style.display="flex";render()
}
function showFallback(url){
externalUrl=url;viewer.style.display="none";fallback.style.display="block";home.style.display="none";
$("blockedUrl").textContent=url;$("status").textContent="Direktes Öffnen erforderlich"
}
function loadFrame(url){
externalUrl=url;home.style.display="none";fallback.style.display="none";viewer.style.display="block";viewer.src=url
}
function navigate(input,record=true){
const url=normalize(input);if(!url)return;
const t=active();t.url=url;
try{t.title=new URL(url).hostname}catch{t.title="Website"}
if(record){
t.history=t.history.slice(0,t.index+1);t.history.push(url);t.index=t.history.length-1;
visits.unshift({url,date:Date.now()});visits=visits.slice(0,100);save()
}
loadFrame(url);render()
}
function activate(id){
const t=tabs.find(x=>x.id===id);if(!t)return;activeId=id;
if(t.url)loadFrame(t.url);else showHome(false);render()
}
function newTab(url=""){
const t={id:nextId++,title:"Neuer Tab",url:"",history:[],index:-1};tabs.push(t);activeId=t.id;render();
if(url)navigate(url);else showHome(false)
}
function closeTab(id){
if(tabs.length===1){const t=active();Object.assign(t,{title:"Startseite",url:"",history:[],index:-1});showHome(false)}
else{const i=tabs.findIndex(t=>t.id===id);tabs=tabs.filter(t=>t.id!==id);if(activeId===id){activeId=tabs[Math.max(0,i-1)].id;activate(activeId)}}
render()
}
$("addressForm").addEventListener("submit",e=>{e.preventDefault();navigate($("address").value)});
$("go").onclick=()=>navigate($("address").value);
$("back").onclick=()=>{const t=active();if(t.index>0){t.index--;t.url=t.history[t.index];loadFrame(t.url);render()}};
$("forward").onclick=()=>{const t=active();if(t.index<t.history.length-1){t.index++;t.url=t.history[t.index];loadFrame(t.url);render()}};
$("reload").onclick=()=>{if(active().url)loadFrame(active().url);else showHome(false)};
$("star").onclick=()=>{
const t=active();if(!t.url)return;
if(bookmarks.some(b=>b.url===t.url))bookmarks=bookmarks.filter(b=>b.url!==t.url);
else bookmarks.push({url:t.url,title:t.title||t.url});
save();render()
};
$("openExternal").onclick=()=>{if(externalUrl)window.open(externalUrl,"_blank","noopener,noreferrer")};
$("backHome").onclick=()=>showHome(true);
document.querySelectorAll("[data-url]").forEach(b=>b.onclick=()=>navigate(b.dataset.url));
$("theme").onclick=()=>{
document.body.classList.toggle("light");
try{localStorage.setItem("lb-theme",document.body.classList.contains("light")?"light":"dark")}catch{}
};
try{if(localStorage.getItem("lb-theme")==="light")document.body.classList.add("light")}catch{}
viewer.addEventListener("load",()=>{
try{
const doc=viewer.contentDocument;
if(doc&&doc.documentElement){
const title=doc.title;
if(title){active().title=title;render()}
}
}catch{}
});
render();
})();
</script>
</body>
</html>
