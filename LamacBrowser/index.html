
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<title>lamacBrowser</title>
<style>
:root {
  color-scheme: dark;
  --bg:#0b1120;
  --panel:#111b2d;
  --card:#19263b;
  --border:#2a3a53;
  --accent:#01c7fc;
  --text:#f3f7ff;
  --muted:#96a9c3;
}
* { box-sizing:border-box; }
body {
  margin:0;
  height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  color:var(--text);
  font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input {
  font:inherit;
  color:inherit;
}
button {
  border:1px solid var(--border);
  background:var(--card);
  border-radius:10px;
  padding:10px 13px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
button:active { border-color:var(--accent); }
button:disabled { opacity:.35; }
header {
  flex-shrink:0;
  padding: max(10px,env(safe-area-inset-top)) 12px 10px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;
  flex-direction:column;
  gap:10px;
}
.brand {
  display:flex;
  align-items:center;
  gap:10px;
}
.logo {
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:var(--accent);
  color:#07111f;
  font-size:23px;
  font-weight:900;
}
.brand-info { flex:1; }
.brand h1 { font-size:17px; margin:0; }
.brand small { color:var(--muted); }
#theme {
  font-size:19px;
  padding:7px 11px;
}
.tabs {
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar { display:none; }
.tab {
  min-width:100px;
  max-width:180px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--bg);
  white-space:nowrap;
  flex-shrink:0;
}
.tab.active {
  border-color:var(--accent);
  background:#163047;
}
.tab-name {
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1;
}
.tab button {
  border:0;
  background:transparent;
  padding:0 2px;
}
.newtab { color:var(--accent); font-weight:bold; }
.controls {
  display:flex;
  gap:6px;
  align-items:center;
}
.controls button {
  min-width:40px;
  min-height:42px;
  padding:7px 10px;
  font-size:18px;
}
#addressForm {
  display:flex;
  align-items:center;
  flex:1;
  min-width:0;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--bg);
  padding-left:10px;
}
#addressForm:focus-within { border-color:var(--accent); }
#address {
  min-width:0;
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  padding:12px 7px;
  font-size:14px;
}
#addressForm button {
  border:0;
  background:transparent;
  padding:8px;
}
#go {
  background:var(--accent);
  color:#06111f;
  border-color:var(--accent);
  font-weight:700;
  font-size:14px;
}
.bookmarks {
  display:flex;
  gap:7px;
  align-items:center;
  overflow-x:auto;
  scrollbar-width:none;
}
.bookmarks button {
  padding:7px 10px;
  white-space:nowrap;
  font-size:12px;
}
#workspace {
  position:relative;
  flex:1;
  min-height:0;
  background:var(--bg);
}
#home {
  height:100%;
  overflow:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
}
.compass {
  color:var(--accent);
  font-size:66px;
  line-height:1;
}
#home h2 { font-size:28px; margin:18px 0 8px; }
#home p { color:var(--muted); line-height:1.6; max-width:400px; }
.shortcuts {
  width:100%;
  max-width:420px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:22px;
}
.shortcuts button {
  min-height:58px;
  text-align:left;
  padding:12px;
}
.shortcuts strong { display:block; margin-bottom:4px; }
.shortcuts small { color:var(--muted); }
#webview {
  display:none;
  width:100%;
  height:100%;
  border:0;
  background:white;
}
#blocked {
  display:none;
  padding:25px;
  text-align:center;
  line-height:1.6;
  color:var(--muted);
}
#blocked button { margin:6px; }
footer {
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 12px max(9px,env(safe-area-inset-bottom));
  background:var(--panel);
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:11px;
}
#status {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
body.light {
  color-scheme:light;
  --bg:#f3f6fb;
  --panel:#ffffff;
  --card:#edf2f9;
  --border:#d6dfeb;
  --text:#17253a;
  --muted:#60728a;
}
@media(min-width:800px) {
  header { padding-left:24px; padding-right:24px; }
  #home h2 { font-size:36px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">L</div>
    <div class="brand-info">
      <h1>lamacBrowser</h1>
      <small>Your web. Your way.</small>
    </div>
    <button id="theme" aria-label="Design wechseln">☼</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="controls">
    <button id="back" aria-label="Zurück">‹</button>
    <button id="forward" aria-label="Vorwärts">›</button>
    <button id="reload" aria-label="Neu laden">↻</button>

    <form id="addressForm">
      <span>⌕</span>
      <input id="address" placeholder="Website oder Suche"
        autocapitalize="none" autocomplete="off" spellcheck="false">
      <button type="button" id="star" aria-label="Lesezeichen">☆</button>
    </form>
    <button id="go">Los</button>
  </div>

  <div class="bookmarks" id="bookmarks"></div>
</header>

<main id="workspace">
  <section id="home">
    <div class="compass">◎</div>
    <h2>Das Internet. Dein Browser.</h2>
    <p>Gib eine Website oder einen Suchbegriff ein und starte deine nächste Entdeckung.</p>
    <div class="shortcuts">
      <button data-url="https://www.google.com">
        <strong>🔎 Google</strong><small>Web durchsuchen</small>
      </button>
      <button data-url="https://www.youtube.com">
        <strong>▶ YouTube</strong><small>Videos ansehen</small>
      </button>
      <button data-url="https://www.wikipedia.org">
        <strong>📚 Wikipedia</strong><small>Wissen entdecken</small>
      </button>
      <button data-url="https://www.minecraft.net">
        <strong>⛏ Minecraft</strong><small>Die Minecraft-Welt</small>
      </button>
    </div>
  </section>

  <iframe id="webview"
    title="Website"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="fullscreen; autoplay; encrypted-media; picture-in-picture">
  </iframe>

  <section id="blocked">
    <h2>Website nicht einbettbar</h2>
    <p>Diese Website erlaubt keine Anzeige innerhalb von lamacBrowser. Öffne sie direkt in Safari.</p>
    <button id="openExternal">In Safari öffnen ↗</button>
    <button id="backHome">Zur Startseite</button>
  </section>
</main>

<footer>
  <span id="status">Bereit</span>
  <span>lamacBrowser · 2026</span>
</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const frame = $("webview");
  const home = $("home");
  const blocked = $("blocked");

  let nextId = 2;
  let activeId = 1;
  let externalUrl = "";
  let historyStack = [];
  let historyIndex = -1;

  let tabs = [{
    id:1,
    title:"Startseite",
    url:"",
    history:[],
    index:-1
  }];

  let bookmarks = [];
  let visits = [];

  try {
    bookmarks = JSON.parse(localStorage.getItem("lb-bookmarks") || "[]");
    visits = JSON.parse(localStorage.getItem("lb-history") || "[]");
  } catch {}

  function activeTab() {
    return tabs.find(t => t.id === activeId);
  }

  function save() {
    try {
      localStorage.setItem("lb-bookmarks",JSON.stringify(bookmarks));
      localStorage.setItem("lb-history",JSON.stringify(visits.slice(0,100)));
    } catch {}
  }

  function normalize(input) {
    input = input.trim();
    if (!input) return "";

    if (/^https?:\/\//i.test(input)) {
      try {
        const u = new URL(input);
        if (["http:","https:"].includes(u.protocol)) return u.href;
      } catch {}
      return "";
    }

    if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/i.test(input)) {
      return "https://" + input;
    }

    return "https://www.google.com/search?q=" +
      encodeURIComponent(input);
  }

  function renderTabs() {
    const root = $("tabs");
    root.replaceChildren();

    tabs.forEach(tab => {
      const item = document.createElement("div");
      item.className = "tab" + (tab.id === activeId ? " active" : "");

      const name = document.createElement("span");
      name.className = "tab-name";
      name.textContent = tab.title;

      const close = document.createElement("button");
      close.textContent = "×";
      close.setAttribute("aria-label","Tab schließen");
      close.onclick = event => {
        event.stopPropagation();
        closeTab(tab.id);
      };

      item.append(name,close);
      item.onclick = () => activate(tab.id);
      root.append(item);
    });

    const add = document.createElement("button");
    add.className = "newtab";
    add.textContent = "+";
    add.setAttribute("aria-label","Neuer Tab");
    add.onclick = newTab;
    root.append(add);
  }

  function renderBookmarks() {
    const root = $("bookmarks");
    root.replaceChildren();

    const homeButton = document.createElement("button");
    homeButton.textContent = "⌂ Start";
    homeButton.onclick = () => showHome(true);
    root.append(homeButton);

    bookmarks.forEach(b => {
      const button = document.createElement("button");
      button.textContent = "★ " + b.title;
      button.onclick = () => navigate(b.url);
      button.oncontextmenu = event => {
        event.preventDefault();
        if (confirm("Lesezeichen entfernen?")) {
          bookmarks = bookmarks.filter(x => x.url !== b.url);
          save();
          render();
        }
      };
      root.append(button);
    });
  }

  function render() {
    renderTabs();
    renderBookmarks();

    const tab = activeTab();
    $("address").value = tab.url || "";
    $("star").textContent =
      bookmarks.some(b => b.url === tab.url) ? "★" : "☆";

    $("back").disabled = tab.index <= 0;
    $("forward").disabled = tab.index >= tab.history.length - 1;

    $("status").textContent = tab.url || "Bereit";
  }

  function activate(id) {
    const tab = tabs.find(t => t.id === id);
    if (!tab) return;

    activeId = id;

    if (tab.url) {
      loadFrame(tab.url);
    } else {
      showHome(false);
    }

    render();
  }

  function newTab(url = "") {
    const tab = {
      id:nextId++,
      title:"Neuer Tab",
      url:"",
      history:[],
      index:-1
    };

    tabs.push(tab);
    activeId = tab.id;
    render();

    if (url) navigate(url);
    else showHome(false);
  }

  function closeTab(id) {
    if (tabs.length === 1) {
      const tab = activeTab();
      Object.assign(tab,{
        title:"Startseite",url:"",history:[],index:-1
      });
      showHome(false);
    } else {
      const index = tabs.findIndex(t => t.id === id);
      tabs = tabs.filter(t => t.id !== id);

      if (activeId === id) {
        activeId = tabs[Math.max(0,index - 1)].id;
        activate(activeId);
      }
    }

    render();
  }

  function showHome(clearUrl) {
    if (clearUrl) {
      const tab = activeTab();
      tab.url = "";
      tab.title = "Startseite";
    }

    frame.style.display = "none";
    frame.removeAttribute("src");
    blocked.style.display = "none";
    home.style.display = "flex";
    render();
  }

  function loadFrame(url) {
    externalUrl = url;
    home.style.display = "none";
    blocked.style.display = "none";
    frame.style.display = "block";
    frame.src = url;
  }

  function navigate(input, record = true) {
    const url = normalize(input);
    if (!url) return;

    const tab = activeTab();
    tab.url = url;
    tab.title = (() => {
      try { return new URL(url).hostname; }
      catch { return "Website"; }
    })();

    if (record) {
      tab.history = tab.history.slice(0,tab.index + 1);
      tab.history.push(url);
      tab.index = tab.history.length - 1;

      visits.unshift({url,date:Date.now()});
      visits = visits.slice(0,100);
      save();
    }

    loadFrame(url);
    render();
  }

  $("addressForm").addEventListener("submit",e => {
    e.preventDefault();
    navigate($("address").value);
  });

  $("go").onclick = () => navigate($("address").value);

  $("back").onclick = () => {
    const tab = activeTab();
    if (tab.index > 0) {
      tab.index--;
      tab.url = tab.history[tab.index];
      loadFrame(tab.url);
      render();
    }
  };

  $("forward").onclick = () => {
    const tab = activeTab();
    if (tab.index < tab.history.length - 1) {
      tab.index++;
      tab.url = tab.history[tab.index];
      loadFrame(tab.url);
      render();
    }
  };

  $("reload").onclick = () => {
    if (activeTab().url) frame.src = activeTab().url;
    else showHome(false);
  };

  $("star").onclick = () => {
    const tab = activeTab();
    if (!tab.url) return;

    if (bookmarks.some(b => b.url === tab.url)) {
      bookmarks = bookmarks.filter(b => b.url !== tab.url);
    } else {
      bookmarks.push({url:tab.url,title:tab.title || tab.url});
    }

    save();
    render();
  };

  $("openExternal").onclick = () => {
    if (externalUrl) window.open(externalUrl,"_blank","noopener");
  };

  $("backHome").onclick = () => showHome(true);

  document.querySelectorAll("[data-url]").forEach(button => {
    button.onclick = () => navigate(button.dataset.url);
  });

  $("theme").onclick = () => {
    document.body.classList.toggle("light");
    try {
      localStorage.setItem(
        "lb-theme",
        document.body.classList.contains("light") ? "light" : "dark"
      );
    } catch {}
  };

  try {
    if (localStorage.getItem("lb-theme") === "light") {
      document.body.classList.add("light");
    }
  } catch {}

  // Eine iframe-Seite darf nicht direkt auf das übergeordnete
  // Dokument zugreifen. Das Laden fremder URLs ist erlaubt,
  // deren Inhalt kann aber durch Browserregeln blockiert sein.
  frame.addEventListener("error", () => {
    blocked.style.display = "block";
  });

  // Ein iframe-Load-Event beweist nicht, dass die Website
  // erfolgreich dargestellt wurde.
  render();
})();
</script>
</body>
</html>
