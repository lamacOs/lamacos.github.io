<head>

<title>Button Creator</title>

<style>
:root {
  --bg: #f5f7fb;
  --card: rgba(255,255,255,0.85);
  --text: #0f172a;
  --muted: rgba(15,23,42,0.6);
  --border: rgba(15,23,42,0.08);
  --accent: #ff7a00;
  --shadow: 0 10px 30px rgba(0,0,0,0.08);
}

[data-theme="dark"] {
  --bg: #0b0f19;
  --card: rgba(17,24,39,0.75);
  --text: #ffffff;
  --muted: rgba(255,255,255,0.6);
  --border: rgba(255,255,255,0.08);
  --shadow: 0 10px 30px rgba(0,0,0,0.35);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inter", sans-serif;
}

/* ALLE ÜBERSCHRIFTEN ORANGE */
h1, h2, h3, h4 {
  color: var(--accent);
}

body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 26px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
}

.logo img {
  width: 34px;
  height: 34px;
  border-radius: 8px;
}

.toggle {
  border: 1px solid var(--border);
  background: var(--card);
  padding: 8px 12px;
  border-radius: 12px;
  cursor: pointer;
}

/* LAYOUT */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 18px;
}

.panel {
  background: var(--card);
  border: 1px solid var(--border);
  backdrop-filter: blur(14px);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
}

label {
  display: block;
  margin-top: 12px;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 0.9rem;
}

input, select {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
}

.actionButton {
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  background: var(--accent);
  color: white;
  font-weight: 600;
}

/* PREVIEW */
.previewArea {
  display: flex;
  justify-content: center;
  margin-top: 30px;
}

#previewButton,
#fullscreenButton {
  border: none;
  border-radius: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: var(--shadow);
}

/* FULLSCREEN */
#fullscreenView {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 20px;
}

#exitFullscreen {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  color: var(--muted);
  margin-top: 40px;
}
</style>
</head>

<script>
  const WORKER_URL = "https://lamacai.oslamu.workers.dev/chat";

  const chatWindow = document.querySelector("#lamac-ai-window");
  const chatMessages = document.querySelector("#lamac-ai-messages");
  const chatInput = document.querySelector("#lamac-ai-input");
  let history = [];
  let messageCount = 0;

  document.querySelector("#lamac-ai-open").onclick = () => {
    chatWindow.classList.add("open");
    chatInput.focus();
  };

  document.querySelector("#lamac-ai-close").onclick = () => {
    chatWindow.classList.remove("open");
  };

  function addMessage(text, type) {
    const item = document.createElement("div");
    item.className = type;
    item.textContent = text;
    chatMessages.appendChild(item);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  document.querySelector("#lamac-ai-form").onsubmit = async event => {
    event.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;

    addMessage(text, "lamac-user");
    chatInput.value = "";
    messageCount++;

    if (messageCount === 15) {
      addMessage(
        "Hinweis: Bitte fassen Sie Ihr Anliegen möglichst in wenigen, konkreten Nachrichten zusammen.",
        "lamac-bot"
      );
    }

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error);

      addMessage(data.reply, "lamac-bot");
      history.push(
        { role: "user", content: text },
        { role: "assistant", content: data.reply }
      );

      history = history.slice(-12);
    } catch {
      addMessage(
        "Der Kundenservice ist gerade nicht erreichbar. Bitte versuchen Sie es später erneut.",
        "lamac-bot"
      );
    }
  };
</script>

<script>
let mediaURL = null;

/* DARKMODE FIX */
function toggleTheme() {
  const root = document.documentElement;
  const isDark = root.getAttribute("data-theme") === "dark";

  if (isDark) {
    root.removeAttribute("data-theme");
    localStorage.setItem("theme", "light");
  } else {
    root.setAttribute("data-theme", "dark");
    localStorage.setItem("theme", "dark");
  }
}

(function initTheme() {
  const saved = localStorage.getItem("theme");
  if (saved === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();

function apply() {
  const el = document.getElementById("previewButton");

  const type = buttonType.value;
  const size = buttonSize.value;

  el.style.width = size + "px";
  el.style.height = size + "px";
  el.style.background = buttonColor.value;
  el.style.color = buttonTextColor.value;
  el.style.borderRadius = buttonShape.value + "px";

  if (type === "text") {
    el.textContent = buttonText.value || "Button";
  }
}

function openFS() {
  document.getElementById("fullscreenView").style.display = "flex";

  const fs = document.getElementById("fullscreenButton");
  const p = document.getElementById("previewButton");

  fs.innerHTML = p.innerHTML;
  fs.style.width = p.style.width;
  fs.style.height = p.style.height;
  fs.style.background = p.style.background;
  fs.style.borderRadius = p.style.borderRadius;
}

function closeFS() {
  document.getElementById("fullscreenView").style.display = "none";
}

document.getElementById("fullscreenButton").onclick = () => {
  const out = document.createElement("div");

  out.innerText = eventText.value;
  out.style.color = eventColor.value;
  out.style.fontSize = eventSize.value + "px";

  document.getElementById("fullscreenView").appendChild(out);

  setTimeout(() => out.remove(), eventDuration.value);
};

apply();
</script>

  @media (max-width: 480px) {
    #fb-auth-btn { top: 8mm; right: 8mm; padding: 8px 16px; font-size: 14px; }
  }

  /* Trigger-Button */
  /* Button: fest rechts oben, 1 cm vom oberen + rechten Rand
     (1 cm ≈ 37.795 px – auf hochauflösenden Screens via mm-Einheit
     sogar noch exakter, daher position:fixed mit top/right in mm). */
  #fb-auth-btn {
    position: fixed;
    top: 10mm;        /* 1 cm = 10 mm */
    right: 10mm;      /* 1 cm vom rechten Rand */
    background: var(--fb-orange);
    color: var(--fb-white);
    border: none;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(255, 106, 0, 0.35);

    z-index: 10000;   /* ueber dem Modal liegt das Modal (9999) */
  }
  #fb-auth-btn:hover  { background: var(--fb-orange-dark); transform: translateY(-1px); }

    padding: 28px 28px 24px;

    position: relative;
    animation: fb-pop .25s ease-out;

  @keyframes fb-pop {

  // ---------- Helpers ----------
  const openModal  = () => { modal.classList.add("is-open"); modal.setAttribute("aria-hidden", "false"); };
  const closeModal = () => { modal.classList.remove("is-open"); modal.setAttribute("aria-hidden", "true"); };

  const setMsg = (el, text, ok = false) => {
    el.textContent = text;
    el.classList.toggle("success", !!ok);
  };

  // ---------- Button-Logik (Login/Logout) ----------
  onAuthStateChanged(auth, (user) => {
    btn.textContent = user ? "Abmelden" : "Anmelden";
  });

  btn.addEventListener("click", () => {
    if (auth.currentUser) {
      signOut(auth).then(() => closeModal());
    } else {
      openModal();
    }
  });

  closeBtn.addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  // ---------- Tabs ----------
  tabs.forEach(t => t.addEventListener("click", () => {
    tabs.forEach(x => x.classList.remove("is-active"));
    t.classList.add("is-active");
    const isLogin = t.dataset.tab === "login";
    loginForm.classList.toggle("is-active", isLogin);
    regForm.classList.toggle("is-active",   !isLogin);
  }));

  // ---------- LOGIN ----------
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    setMsg(loginMsg, "");
    const submit = loginForm.querySelector("button[type=submit]");
    submit.disabled = true;

    const email    = loginForm.email.value.trim();
    const password = loginForm.password.value;

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);

      // Profil aus DB nachladen (falls noetig)
      const snap = await get(ref(db, `users/${cred.user.uid}/profile`));
      if (!snap.exists()) {
        await set(ref(db, `users/${cred.user.uid}/profile`), {
          email: cred.user.email,
          createdAt: serverTimestamp()
        });
      }

      setMsg(loginMsg, "Erfolgreich angemeldet.", true);
      loginForm.reset();
      setTimeout(closeModal, 600);
    } catch (err) {
      setMsg(loginMsg, err.message);
    } finally {
      submit.disabled = false;
    }
  });

  // ---------- REGISTER ----------
  regForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    setMsg(regMsg, "");
    const submit = regForm.querySelector("button[type=submit]");
    submit.disabled = true;

    const displayName = regForm.displayName.value.trim();
    const email       = regForm.email.value.trim();
    const password    = regForm.password.value;

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);

      // Auth-Profil-Name setzen
      await updateProfile(cred.user, { displayName });

      // Daten in der Realtime-Database ablegen
      await set(ref(db, `users/${cred.user.uid}/profile`), {
        displayName,
        email,
        createdAt: serverTimestamp(),
        lastLogin: serverTimestamp()
      });

      setMsg(regMsg, "Konto erstellt – du bist eingeloggt.", true);
      regForm.reset();
      setTimeout(closeModal, 700);
    } catch (err) {
      setMsg(regMsg, err.message);
    } finally {
      submit.disabled = false;
    }
  });
</script>

</body>
</html>
