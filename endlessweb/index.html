<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff7a00">
<title>The Endless Internet</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap');

:root {
    --accent:#ff7a00;
    --accent-soft:rgba(255,122,0,.14);
    --bg:#08090b;
    --bg2:#0d0f12;
    --card:rgba(255,255,255,.055);
    --card2:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.10);
    --text:#f5f5f7;
    --muted:#a6a6ad;
    --shadow:0 20px 70px rgba(0,0,0,.35);
}

body.light {
    --bg:#f5f5f7;
    --bg2:#ffffff;
    --card:rgba(255,255,255,.70);
    --card2:rgba(255,255,255,.9);
    --border:rgba(0,0,0,.09);
    --text:#111114;
    --muted:#68686f;
    --shadow:0 20px 60px rgba(0,0,0,.10);
}

* {
    box-sizing:border-box;
}

html {
    scroll-behavior:smooth;
}

body {
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 0%, rgba(255,122,0,.12), transparent 28%),
        radial-gradient(circle at 90% 30%, rgba(255,122,0,.07), transparent 25%),
        var(--bg);
    color:var(--text);
    font-family:Inter, sans-serif;
    transition:.3s;
}

body::before {
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:50px 50px;
    mask-image:linear-gradient(to bottom,black,transparent 85%);
}

a {
    color:inherit;
    text-decoration:none;
}

button {
    font:inherit;
}

header {
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:100;
    padding:16px 22px;
}

.nav {
    max-width:1180px;
    margin:auto;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px 0 20px;
    border:1px solid var(--border);
    border-radius:22px;
    background:rgba(10,10,12,.68);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    box-shadow:var(--shadow);
}

body.light .nav {
    background:rgba(255,255,255,.72);
}

.logo {
    font-family:Poppins,sans-serif;
    font-weight:700;
    letter-spacing:-.5px;
}

.logo span {
    color:var(--accent);
}

.nav-actions {
    display:flex;
    gap:8px;
}

.icon-btn {
    width:40px;
    height:40px;
    border-radius:13px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    cursor:pointer;
    transition:.2s;
}

.icon-btn:hover {
    transform:translateY(-2px);
    border-color:rgba(255,122,0,.5);
    background:var(--accent-soft);
}

main {
    width:min(940px,calc(100% - 32px));
    margin:auto;
    padding:145px 0 80px;
}

.hero {
    text-align:center;
    margin-bottom:65px;
}

.badge {
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 13px;
    border:1px solid rgba(255,122,0,.25);
    border-radius:999px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:13px;
    font-weight:600;
    margin-bottom:22px;
}

.dot {
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 14px var(--accent);
}

h1 {
    font-family:Poppins,sans-serif;
    font-size:clamp(42px,8vw,76px);
    line-height:1;
    letter-spacing:-4px;
    margin:0 0 22px;
}

.hero h1 span {
    color:var(--accent);
}

.subtitle {
    max-width:680px;
    margin:auto;
    color:var(--muted);
    font-size:17px;
    line-height:1.8;
}

.article {
    border:1px solid var(--border);
    background:var(--card);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-radius:30px;
    padding:clamp(25px,5vw,55px);
    box-shadow:var(--shadow);
}

.meta {
    display:flex;
    justify-content:space-between;
    gap:20px;
    color:var(--muted);
    font-size:13px;
    margin-bottom:35px;
}

.article h2 {
    font-family:Poppins,sans-serif;
    font-size:clamp(28px,5vw,42px);
    line-height:1.15;
    letter-spacing:-1.5px;
    margin:0 0 28px;
}

.article p {
    color:var(--muted);
    font-size:17px;
    line-height:1.95;
    margin:0 0 23px;
}

.article p strong {
    color:var(--text);
}

.quote {
    margin:35px 0;
    padding:25px;
    border-left:3px solid var(--accent);
    border-radius:0 17px 17px 0;
    background:var(--accent-soft);
    color:var(--text);
    line-height:1.8;
}

.secret {
    padding:18px 20px;
    border:1px dashed rgba(255,122,0,.35);
    border-radius:16px;
    background:rgba(255,122,0,.05);
    color:var(--muted);
    margin:30px 0;
}

.riddle {
    margin-top:55px;
    padding:28px;
    border-radius:24px;
    border:1px solid rgba(255,122,0,.25);
    background:
        linear-gradient(135deg,rgba(255,122,0,.13),transparent),
        var(--card);
}

.riddle-label {
    color:var(--accent);
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:12px;
}

.riddle h3 {
    margin:0 0 15px;
    font-family:Poppins,sans-serif;
    font-size:22px;
}

.riddle p {
    margin-bottom:20px;
}

.answer-row {
    display:flex;
    gap:10px;
}

.answer-row input {
    flex:1;
    min-width:0;
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    background:var(--bg2);
    color:var(--text);
    outline:none;
}

.answer-row input:focus {
    border-color:var(--accent);
}

.solve {
    border:0;
    border-radius:14px;
    padding:0 20px;
    background:var(--accent);
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.solve:hover {
    filter:brightness(1.08);
}

.message {
    min-height:24px;
    margin-top:15px;
    font-size:14px;
    color:var(--muted);
}

.success {
    color:#52d273;
}

.error {
    color:#ff7777;
}

.next {
    display:none;
    margin-top:20px;
}

.next a {
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:13px 18px;
    border-radius:14px;
    background:var(--accent);
    color:white;
    font-weight:700;
}

.progress {
    margin-top:25px;
}

.progress-top {
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:12px;
    margin-bottom:8px;
}

.progress-bar {
    height:5px;
    border-radius:99px;
    background:var(--card2);
    overflow:hidden;
}

.progress-fill {
    height:100%;
    background:var(--accent);
    border-radius:99px;
    transition:width .5s;
}

footer {
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:35px 0;
}

.loading {
    opacity:.5;
}

@media(max-width:600px) {
    header {
        padding:10px;
    }

    .nav {
        height:57px;
        border-radius:18px;
        padding-left:15px;
    }

    main {
        width:min(100% - 20px,940px);
        padding-top:110px;
    }

    h1 {
        letter-spacing:-2.5px;
    }

    .article {
        border-radius:23px;
        padding:23px;
    }

    .article p {
        font-size:16px;
    }

    .answer-row {
        flex-direction:column;
    }

    .solve {
        height:48px;
    }

    .meta {
        flex-direction:column;
        gap:5px;
    }
}
</style>
</head>

const pathPages = pages.filter(p => p.slug !== "finale");

function normalizePath(path) {
    path = path
        .replace(/^https?:\/\/[^/]+/,"")
        .replace(/^\/+/,"")
        .replace(/\/+$/,"");

    return path || "start";
}

function getPage() {
    let path = normalizePath(location.pathname);

    /* GitHub Pages / Unterordner tolerant */
    const parts = path.split("/");

    if (parts.length > 1 && !pages.some(p => p.slug === path)) {
        const possible = parts.slice(-2).join("/");
        if (pages.some(p => p.slug === possible)) path = possible;
    }

    return pages.find(p => p.slug === path) || pages[0];
}

function findIndex(page) {
    return pathPages.findIndex(p => p.slug === page.slug);
}

function esc(text) {
    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
}

function render(page) {

    const app = document.getElementById("app");
    const index = findIndex(page);
    const total = 50;
    const number = index >= 0 ? index + 1 : 50;
    const progress = Math.min(100,Math.round(number / total * 100));

    let paragraphs = page.text
        .map(t => `<p>${esc(t)}</p>`)
        .join("");

    let quote = page.quote
        ? `<div class="quote">${esc(page.quote)}</div>`
        : "";

    let secret = "";

    if (index >= 8) {
        secret = `
        <div class="secret">
            <strong>Notiz:</strong>
            Manche Dinge in dieser Geschichte sind nicht nur Inhalt.
            Sie sind Hinweise.
        </div>`;
    }

    app.innerHTML = `
        <section class="hero">
            <div class="badge">
                <span class="dot"></span>
                ${esc(page.category)}
            </div>

            <h1>${esc(page.title)}</h1>

            <div class="subtitle">
                Du bist auf Station ${number} von 50.
                Aber die Nummern sind nicht die ganze Geschichte.
            </div>
        </section>

        <article class="article">

            <div class="meta">
                <span>/ ${esc(page.slug)}</span>
                <span>${number} / 50</span>
            </div>

            <h2>${esc(page.title)}</h2>

            ${paragraphs}

            ${quote}
            ${secret}

            <div class="riddle">
                <div class="riddle-label">Das Rätsel</div>

                <h3>Finde den nächsten Schritt.</h3>

                <p>${esc(page.riddle)}</p>

                <div class="answer-row">
                    <input
                        id="answer"
                        type="text"
                        autocomplete="off"
                        placeholder="Deine Antwort..."
                    >
                    <button class="solve" id="solve">
                        Prüfen
                    </button>
                </div>

                <div class="message" id="message"></div>

                <div class="next" id="next">
                    ${
                        page.next
                        ?
                        `<a href="/${page.next}" id="nextLink">
                            Weiter →
                        </a>`
                        :
                        `<a href="/" id="restartLink">
                            ↻ Zum Anfang
                        </a>`
                    }
                </div>
            </div>

            <div class="progress">
                <div class="progress-top">
                    <span>Reise</span>
                    <span>${progress}%</span>
                </div>

                <div class="progress-bar">
                    <div
                        class="progress-fill"
                        style="width:${progress}%"
                    ></div>
                </div>
            </div>

        </article>
    `;

    const input = document.getElementById("answer");
    const solve = document.getElementById("solve");
    const message = document.getElementById("message");
    const next = document.getElementById("next");

    function clean(value) {
        return value
            .toLowerCase()
            .trim()
            .replaceAll("ä","a")
            .replaceAll("ö","o")
            .replaceAll("ü","u")
            .replaceAll("ß","ss")
            .replace(/[.,!?;:'"()]/g,"")
            .replace(/\s+/g," ");
    }

    function check() {

        const answer = clean(input.value);

        if (!answer) {
            message.textContent = "Gib zuerst eine Antwort ein.";
            message.className = "message error";
            return;
        }

        const correct = page.answers
            .map(clean)
            .some(a => answer === a || answer.includes(a));

        if (correct) {

            message.textContent =
                "Richtig. Der nächste Hinweis wartet bereits.";
            message.className = "message success";

            next.style.display = "block";

            localStorage.setItem(
                "endless-" + page.slug,
                "solved"
            );

            if (page.next) {
                document.getElementById("nextLink")
                    .addEventListener("click", navigate);
            } else {
                document.getElementById("restartLink")
                    .addEventListener("click", navigate);
            }

        } else {

            message.textContent =
                "Das passt noch nicht. Lies die Seite noch einmal.";
            message.className = "message error";
        }
    }

    solve.addEventListener("click",check);

    input.addEventListener("keydown",e=>{
        if(e.key === "Enter") check();
    });

    document.title =
        page.title + " · The Endless Internet";
}

function navigate(e) {
    e.preventDefault();

    const href = e.currentTarget.getAttribute("href");

    history.pushState({}, "", href);

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

    render(getPage());
}

/* ---------------------------------------------------------
   Navigation
   --------------------------------------------------------- */

window.addEventListener("popstate",()=>{
    render(getPage());
    window.scrollTo(0,0);
});

document.getElementById("backBtn").addEventListener("click",()=>{
    history.back();
});

/* ---------------------------------------------------------
   Theme
   --------------------------------------------------------- */

const savedTheme = localStorage.getItem("endless-theme");

if (savedTheme === "light") {
    document.body.classList.add("light");
}

document.getElementById("themeBtn").addEventListener("click",()=>{

    document.body.classList.toggle("light");

    localStorage.setItem(
        "endless-theme",
        document.body.classList.contains("light")
        ? "light"
        : "dark"
    );

});

/* ---------------------------------------------------------
   Globale Links
   --------------------------------------------------------- */

document.addEventListener("click",e=>{

    const link = e.target.closest("a");

    if (!link) return;

    const url = new URL(link.href);

    if (url.origin !== location.origin) return;

    e.preventDefault();

    history.pushState({}, "", url.pathname);

    render(getPage());

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

});

/* ---------------------------------------------------------
   START
   --------------------------------------------------------- */

render(getPage());

</script>

</body>
</html>
