<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Endless Internet</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --accent: #ff7a00;
    --bg: #08090b;
    --bg2: #0e1014;
    --glass: rgba(255,255,255,.055);
    --glass2: rgba(255,255,255,.08);
    --border: rgba(255,255,255,.11);
    --text: #f5f5f7;
    --muted: #9a9da5;
    --shadow: 0 25px 80px rgba(0,0,0,.35);
}

body.light {
    --bg: #f4f5f7;
    --bg2: #ffffff;
    --glass: rgba(255,255,255,.72);
    --glass2: rgba(255,255,255,.9);
    --border: rgba(0,0,0,.09);
    --text: #111216;
    --muted: #686b73;
    --shadow: 0 25px 80px rgba(0,0,0,.1);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 10%, rgba(255,122,0,.12), transparent 30%),
        radial-gradient(circle at 80% 90%, rgba(255,122,0,.07), transparent 30%),
        var(--bg);
    color: var(--text);
    font-family: Inter, sans-serif;
    transition: background .3s, color .3s;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: rgba(8,9,11,.65);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-bottom: 1px solid var(--border);
}

body.light .topbar {
    background: rgba(255,255,255,.7);
}

.logo {
    font-family: Poppins, sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -.5px;
}

.logo span {
    color: var(--accent);
}

.top-actions {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--glass);
    color: var(--text);
    display: grid;
    place-items: center;
    transition: .2s;
}

.icon-btn:hover {
    transform: translateY(-2px);
    border-color: rgba(255,122,0,.45);
    background: var(--glass2);
}

.app {
    width: min(920px, calc(100% - 32px));
    margin: 0 auto;
    padding: 70px 0 100px;
}

.progress-area {
    margin-bottom: 28px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 10px;
}

.progress {
    width: 100%;
    height: 5px;
    background: var(--glass2);
    border-radius: 999px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: inherit;
    transition: width .5s ease;
}

.hero {
    margin-bottom: 34px;
}

.category {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    margin-bottom: 16px;
}

.dot {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255,122,0,.8);
}

h1 {
    font-family: Poppins, sans-serif;
    font-size: clamp(38px, 7vw, 72px);
    line-height: 1.02;
    letter-spacing: -3px;
    margin: 0 0 22px;
}

.subtitle {
    color: var(--muted);
    font-size: 18px;
    line-height: 1.75;
    max-width: 750px;
}

.story {
    display: grid;
    gap: 18px;
    margin-bottom: 38px;
}

.story-card {
    padding: 28px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 25px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.story-card p {
    margin: 0;
    color: var(--text);
    opacity: .88;
    font-size: 16px;
    line-height: 1.9;
}

.story-card p + p {
    margin-top: 18px;
}

.quote {
    padding: 25px 28px;
    margin-bottom: 38px;
    border-left: 3px solid var(--accent);
    background: var(--glass);
    border-radius: 0 20px 20px 0;
    color: var(--muted);
    font-family: Poppins, sans-serif;
    font-size: 16px;
    line-height: 1.7;
}

.riddle {
    padding: 32px;
    background:
        linear-gradient(
            135deg,
            rgba(255,122,0,.10),
            var(--glass)
        );
    border: 1px solid rgba(255,122,0,.2);
    border-radius: 28px;
    box-shadow: var(--shadow);
}

.riddle-label {
    color: var(--accent);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    margin-bottom: 15px;
}

.riddle h2 {
    font-family: Poppins, sans-serif;
    font-size: clamp(22px, 4vw, 31px);
    line-height: 1.35;
    margin: 0 0 25px;
}

.answer-row {
    display: flex;
    gap: 10px;
}

.answer-input {
    min-width: 0;
    flex: 1;
    height: 54px;
    padding: 0 18px;
    border-radius: 15px;
    border: 1px solid var(--border);
    outline: none;
    background: var(--glass2);
    color: var(--text);
    transition: .2s;
}

.answer-input:focus {
    border-color: rgba(255,122,0,.7);
    box-shadow: 0 0 0 4px rgba(255,122,0,.08);
}

.check-btn {
    height: 54px;
    padding: 0 24px;
    border: 0;
    border-radius: 15px;
    background: var(--accent);
    color: white;
    font-weight: 700;
    transition: .2s;
}

.check-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(255,122,0,.22);
}

.feedback {
    min-height: 25px;
    margin-top: 15px;
    font-size: 14px;
    color: var(--muted);
}

.feedback.success {
    color: #65d18c;
}

.feedback.error {
    color: #ff7b7b;
}

.next-area {
    display: none;
    margin-top: 20px;
}

.next-area.show {
    display: block;
}

.next-btn {
    width: 100%;
    min-height: 58px;
    border: 1px solid rgba(255,122,0,.35);
    border-radius: 17px;
    background: rgba(255,122,0,.11);
    color: var(--text);
    font-weight: 700;
    transition: .2s;
}

.next-btn:hover {
    background: rgba(255,122,0,.18);
    transform: translateY(-2px);
}

.footer {
    margin-top: 65px;
    padding-top: 25px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 20px;
    color: var(--muted);
    font-size: 12px;
}

.hidden {
    display: none !important;
}

@media(max-width:650px) {
    .topbar {
        padding: 0 16px;
    }

    .app {
        width: min(100% - 22px, 920px);
        padding-top: 45px;
    }

    h1 {
        letter-spacing: -2px;
    }

    .story-card,
    .riddle {
        padding: 22px;
        border-radius: 21px;
    }

    .answer-row {
        flex-direction: column;
    }

    .check-btn {
        width: 100%;
    }

    .footer {
        flex-direction: column;
    }
}
</style>
</head>

        <div class="next-area" id="nextArea">

            </button>
        </div>
    </section>

    <footer class="footer">
        <span>The Endless Internet</span>
        <span>© 2026 lamacHub</span>
    </footer>

</main>

/*
===========================================================
ROUTER
===========================================================
*/

const pageMap = new Map(
    pages.map(page => [normalizePath(page.slug), page])
);

const stationCounter = document.getElementById("stationCounter");
const cycleCounter = document.getElementById("cycleCounter");
const progressBar = document.getElementById("progressBar");

const categoryEl = document.getElementById("category");
const titleEl = document.getElementById("title");
const subtitleEl = document.getElementById("subtitle");
const storyEl = document.getElementById("story");
const quoteEl = document.getElementById("quote");
const riddleEl = document.getElementById("riddle");

const answerEl = document.getElementById("answer");
const checkBtn = document.getElementById("checkBtn");
const feedbackEl = document.getElementById("feedback");

const nextArea = document.getElementById("nextArea");
const nextBtn = document.getElementById("nextBtn");

const backBtn = document.getElementById("backBtn");
const themeBtn = document.getElementById("themeBtn");

let currentPage = null;
let solved = false;

function normalizePath(path) {
    if (!path) return "";

    path = path.split("?")[0].split("#")[0];

    path = decodeURIComponent(path);

    path = path.replace(/^\/+|\/+$/g, "");

    return path;
}

function getCurrentPage() {
    const path = normalizePath(location.pathname);

    return pageMap.get(path) || pages[0];
}

function getCycle() {
    return Number(
        localStorage.getItem("endlessInternetCycle") || "0"
    );
}

function setCycle(value) {
    localStorage.setItem(
        "endlessInternetCycle",
        String(value)
    );
}

function navigate(path, newCycle = false) {

    if (newCycle) {
        setCycle(getCycle() + 1);
    }

    const cleanPath = path || "/";

    history.pushState({}, "", cleanPath);

    render();
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function render() {

    currentPage = getCurrentPage();

    const index = pages.indexOf(currentPage);

    /*
    -------------------------------------------------------
    STARTSEITE BEI SPÄTEREN DURCHLÄUFEN VERÄNDERN
    -------------------------------------------------------
    */

    let displayTitle = currentPage.title;
    let displaySubtitle = currentPage.subtitle;

    if (index === 0 && getCycle() > 0) {

        displayTitle = "Du bist wieder hier.";

        displaySubtitle =
            "Der Anfang sieht gleich aus. Aber du weißt inzwischen, dass er nicht derselbe ist.";

    }

    categoryEl.textContent = currentPage.category;
    titleEl.textContent = displayTitle;
    subtitleEl.textContent = displaySubtitle;

    stationCounter.textContent =
        String(index + 1).padStart(2, "0") +
        " / " +
        String(pages.length).padStart(2, "0");

    cycleCounter.textContent =
        "Durchlauf " + (getCycle() + 1);

    const progress =
        ((index + 1) / pages.length) * 100;

    progressBar.style.width = progress + "%";

    /*
    -------------------------------------------------------
    STORY
    -------------------------------------------------------
    */

    storyEl.innerHTML = "";

    currentPage.text.forEach(paragraph => {

        const card = document.createElement("div");

        card.className = "story-card";

        const p = document.createElement("p");

        p.textContent = paragraph;

        card.appendChild(p);

        storyEl.appendChild(card);
    });

    /*
    -------------------------------------------------------
    RIDDLE
    -------------------------------------------------------
    */

    riddleEl.textContent = currentPage.riddle;

    answerEl.value = "";

    feedbackEl.textContent = "";

    feedbackEl.className = "feedback";

    nextArea.classList.remove("show");

    solved = false;

    /*
    -------------------------------------------------------
    OPTIONAL: BEREITS GELÖST
    -------------------------------------------------------
    */

    const solvedKey =
        "solved:" +
        normalizePath(currentPage.slug);

    if (localStorage.getItem(solvedKey) === "true") {

        solved = true;

        feedbackEl.textContent =
            "✓ Diese Spur wurde bereits gelöst.";

        feedbackEl.className =
            "feedback success";

        nextArea.classList.add("show");
    }
}

function cleanAnswer(value) {

    return value
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[.,!?;:'"„“`´()]/g, "")
        .replace(/\s+/g, " ");
}

function checkAnswer() {

    if (!currentPage) return;

    const userAnswer =
        cleanAnswer(answerEl.value);

    if (!userAnswer) {

        feedbackEl.textContent =
            "Gib zuerst eine Antwort ein.";

        feedbackEl.className =
            "feedback error";

        return;
    }

    const accepted =
        currentPage.answers.map(cleanAnswer);

    /*
    -------------------------------------------------------
    EXAKTE VARIANTEN + SINNVOLLE NORMALISIERUNG
    -------------------------------------------------------
    */

    const correct =
        accepted.includes(userAnswer);

    if (correct) {

        solved = true;

        const solvedKey =
            "solved:" +
            normalizePath(currentPage.slug);

        localStorage.setItem(
            solvedKey,
            "true"
        );

        feedbackEl.textContent =
            "✓ Richtig. Die nächste Spur wurde freigegeben.";

        feedbackEl.className =
            "feedback success";

        nextArea.classList.add("show");

        return;
    }

    feedbackEl.textContent =
        "Noch nicht. Lies die Frage noch einmal genau.";

    feedbackEl.className =
        "feedback error";
}

function goNext() {

    if (!currentPage || !solved) return;

    /*
    -------------------------------------------------------
    STATION 50 -> NEUER DURCHLAUF
    -------------------------------------------------------
    */

    if (!currentPage.next) {

        navigate("/", true);

        return;
    }

    navigate(currentPage.next);
}

/*
===========================================================
EVENTS
===========================================================
*/

checkBtn.addEventListener(
    "click",
    checkAnswer
);

answerEl.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            checkAnswer();
        }
    }
);

nextBtn.addEventListener(
    "click",
    goNext
);

window.addEventListener(
    "popstate",
    render
);

backBtn.addEventListener(
    "click",
    () => history.back()
);

/*
===========================================================
THEME
===========================================================
*/

function updateThemeIcon() {

    const light =
        document.body.classList.contains("light");

    themeBtn.textContent =
        light ? "☀" : "☾";
}

const savedTheme =
    localStorage.getItem("endlessTheme");

if (savedTheme === "light") {
    document.body.classList.add("light");
}

updateThemeIcon();

themeBtn.addEventListener(
    "click",
    () => {

        document.body.classList.toggle("light");

        const light =
            document.body.classList.contains("light");

        localStorage.setItem(
            "endlessTheme",
            light ? "light" : "dark"
        );

        updateThemeIcon();
    }
);

/*
===========================================================
START
===========================================================
*/

render();

</script>
