<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lamacAI</title>
  <style>
    :root { --green:#007e62; --deep:#11211d; --cream:#f7f5ef; --bubble:#d8f8e8; --muted:#61716b; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--deep); font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif; background:linear-gradient(135deg,#e9faf3,#f8f5ec); }
    main { width:min(840px,calc(100% - 28px)); min-height:100vh; margin:auto; display:flex; flex-direction:column; box-shadow:0 0 50px #1a504020; background:#efeae2; }
    header { display:flex; align-items:center; gap:12px; padding:17px 22px; color:white; background:var(--deep); }
    .avatar { display:grid; place-items:center; width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#00b884,#007e62); font-size:19px; font-weight:800; }
    h1 { margin:0; font-size:17px; } .status { color:#b5c6bf; font-size:12px; }
    .privacy { margin-left:auto; color:#b5c6bf; font-size:12px; text-align:right; }
    #messages { flex:1; min-height:620px; padding:27px clamp(14px,5vw,60px); overflow:auto; background-image:radial-gradient(#d7d0c2 1px,transparent 1px); background-size:19px 19px; }
    .day { width:max-content; margin:0 auto 22px; padding:5px 10px; border-radius:7px; background:#fff; color:#5c6b66; font-size:11px; box-shadow:0 1px 2px #0001; }
    .msg { max-width:min(82%,570px); margin:9px 0; padding:9px 11px 6px; border-radius:9px; background:white; box-shadow:0 1px 1px #00000018; white-space:pre-wrap; overflow-wrap:anywhere; }
    .msg.me { margin-left:auto; border-top-right-radius:0; background:var(--bubble); }.msg.bot { border-top-left-radius:0; }
    .time { display:block; margin-top:3px; color:#72817b; text-align:right; font-size:10px; }.notice { border-left:3px solid #e4ac2d; background:#fff9e7; color:#675d33; }
    form { display:flex; gap:9px; padding:13px 18px; background:#f0f2f5; } input { flex:1; min-width:0; border:0; border-radius:24px; padding:12px 16px; outline:0; font:inherit; } button { width:47px; border:0; border-radius:50%; color:white; background:var(--green); cursor:pointer; font-size:18px; } button:disabled { opacity:.55; cursor:wait; }
    footer { padding:0 18px 12px; background:#f0f2f5; color:var(--muted); text-align:center; font-size:11px; }
    @media (max-width:600px) { main { width:100%; } #messages { min-height:calc(100vh - 145px); } .privacy { display:none; } }
  </style>
</head>
<body>
  <main>
    <header><div class="avatar">LC</div><div><h1>lamacAI</h1><div class="status">Kurznachrichten KI</div></div><div class="privacy">Keine Notfallhilfe<br>Bitte keine sensiblen Daten senden</div></header>
    <section id="messages" aria-live="polite"><div class="day">HEUTE</div><div class="msg bot">Hallo! Wie kann ich Ihnen helfen?<span class="time">jetzt</span></div></section>
    <form id="chat"><input id="text" autocomplete="off" placeholder="Nachricht schreiben" maxlength="1800" aria-label="Nachricht"><button id="send" aria-label="Senden">➤</button></form>
    <footer>Antworten werden KI-generiert und können Fehler enthalten.</footer>
  </main>
  <script>
    // Nach dem Veröffentlichen des Cloudflare Workers diese Adresse ersetzen.
    const WORKER_URL = 'https://lamacai.oslamu.workers.dev/chat';
    const messages = document.querySelector('#messages'), input = document.querySelector('#text'), form = document.querySelector('#chat'), send = document.querySelector('#send');
    let history = [], sentCount = 0, warningShown = false;
    const now = () => new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
    function add(text, kind, extra='') { const el=document.createElement('div'); el.className='msg '+kind+' '+extra; el.textContent=text; const time=document.createElement('span'); time.className='time'; time.textContent=now(); el.append(time); messages.append(el); messages.scrollTop=messages.scrollHeight; return el; }
    function showWarning() { if (!warningShown && sentCount === 15) { warningShown=true; add('Hinweis: Bitte fassen Sie Ihr Anliegen möglichst in wenigen, konkreten Nachrichten zusammen. So kann unser Support schneller helfen.','bot','notice'); } }
    form.addEventListener('submit', async event => {
      event.preventDefault(); const text=input.value.trim(); if (!text || send.disabled) return;
      if (WORKER_URL.includes('DEIN-WORKER')) { add('Der Kundenservice wird noch eingerichtet. Bitte später erneut versuchen.','bot','notice'); return; }
      add(text,'me'); input.value=''; sentCount++; showWarning(); send.disabled=true;
      const typing=document.createElement('div'); typing.className='msg bot'; typing.textContent='Support antwortet …'; messages.append(typing); messages.scrollTop=messages.scrollHeight;
      try {
        const response=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history})});
        const data=await response.json().catch(()=>({})); if(!response.ok) throw new Error(data.error || 'Der Support ist momentan nicht erreichbar.');
        add(data.reply,'bot'); history.push({role:'user',content:text},{role:'assistant',content:data.reply});
        if(history.length>12) history=history.slice(-12);
      } catch(error) { add(error.message || 'Verbindung fehlgeschlagen. Bitte versuchen Sie es später erneut.','bot','notice'); }
      finally { typing.remove(); send.disabled=false; input.focus(); }
    });
  </script>
</body>
</html>
