<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Fullscreen Player</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #10131a;
    color: white;

    /* Normalen Mauszeiger auf der gesamten Website ausblenden */
    cursor: none !important;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

#app {
    width: min(900px, 100%);
    text-align: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

p {
    color: #b7becb;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    border: 1px solid #414958;
    border-radius: 10px;
    background: #1d222c;
    color: white;
    outline: none;
    cursor: none !important;
}

input:focus {
    border-color: #4ade80;
}

button {
    margin-top: 14px;
    padding: 14px 24px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: none !important;
}

button:hover {
    background: #16a34a;
}

#status {
    margin-top: 12px;
    color: #aab3c2;
    min-height: 20px;
}

#player {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 1000;
}

#scratchFrame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/*
 * Eigener Mauszeiger
 *
 * Das Bild ist ungefähr dreimal so groß:
 * vorher: 32px
 * jetzt: 96px
 */
#customCursor {
    display: block;
    position: fixed;
    left: 0;
    top: 0;
    width: 96px;
    height: 96px;
    object-fit: contain;
    pointer-events: none;
    z-index: 999999;
    transform: translate(-8px, -8px);
}

/* Während der Player aktiv ist, wird der echte Cursor versteckt */
.player-active,
.player-active *,
.player-active iframe {
    cursor: none !important;
}

/* Beenden-Schaltfläche */
#exitButton {
    display: none;
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 100000;
    margin: 0;
    padding: 8px 14px;
    background: rgba(20, 20, 20, 0.75);
    border: 1px solid #555;
    font-size: 13px;
    cursor: none !important;
}

#exitButton:hover {
    background: rgba(70, 70, 70, 0.9);
}

/* Kleine Steuerungshinweise */
#help {
    margin-top: 16px;
    font-size: 14px;
    color: #8792a5;
}
</style>
</head>

<body>

<div id="app">
    <h1>🎮 Scratch Fullscreen Player</h1>

    <p>
        Gib den Link zu deinem Scratch-Projekt ein.
    </p>

    <input
        id="projectUrl"
        type="url"
        placeholder="https://scratch.mit.edu/projects/123456789/"
        autocomplete="off"
    >

    <button id="startButton">
        ▶ Projekt öffnen
    </button>

    <div id="status"></div>

    <div id="help">
        Im Player: <b>S</b> = Start · <b>P</b> = Stop
    </div>
</div>

<div id="player">
    <iframe
        id="scratchFrame"
        allow="fullscreen; autoplay"
        title="Scratch-Projekt"
    ></iframe>
</div>

<button id="exitButton">✕ Beenden</button>

<img
    id="customCursor"
    src="https://raw.githubusercontent.com/lamacOs/lamacos.github.io/main/mouse.png"
    alt=""
>

<script>
const projectUrlInput = document.getElementById("projectUrl");
const startButton = document.getElementById("startButton");
const statusText = document.getElementById("status");
const player = document.getElementById("player");
const scratchFrame = document.getElementById("scratchFrame");
const customCursor = document.getElementById("customCursor");
const exitButton = document.getElementById("exitButton");

let playerOpen = false;

/*
 * Eigener Mauszeiger wird immer angezeigt,
 * sobald die Website geöffnet ist.
 */
customCursor.style.display = "block";

/*
 * Ermittelt die Scratch-Projekt-ID aus einem Link.
 */
function getProjectId(url) {
    try {
        const parsedUrl = new URL(url);

        if (!parsedUrl.hostname.endsWith("scratch.mit.edu")) {
            return null;
        }

        const match = parsedUrl.pathname.match(
            /\/projects\/([0-9]+)/
        );

        return match ? match[1] : null;
    } catch {
        return null;
    }
}

/*
 * Startet ein Scratch-Projekt.
 */
async function openProject() {
    const projectId = getProjectId(projectUrlInput.value.trim());

    if (!projectId) {
        statusText.textContent =
            "Bitte gib einen gültigen Scratch-Projektlink ein.";
        return;
    }

    statusText.textContent = "Projekt wird geladen ...";

    /*
     * Scratch-Embed ohne die normale Projektseite.
     */
    scratchFrame.src =
        "https://scratch.mit.edu/projects/" +
        projectId +
        "/embed";

    player.style.display = "block";
    document.body.classList.add("player-active");
    customCursor.style.display = "block";
    exitButton.style.display = "block";
    playerOpen = true;

    statusText.textContent = "";

    /*
     * Vollbild muss durch eine Benutzeraktion ausgelöst werden.
     */
    try {
        if (!document.fullscreenElement) {
            await player.requestFullscreen();
        }
    } catch (error) {
        console.log("Vollbild wurde nicht aktiviert:", error);
    }

    scratchFrame.focus();
}

/*
 * Beendet den Player.
 */
async function closeProject() {
    playerOpen = false;

    document.body.classList.remove("player-active");
    customCursor.style.display = "block";
    exitButton.style.display = "none";
    player.style.display = "none";

    scratchFrame.src = "";

    if (document.fullscreenElement) {
        try {
            await document.exitFullscreen();
        } catch (error) {
            console.log("Vollbild konnte nicht beendet werden.");
        }
    }
}

/*
 * Eigener Mauszeiger:
 * Das Bild folgt immer der echten Mausposition.
 */
document.addEventListener("mousemove", function(event) {
    customCursor.style.left = event.clientX + "px";
    customCursor.style.top = event.clientY + "px";
});

/*
 * Wenn die Maus die Website wieder betritt,
 * wird der eigene Mauszeiger erneut eingeblendet.
 */
document.addEventListener("mouseenter", function() {
    customCursor.style.display = "block";
});

/*
 * Tastatursteuerung.
 */
document.addEventListener("keydown", function(event) {
    if (!playerOpen) return;

    const key = event.key.toLowerCase();

    if (key === "s") {
        event.preventDefault();

        /*
         * Scratch-Embed-Nachricht zum Starten.
         */
        scratchFrame.contentWindow.postMessage(
            {
                method: "greenFlag"
            },
            "https://scratch.mit.edu"
        );
    }

    if (key === "p") {
        event.preventDefault();

        /*
         * Scratch-Embed-Nachricht zum Stoppen.
         */
        scratchFrame.contentWindow.postMessage(
            {
                method: "stopAll"
            },
            "https://scratch.mit.edu"
        );
    }

    if (event.key === "Escape") {
        closeProject();
    }
});

/*
 * Klick auf den Startknopf.
 */
startButton.addEventListener("click", openProject);

/*
 * Beenden-Schaltfläche.
 */
exitButton.addEventListener("click", closeProject);

/*
 * Wenn der Browser den Vollbildmodus beendet,
 * bleibt der Player sichtbar und kann erneut verwendet werden.
 */
document.addEventListener("fullscreenchange", function() {
    if (!document.fullscreenElement && playerOpen) {
        statusText.textContent =
            "Vollbild beendet. Drücke erneut auf den Startknopf, " +
            "um das Projekt wieder zu öffnen.";
    }
});
</script>

</body>
</html>
