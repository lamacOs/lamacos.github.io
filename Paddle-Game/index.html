<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Paddle Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff7a00;
      --background: #ffffff;
      --text: #111111;
      --secondary-text: #666666;
      --card-bg: #ffffff;
      --border: #eaeaea;
    }

    .dark-mode {
      --background: #0f1115;
      --text: #ffffff;
      --secondary-text: #bdbdbd;
      --card-bg: #171a21;
      --border: #2b2f38;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      text-align: center;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }

    canvas {
      background: var(--card-bg);
      display: none;
      margin: 20px auto;
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    #menu {
      padding: 100px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    #menu h1 {
      font-size: clamp(2.8rem, 5vw, 5rem);
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 2rem;
    }

    #highscoreDisplay {
      margin-top: 20px;
      font-size: 1.25rem;
      color: var(--secondary-text);
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 122, 0, 0.2);
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      z-index: 100;
    }

    .theme-toggle svg {
      width: 24px;
      height: 24px;
      fill: var(--text);
    }

    .footer {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: var(--secondary-text);
      font-size: 0.875rem;
    }

    @media (max-width: 768px) {
      #menu {
        padding: 60px 20px;
      }
      
      canvas {
        width: 95%;
        height: auto;
      }
    }
  </style>
</head>

<script>
(() => {
  "use strict";

  // Dieselbe Worker-Adresse für alle Websites verwenden.
  const WORKER_URL =
    "https://carescape-ai.oslamuoslamu.workers.dev/";

  const root = document.querySelector("#lamac-ai");

  // Verhindert doppelte Initialisierung, falls der Code versehentlich
  // zweimal auf derselben Seite eingebunden wurde.
  if (!root || root.dataset.initialized === "true") return;
  root.dataset.initialized = "true";

  const chatWindow = root.querySelector("#lamac-ai-window");
  const openButton = root.querySelector("#lamac-ai-open");
  const closeButton = root.querySelector("#lamac-ai-close");
  const chatMessages = root.querySelector("#lamac-ai-messages");
  const chatInput = root.querySelector("#lamac-ai-input");
  const chatForm = root.querySelector("#lamac-ai-form");
  const sendButton = chatForm.querySelector("button");

  let history = [];
  let busy = false;

  function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function addUserMessage(text) {
    const item = document.createElement("div");
    item.className = "lamac-user";
    item.textContent = text;
    chatMessages.appendChild(item);
    scrollToBottom();
  }

  function addBotMessage(text) {
    const item = document.createElement("div");
    item.className = "lamac-bot";

    // Markdown wird in kontrollierte HTML-Elemente umgewandelt.
    // HTML aus der Antwort wird vorher escaped.
    item.innerHTML = renderMarkdown(text);

    chatMessages.appendChild(item);
    scrollToBottom();
  }

  function showTyping() {
    const typing = document.createElement("div");
    typing.className = "lamac-bot lamac-typing";
    typing.setAttribute("role", "status");
    typing.setAttribute("aria-label", "Kundenservice antwortet");
    typing.innerHTML =
      '<span class="lamac-typing-dot"></span>' +
      '<span class="lamac-typing-dot"></span>' +
      '<span class="lamac-typing-dot"></span>';

    chatMessages.appendChild(typing);
    scrollToBottom();

    return typing;
  }

  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function safeLink(url) {
    try {
      const parsed = new URL(url);

      if (
        parsed.protocol === "https:" ||
        parsed.protocol === "http:"
      ) {
        return parsed.href;
      }
    } catch (_) {}

    return null;
  }

  function renderInline(text) {
    // Zuerst den gesamten Inhalt escapen, damit die KI
    // keine eigenen HTML-Tags einschleusen kann.
    let value = escapeHTML(text);

    // Inline-Code vor anderen Formatierungen schützen.
    const codeParts = [];

    value = value.replace(/`([^`\n]+)`/g, (_, code) => {
      const index = codeParts.length;
      codeParts.push("<code>" + code + "</code>");
      return "LAMACCODE" + index + "END";
    });

    // Markdown-Links: ausschließlich HTTP(S) erlauben.
    value = value.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      (match, label, url) => {
        const safe = safeLink(url.replace(/&amp;/g, "&"));

        if (!safe) return label;

        return (
          '<a href="' + escapeHTML(safe) +
          '" target="_blank" rel="noopener noreferrer">' +
          label + "</a>"
        );
      }
    );

    // URLs, die die KI ohne Markdown ausgibt, ebenfalls verlinken.
    value = value.replace(
      /(^|[\s(])(https?:\/\/[^\s<]+)/g,
      (match, prefix, url) => {
        const cleanURL = url.replace(/[.,!?;:]+$/, "");
        const trailing = url.slice(cleanURL.length);
        const safe = safeLink(
          cleanURL.replace(/&amp;/g, "&")
        );

        if (!safe) return match;

        return (
          prefix +
          '<a href="' + escapeHTML(safe) +
          '" target="_blank" rel="noopener noreferrer">' +
          cleanURL + "</a>" + trailing
        );
      }
    );

    // Fett und kursiv.
    value = value.replace(
      /\*\*\*(.+?)\*\*\*/g,
      "<strong><em>$1</em></strong>"
    );
    value = value.replace(
      /___(.+?)___/g,
      "<strong><em>$1</em></strong>"
    );
    value = value.replace(
      /\*\*(.+?)\*\*/g,
      "<strong>$1</strong>"
    );
    value = value.replace(
      /__(.+?)__/g,
      "<strong>$1</strong>"
    );
    value = value.replace(
      /(^|[^*])\*([^*\n]+)\*(?!\*)/g,
      "$1<em>$2</em>"
    );
    value = value.replace(
      /(^|[^_])_([^_\n]+)_(?!_)/g,
      "$1<em>$2</em>"
    );
    value = value.replace(
      /~~(.+?)~~/g,
      "<del>$1</del>"
    );

    // Geschützte Inline-Code-Stellen wieder einsetzen.
    value = value.replace(
      /LAMACCODE(\d+)END/g,
      (_, index) => codeParts[Number(index)] || ""
    );

    return value;
  }

  function isTableSeparator(line) {
    const cells = line.trim().replace(/^\||\|$/g, "").split("|");

    return (
      cells.length > 0 &&
      cells.every(cell =>
        /^\s*:?-{3,}:?\s*$/.test(cell)
      )
    );
  }

  function parseTableRow(line) {
    return line
      .trim()
      .replace(/^\||\|$/g, "")
      .split("|")
      .map(cell => cell.trim());
  }

  function renderMarkdown(markdown) {
    const lines = String(markdown || "")
      .replace(/\r\n?/g, "\n")
      .split("\n");

    const output = [];
    let paragraph = [];
    let listType = null;
    let inCodeBlock = false;
    let codeLines = [];

    function flushParagraph() {
      if (!paragraph.length) return;

      output.push(
        "<p>" +
        paragraph.map(renderInline).join("<br>") +
        "</p>"
      );

      paragraph = [];
    }

    function closeList() {
      if (listType) {
        output.push("</" + listType + ">");
        listType = null;
      }
    }

    function closeParagraphAndList() {
      flushParagraph();
      closeList();
    }

    function renderTable(headerLine, bodyLines) {
      const headers = parseTableRow(headerLine);
      const rows = bodyLines.map(parseTableRow);

      let html = '<div class="lamac-table-wrap"><table><thead><tr>';

      for (const cell of headers) {
        html += "<th>" + renderInline(cell) + "</th>";
      }

      html += "</tr></thead><tbody>";

      for (const row of rows) {
        html += "<tr>";

        headers.forEach((_, index) => {
          html += "<td>" +
            renderInline(row[index] || "") +
            "</td>";
        });

        html += "</tr>";
      }

      html += "</tbody></table></div>";

      return html;
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      // Mehrzeilige Codeblöcke.
      if (/^\s*```/.test(line)) {
        if (inCodeBlock) {
          output.push(
            "<pre><code>" +
            escapeHTML(codeLines.join("\n")) +
            "</code></pre>"
          );

          codeLines = [];
          inCodeBlock = false;
        } else {
          closeParagraphAndList();
          inCodeBlock = true;
          codeLines = [];
        }

        continue;
      }

      if (inCodeBlock) {
        codeLines.push(line);
        continue;
      }

      // Markdown-Tabelle mit Kopfzeile und Trennzeile.
      if (
        line.includes("|") &&
        i + 1 < lines.length &&
        isTableSeparator(lines[i + 1])
      ) {
        closeParagraphAndList();

        const header = line;
        i += 2;

        const rows = [];

        while (
          i < lines.length &&
          lines[i].trim() &&
          lines[i].includes("|")
        ) {
          rows.push(lines[i]);
          i++;
        }

        i--;

        output.push(renderTable(header, rows));
        continue;
      }

      // Leerzeile trennt Absätze.
      if (!line.trim()) {
        closeParagraphAndList();
        continue;
      }

      // Überschriften.
      const heading = line.match(/^(#{1,4})\s+(.+)$/);

      if (heading) {
        closeParagraphAndList();

        const level = heading[1].length;

        output.push(
          "<h" + level + ">" +
          renderInline(heading[2]) +
          "</h" + level + ">"
        );

        continue;
      }

      // Horizontale Trennlinie.
      if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) {
        closeParagraphAndList();
        output.push("<hr>");
        continue;
      }

      // Aufzählungen und nummerierte Listen.
      const unordered = line.match(/^\s*[-*+]\s+(.+)$/);
      const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);

      if (unordered || ordered) {
        flushParagraph();

        const nextType = unordered ? "ul" : "ol";

        if (listType !== nextType) {
          closeList();
          output.push("<" + nextType + ">");
          listType = nextType;
        }

        const itemText = (unordered || ordered)[1];

        output.push(
          "<li>" + renderInline(itemText) + "</li>"
        );

        continue;
      }

      // Zitat.
      const quote = line.match(/^\s*>\s?(.*)$/);

      if (quote) {
        closeParagraphAndList();

        output.push(
          "<blockquote>" +
          renderInline(quote[1]) +
          "</blockquote>"
        );

        continue;
      }

      closeList();
      paragraph.push(line);
    }

    if (inCodeBlock) {
      output.push(
        "<pre><code>" +
        escapeHTML(codeLines.join("\n")) +
        "</code></pre>"
      );
    }

    closeParagraphAndList();

    return output.join("");
  }

  function setBusy(value) {
    busy = value;
    sendButton.disabled = value;
    chatInput.disabled = value;
    sendButton.setAttribute("aria-busy", String(value));
  }

  openButton.addEventListener("click", () => {
    chatWindow.classList.add("open");
    chatWindow.setAttribute("aria-hidden", "false");
    chatInput.focus();
  });

  closeButton.addEventListener("click", () => {
    chatWindow.classList.remove("open");
    chatWindow.setAttribute("aria-hidden", "true");
    openButton.focus();
  });

  chatForm.addEventListener("submit", async event => {
    event.preventDefault();

    const text = chatInput.value.trim();

    if (!text || busy) return;

    addUserMessage(text);
    chatInput.value = "";

    // Bisherige Nachrichten plus neue Nutzernachricht.
    const messages = [
      ...history,
      { role: "user", content: text }
    ];

    setBusy(true);

    // Sofort sichtbar: Der Bot verarbeitet die Nachricht.
    const typingIndicator = showTyping();

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          mode: "support",
          messages
        })
      });

      const rawResponse = await response.text();
      let data;

      try {
        data = JSON.parse(rawResponse);
      } catch (_) {
        throw new Error("Ungültige Antwort vom Kundenservice");
      }

      if (!response.ok) {
        throw new Error(
          data.error || "Support nicht erreichbar"
        );
      }

      if (
        typeof data.reply !== "string" ||
        !data.reply.trim()
      ) {
        throw new Error("Leere Antwort vom Kundenservice");
      }

      typingIndicator.remove();
      addBotMessage(data.reply);

      // Verlauf begrenzen, damit Anfragen nicht unbegrenzt wachsen.
      history = [
        ...messages,
        { role: "assistant", content: data.reply }
      ].slice(-12);

    } catch (error) {
      typingIndicator.remove();

      console.error(
        "lamacHub Support-Chat:",
        error?.message || error
      );

      addBotMessage(
        "Der Kundenservice ist gerade nicht erreichbar. Bitte versuche es später erneut."
      );

    } finally {
      setBusy(false);

      if (chatWindow.classList.contains("open")) {
        chatInput.focus();
      }
    }
  });
})();
</script>

<div id="menu">
  <h1>Paddle Game</h1>
  <button id="playButton" class="btn">Spielen</button>
  <div id="highscoreDisplay">Highscore: 0</div>
</div>

<canvas id="gameCanvas" width="600" height="400"></canvas>

<div class="footer">
  © 2026 lamacHub
</div>

<script>
  // Theme Toggle
  const themeToggle = document.getElementById('themeToggle');
  const body = document.body;
  
  // Check for saved theme preference or respect OS preference
  const savedTheme = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  
  if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
    body.classList.add('dark-mode');
  }
  
  themeToggle.addEventListener('click', () => {
    body.classList.toggle('dark-mode');
    const isDark = body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  });

  // Game Code
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const menu = document.getElementById("menu");
  const playButton = document.getElementById("playButton");
  const highscoreDisplay = document.getElementById("highscoreDisplay");

  let paddle, ball, score, highscore = 0, gameRunning = false;

  function resetGame() {
    paddle = {
      width: 100, 
      height: 15, 
      x: canvas.width / 2 - 50, 
      y: canvas.height - 30, 
      speed: 7, 
      dx: 0
    };

    ball = {
      x: canvas.width / 2, 
      y: canvas.height / 2, 
      radius: 10, 
      speed: 4, 
      dx: 4, 
      dy: -4
    };

    score = 0;
    gameRunning = true;
  }

  function drawPaddle() {
    ctx.fillStyle = "#ff7a00";
    ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    // Add rounded corners
    ctx.beginPath();
    const radius = 6;
    ctx.moveTo(paddle.x + radius, paddle.y);
    ctx.lineTo(paddle.x + paddle.width - radius, paddle.y);
    ctx.quadraticCurveTo(paddle.x + paddle.width, paddle.y, paddle.x + paddle.width, paddle.y + radius);
    ctx.lineTo(paddle.x + paddle.width, paddle.y + paddle.height - radius);
    ctx.quadraticCurveTo(paddle.x + paddle.width, paddle.y + paddle.height, paddle.x + paddle.width - radius, paddle.y + paddle.height);
    ctx.lineTo(paddle.x + radius, paddle.y + paddle.height);
    ctx.quadraticCurveTo(paddle.x, paddle.y + paddle.height, paddle.x, paddle.y + paddle.height - radius);
    ctx.lineTo(paddle.x, paddle.y + radius);
    ctx.quadraticCurveTo(paddle.x, paddle.y, paddle.x + radius, paddle.y);
    ctx.closePath();
    ctx.fill();
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#ff7a00";
    ctx.fill();
    ctx.closePath();
  }

  function drawScore() {
    ctx.fillStyle = "var(--text)";
    ctx.font = "18px 'Inter', sans-serif";
    ctx.fillText("Punkte: " + score, 10, 20);
  }

  function movePaddle() {
    paddle.x += paddle.dx;
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.width > canvas.width)
      paddle.x = canvas.width - paddle.width;
  }

  function moveBall() {
    ball.x += ball.dx;
    ball.y += ball.dy;

    // Wandkollision
    if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width)
      ball.dx *= -1;
    if (ball.y - ball.radius < 0)
      ball.dy *= -1;

    // Paddle-Kollision
    if (
      ball.y + ball.radius >= paddle.y &&
      ball.x >= paddle.x &&
      ball.x <= paddle.x + paddle.width
    ) {
      ball.dy *= -1;
      score++;
      if (score > highscore) highscore = score;
    }

    // Game Over
    if (ball.y - ball.radius > canvas.height) {
      gameRunning = false;
      showMenu();
    }
  }

  function draw() {
    if (!gameRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawPaddle();
    drawBall();
    drawScore();
    movePaddle();
    moveBall();

    requestAnimationFrame(draw);
  }

  function keyDown(e) {
    if (e.key === "ArrowRight") paddle.dx = paddle.speed;
    else if (e.key === "ArrowLeft") paddle.dx = -paddle.speed;
  }

  function keyUp(e) {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") paddle.dx = 0;
  }

  function showMenu() {
    canvas.style.display = "none";
    menu.style.display = "block";
    highscoreDisplay.textContent = "Highscore: " + highscore;
  }

  function startGame() {
    resetGame();
    menu.style.display = "none";
    canvas.style.display = "block";
    draw();
  }

  // Touchsteuerung hinzufügen
  let touchStartX = 0;

  function touchStart(e) {
    touchStartX = e.touches[0].clientX;
    e.preventDefault();
  }

  function touchMove(e) {
    if (!gameRunning) return;
    const touchMoveX = e.touches[0].clientX;
    const touchDiff = touchMoveX - touchStartX;

    paddle.x += touchDiff * 1.0;
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.width > canvas.width)
      paddle.x = canvas.width - paddle.width;

    touchStartX = touchMoveX;
    e.preventDefault();
  }

  playButton.addEventListener("click", startGame);
  document.addEventListener("keydown", keyDown);
  document.addEventListener("keyup", keyUp);
  canvas.addEventListener("touchstart", touchStart);
  canvas.addEventListener("touchmove", touchMove);

  showMenu();
</script>
