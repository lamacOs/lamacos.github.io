<body>

<canvas id="visualizer"></canvas>

<audio id="audio"></audio>

<script>
/* =========================================================
   ELEMENTS
========================================================= */

const canvas=document.getElementById("visualizer");
const ctx=canvas.getContext("2d");

const audio=document.getElementById("audio");
const fileInput=document.getElementById("fileInput");
const playButton=document.getElementById("playButton");
const fullscreenButton=document.getElementById("fullscreenButton");
const songName=document.getElementById("songName");
const status=document.getElementById("status");
const progressBar=document.getElementById("progressBar");
const ui=document.getElementById("ui");


/* =========================================================
   SIZE
========================================================= */

let W=1;
let H=1;
let DPR=1;

function resize(){

    W=innerWidth;
    H=innerHeight;

    DPR=Math.min(devicePixelRatio||1,2);

    canvas.width=W*DPR;
    canvas.height=H*DPR;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);

    createObjects();
}

addEventListener("resize",resize);
addEventListener("orientationchange",()=>setTimeout(resize,100));


/* =========================================================
   AUDIO
========================================================= */

let audioContext=null;
let analyser=null;
let source=null;

let frequencyData=null;
let timeData=null;

async function initAudio(){

    if(audioContext){

        if(audioContext.state==="suspended")
            await audioContext.resume();

        return;
    }

    audioContext=new(window.AudioContext||window.webkitAudioContext)();

    analyser=audioContext.createAnalyser();

    analyser.fftSize=2048;
    analyser.smoothingTimeConstant=.8;

    frequencyData=new Uint8Array(analyser.frequencyBinCount);
    timeData=new Uint8Array(analyser.fftSize);

    source=audioContext.createMediaElementSource(audio);

    source.connect(analyser);
    analyser.connect(audioContext.destination);
}


let bass=0;
let lowMid=0;
let mid=0;
let highMid=0;
let treble=0;
let energy=0;
let previousEnergy=0;
let dynamics=0;
let intensity=0;
let pulse=0;

let lastBeat=0;
let beatCount=0;

function avg(a,b){

    if(!analyser)return 0;

    const nyquist=audioContext.sampleRate/2;

    const start=Math.floor(a/nyquist*frequencyData.length);
    const end=Math.min(
        frequencyData.length-1,
        Math.ceil(b/nyquist*frequencyData.length)
    );

    let sum=0;
    let n=0;

    for(let i=Math.max(0,start);i<=end;i++){
        sum+=frequencyData[i];
        n++;
    }

    return n?sum/n/255:0;
}

function analyse(){

    if(!analyser){
        energy=0;
        intensity=0;
        return;
    }

    analyser.getByteFrequencyData(frequencyData);
    analyser.getByteTimeDomainData(timeData);

    bass=avg(20,150);
    lowMid=avg(150,400);
    mid=avg(400,2000);
    highMid=avg(2000,6000);
    treble=avg(6000,16000);

    energy=
        bass*.34+
        lowMid*.2+
        mid*.18+
        highMid*.16+
        treble*.12;

    dynamics=Math.abs(energy-previousEnergy);

    previousEnergy=energy;

    intensity=Math.min(
        1,
        energy*.8+
        dynamics*4
    );

    const now=performance.now();

    if(
        energy>.53-
        bass*.14-
        intensity*.08 &&
        now-lastBeat>145
    ){

        pulse=1;
        lastBeat=now;
        beatCount++;
    }

    pulse*=.89;
}


/* =========================================================
   OBJECTS
========================================================= */

let particles=[];
let stars=[];
let rings=[];
let bubbles=[];
let sparks=[];

function rand(a,b){
    return Math.random()*(b-a)+a;
}

function createObjects(){

    particles=[];
    stars=[];
    rings=[];
    bubbles=[];
    sparks=[];

    for(let i=0;i<450;i++){

        particles.push({
            x:rand(0,W),
            y:rand(0,H),
            z:rand(.1,1),
            size:rand(.5,3),
            angle:rand(0,Math.PI*2),
            speed:rand(.2,2),
            phase:rand(0,Math.PI*2)
        });
    }

    for(let i=0;i<450;i++){

        stars.push({
            x:rand(-1,1),
            y:rand(-1,1),
            z:rand(.02,1),
            size:rand(.3,2)
        });
    }

    for(let i=0;i<100;i++){

        rings.push({
            radius:rand(20,Math.max(W,H)),
            angle:rand(0,Math.PI*2),
            speed:rand(.1,1)
        });
    }

    for(let i=0;i<80;i++){

        bubbles.push({
            x:rand(0,W),
            y:rand(0,H),
            r:rand(2,30),
            speed:rand(.1,1),
            phase:rand(0,Math.PI*2)
        });
    }

    for(let i=0;i<200;i++){

        sparks.push({
            angle:rand(0,Math.PI*2),
            radius:rand(20,Math.max(W,H)),
            speed:rand(.2,2)
        });
    }
}


/* =========================================================
   29 SCENES
========================================================= */

const scenes=[

    "VOID",
    "NEON_RAIN",
    "COSMIC_TUNNEL",
    "LIQUID_LIGHT",
    "GLASS_CITY",
    "PARTICLE_STORM",
    "LASER_GARDEN",
    "DREAM_WAVE",
    "GEOMETRIC_DREAM",

    /* 10 */
    "BLACK_HOLE",
    "GALAXY_SPIRAL",
    "ENERGY_ORB",
    "MIRROR_WORLD",
    "DIGITAL_OCEAN",
    "LIGHTNING",
    "INFINITE_GRID",
    "AURORA",
    "DNA_TWIST",
    "EXPLOSION",

    /* 20 */
    "FRACTAL_FLOW",
    "STAR_WARP",
    "RIPPLE_WORLD",
    "MAGNETIC_FIELD",
    "CRYSTAL_CAVE",
    "SOLAR_FLARE",
    "RAINBOW_WORMHOLE",
    "SHATTER",
    "ELECTRIC_VINES",
    "QUANTUM_FIELD"
];

let scene="VOID";
let sceneStart=performance.now();

function nextScene(){

    let i=scenes.indexOf(scene);

    scene=scenes[(i+1)%scenes.length];

    sceneStart=performance.now();
}

function previousScene(){

    let i=scenes.indexOf(scene);

    scene=scenes[
        (i-1+scenes.length)%scenes.length
    ];

    sceneStart=performance.now();
}


/* =========================================================
   AUTOMATIC SCENE SELECTION
========================================================= */

function chooseScene(){

    if(!audio.src)return;

    const now=performance.now();

    let duration=11000;

    if(intensity>.72)
        duration=6500;

    if(intensity<.2)
        duration=15000;

    if(now-sceneStart<duration)return;

    let pool;

    if(intensity>.72){

        pool=[
            "PARTICLE_STORM",
            "LASER_GARDEN",
            "LIGHTNING",
            "EXPLOSION",
            "STAR_WARP",
            "SHATTER",
            "ELECTRIC_VINES",
            "SOLAR_FLARE",
            "QUANTUM_FIELD"
        ];

    }else if(intensity<.2){

        pool=[
            "VOID",
            "DREAM_WAVE",
            "LIQUID_LIGHT",
            "COSMIC_TUNNEL",
            "AURORA",
            "CRYSTAL_CAVE",
            "DIGITAL_OCEAN",
            "MIRROR_WORLD"
        ];

    }else{

        pool=scenes.filter(x=>x!==scene);
    }

    scene=
        pool[
            Math.floor(
                Math.random()*pool.length
            )
        ];

    sceneStart=now;
}


/* =========================================================
   COMMON
========================================================= */

function clear(){

    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);
}

function circle(x,y,r,a=.5){

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,255,255,${a})`;
    ctx.stroke();
}


/* =========================================================
   1 VOID
========================================================= */

function drawVoid(){

    clear();

    if(energy<.035)return;

    const r=Math.min(W,H)*(.03+pulse*.15);

    const g=ctx.createRadialGradient(
        W/2,H/2,0,
        W/2,H/2,r
    );

    g.addColorStop(
        0,
        `rgba(255,255,255,${.04+pulse*.3})`
    );

    g.addColorStop(1,"transparent");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
}


/* =========================================================
   2 NEON RAIN
========================================================= */

function drawNeonRain(t){

    clear();

    const n=Math.floor(W/16);

    for(let i=0;i<n;i++){

        const x=i*16;

        const y=
            (t*(.03+intensity*.2)*(20+i%5*10)
            +i*80)%
            (H+150)-150;

        const len=
            25+
            intensity*130+
            bass*80;

        const g=ctx.createLinearGradient(
            x,y,x,y+len
        );

        g.addColorStop(0,"transparent");
        g.addColorStop(
            .5,
            `rgba(255,255,255,${.2+intensity*.7})`
        );
        g.addColorStop(1,"transparent");

        ctx.fillStyle=g;

        ctx.fillRect(
            x,
            y,
            2+pulse*2,
            len
        );
    }
}


/* =========================================================
   3 COSMIC TUNNEL
========================================================= */

function drawCosmicTunnel(t){

    clear();

    const cx=W/2;
    const cy=H/2;
    const max=Math.max(W,H);

    for(let i=0;i<130;i++){

        const z=
            (i/130+t*.00008*(.3+intensity*5))%1;

        const radius=Math.pow(z,3)*max*1.5;

        const a=
            i*.71+
            t*.0002+
            pulse*.5;

        const x=cx+Math.cos(a)*radius;
        const y=cy+Math.sin(a)*radius;

        ctx.beginPath();

        ctx.arc(
            x,y,
            .5+z*4+pulse*4,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            `rgba(255,255,255,${.05+z*.8})`;

        ctx.fill();
    }
}


/* =========================================================
   4 LIQUID LIGHT
========================================================= */

function drawLiquidLight(t){

    clear();

    for(let l=0;l<9;l++){

        ctx.beginPath();

        for(
            let x=0;
            x<=W;
            x+=Math.max(4,W/100)
        ){

            const n=x/W;

            const y=
                H*.5+
                Math.sin(
                    n*8+l+
                    t*.0003*(.3+intensity*3)
                )*
                H*.08*
                (1+l*.08)+
                Math.sin(
                    n*18-t*.0002
                )*
                H*.025;

            if(x===0)
                ctx.moveTo(x,y);
            else
                ctx.lineTo(x,y);
        }

        ctx.lineTo(W,H);
        ctx.lineTo(0,H);
        ctx.closePath();

        ctx.fillStyle=
            `rgba(255,255,255,${.012+l*.006+intensity*.02})`;

        ctx.fill();
    }
}


/* =========================================================
   5 GLASS CITY
========================================================= */

function drawGlassCity(t){

    clear();

    const horizon=H*.65;

    const columns=Math.ceil(W/45);

    for(let i=0;i<columns;i++){

        const x=i/columns*W;
        const w=W/columns*.85;

        const h=
            H*
            (.1+
            ((Math.sin(i*4.3)+1)/2)*.35)*
            (1+bass*.5+pulse*.4);

        ctx.fillStyle=
            "rgba(255,255,255,.035)";

        ctx.fillRect(
            x,
            horizon-h,
            w,
            h
        );

        for(let r=0;r<Math.floor(h/22);r++){

            for(let c=0;c<Math.max(1,Math.floor(w/16));c++){

                if(
                    Math.sin(
                        i+r+c+t*.001
                    )>.55
                ){

                    ctx.fillStyle=
                        `rgba(255,255,255,${.05+intensity*.3})`;

                    ctx.fillRect(
                        x+5+c*16,
                        horizon-h+8+r*21,
                        3,
                        6
                    );
                }
            }
        }
    }

    ctx.fillStyle=
        `rgba(255,255,255,${.1+intensity*.4})`;

    ctx.fillRect(
        0,horizon,W,1+pulse*3
    );
}


/* =========================================================
   6 PARTICLE STORM
========================================================= */

function drawParticleStorm(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(const p of particles){

        const a=
            p.angle+
            t*.0002*(.2+intensity*5);

        p.x+=Math.cos(a)*p.speed*(.3+intensity*3);
        p.y+=Math.sin(a)*p.speed*(.3+intensity*3);

        if(p.x<-30)p.x=W+30;
        if(p.x>W+30)p.x=-30;
        if(p.y<-30)p.y=H+30;
        if(p.y>H+30)p.y=-30;

        ctx.beginPath();

        ctx.arc(
            p.x,p.y,
            p.size*(1+intensity*2),
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            `rgba(255,255,255,${.1+p.z*.7})`;

        ctx.fill();
    }

    circle(
        cx,
        cy,
        pulse*Math.max(W,H)*.7,
        pulse*.3
    );
}


/* =========================================================
   7 LASER GARDEN
========================================================= */

function drawLaserGarden(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(let i=0;i<55;i++){

        const a=
            i*.35+
            t*.0002+
            Math.sin(i+t*.001)*.4;

        const r=
            Math.max(W,H)*
            (.2+Math.random()*.7);

        ctx.beginPath();

        ctx.moveTo(cx,cy);

        ctx.lineTo(
            cx+Math.cos(a)*r,
            cy+Math.sin(a)*r
        );

        ctx.strokeStyle=
            `rgba(255,255,255,${.015+intensity*.08})`;

        ctx.lineWidth=
            .5+pulse*2;

        ctx.stroke();
    }
}


/* =========================================================
   8 DREAM WAVE
========================================================= */

function drawDreamWave(t){

    clear();

    for(let l=0;l<8;l++){

        ctx.beginPath();

        for(let x=0;x<=W;x+=8){

            const y=
                H*.5+
                Math.sin(
                    x*.018+l+
                    t*.0002
                )*
                H*.04*
                (1+intensity)+
                Math.sin(
                    x*.05-t*.00015
                )*
                H*.02;

            if(x===0)
                ctx.moveTo(x,y);
            else
                ctx.lineTo(x,y);
        }

        ctx.strokeStyle=
            `rgba(255,255,255,${.025+l*.018})`;

        ctx.lineWidth=1+pulse*2;

        ctx.stroke();
    }
}


/* =========================================================
   9 GEOMETRIC DREAM
========================================================= */

function drawGeometricDream(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(let i=0;i<18;i++){

        const s=
            Math.min(W,H)*
            (.08+i*.025)*
            (1+pulse*.5);

        ctx.save();

        ctx.translate(cx,cy);

        ctx.rotate(
            t*.00015*(.3+intensity*4)+i*.3
        );

        ctx.strokeStyle=
            `rgba(255,255,255,${.025+i*.006})`;

        ctx.strokeRect(
            -s/2,-s/2,s,s
        );

        ctx.restore();
    }
}


/* =========================================================
   10 BLACK HOLE
========================================================= */

function drawBlackHole(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(let i=0;i<90;i++){

        const a=
            i*.17+
            t*.0002+
            pulse;

        const r=
            20+
            i*i*.22+
            pulse*80;

        ctx.beginPath();

        ctx.arc(
            cx+Math.cos(a)*r,
            cy+Math.sin(a)*r*.55,
            1+i*.015,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            `rgba(255,255,255,${.03+i*.004})`;

        ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(
        cx,cy,
        35+bass*100+pulse*30,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#000";
    ctx.fill();
}


/* =========================================================
   11 GALAXY SPIRAL
========================================================= */

function drawGalaxySpiral(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(let i=0;i<700;i++){

        const a=
            i*.15+
            t*.00015*(1+intensity*3);

        const r=
            Math.sqrt(i)/Math.sqrt(700)*
            Math.max(W,H)*.55;

        const x=
            cx+
            Math.cos(a)*r;

        const y=
            cy+
            Math.sin(a)*r*.55;

        ctx.fillStyle=
            `rgba(255,255,255,${.02+(1-r/(Math.max(W,H)*.55))*.6})`;

        ctx.fillRect(
            x,
            y,
            1+pulse*2,
            1+pulse*2
        );
    }
}


/* =========================================================
   12 ENERGY ORB
========================================================= */

function drawEnergyOrb(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    const r=
        Math.min(W,H)*
        (.12+bass*.25+pulse*.15);

    for(let i=0;i<80;i++){

        const a=
            i*.3+
            t*.0005;

        const rr=
            r+
            Math.sin(i*2+t*.003)*
            r*.4*
            (1+intensity);

        ctx.beginPath();

        ctx.moveTo(cx,cy);

        ctx.lineTo(
            cx+Math.cos(a)*rr,
            cy+Math.sin(a)*rr
        );

        ctx.strokeStyle=
            `rgba(255,255,255,${.015+intensity*.1})`;

        ctx.stroke();
    }

    const g=ctx.createRadialGradient(
        cx,cy,0,
        cx,cy,r
    );

    g.addColorStop(
        0,
        `rgba(255,255,255,${.2+pulse*.5})`
    );

    g.addColorStop(1,"transparent");

    ctx.fillStyle=g;

    ctx.fillRect(
        cx-r,
        cy-r,
        r*2,
        r*2
    );
}


/* =========================================================
   13 MIRROR WORLD
========================================================= */

function drawMirrorWorld(t){

    clear();

    const half=W/2;

    for(let i=0;i<90;i++){

        const y=
            (i/90)*H;

        const wave=
            Math.sin(
                i*.5+t*.002
            )*
            40*
            (1+intensity);

        ctx.fillStyle=
            `rgba(255,255,255,${.02+intensity*.03})`;

        ctx.fillRect(
            half+wave,
            y,
            2+pulse*3,
            2
        );

        ctx.fillRect(
            half-wave,
            y,
            2+pulse*3,
            2
        );
    }

    ctx.fillStyle=
        `rgba(255,255,255,${.08+intensity*.2})`;

    ctx.fillRect(
        half-1,
        0,
        2,
        H
    );
}


/* =========================================================
   14 DIGITAL OCEAN
========================================================= */

function drawDigitalOcean(t){

    clear();

    for(let y=0;y<H;y+=12){

        ctx.beginPath();

        for(let x=0;x<W;x+=12){

            const wave=
                Math.sin(
                    x*.015+
                    y*.025+
                    t*.001
                )*
                (10+intensity*30);

            const yy=y+wave;

            if(x===0)
                ctx.moveTo(x,yy);
            else
                ctx.lineTo(x,yy);
        }

        ctx.strokeStyle=
            `rgba(255,255,255,${.02+intensity*.06})`;

        ctx.stroke();
    }
}


/* =========================================================
   15 LIGHTNING
========================================================= */

function drawLightning(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(let b=0;b<12;b++){

        let x=cx;
        let y=cy;

        ctx.beginPath();
        ctx.moveTo(x,y);

        for(let i=0;i<12;i++){

            x+=rand(-W*.15,W*.15);
            y+=rand(-H*.15,H*.15);

            ctx.lineTo(x,y);
        }

        ctx.strokeStyle=
            `rgba(255,255,255,${.025+intensity*.25})`;

        ctx.lineWidth=
            .5+pulse*3;

        ctx.stroke();
    }
}


/* =========================================================
   16 INFINITE GRID
========================================================= */

function drawInfiniteGrid(t){

    clear();

    const horizon=H*.5;

    for(let i=-20;i<=20;i++){

        ctx.beginPath();

        ctx.moveTo(
            W/2+i*35,
            horizon
        );

        ctx.lineTo(
            W/2+i*1200,
            H
        );

        ctx.strokeStyle=
            `rgba(255,255,255,${.03+intensity*.08})`;

        ctx.stroke();
    }

    for(let i=0;i<25;i++){

        const p=
            ((i/25+t*.00008*(1+intensity*4))%1);

        const y=
            horizon+
            Math.pow(p,2)*(H-horizon);

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.strokeStyle=
            `rgba(255,255,255,${.025+intensity*.07})`;

        ctx.stroke();
    }
}


/* =========================================================
   17 AURORA
========================================================= */

function drawAurora(t){

    clear();

    for(let l=0;l<10;l++){

        ctx.beginPath();

        for(let x=0;x<=W;x+=6){

            const y=
                H*.3+
                Math.sin(
                    x*.006+
                    t*.0002+
                    l
                )*
                H*.15+
                Math.sin(
                    x*.018-t*.0001
                )*
                H*.04;

            if(x===0)
                ctx.moveTo(x,y);
            else
                ctx.lineTo(x,y);
        }

        ctx.strokeStyle=
            `rgba(255,255,255,${.015+l*.008+intensity*.03})`;

        ctx.lineWidth=
            8+l*2+pulse*10;

        ctx.stroke();
    }
}


/* =========================================================
   18 DNA TWIST
========================================================= */

function drawDNATwist(t){

    clear();

    const cx=W/2;

    for(let i=0;i<80;i++){

        const y=
            i/79*H;

        const a=
            i*.25+
            t*.001*(.3+intensity*3);

        const x1=
            cx+
            Math.sin(a)*
            W*.18;

        const x2=
            cx-
            Math.sin(a)*
            W*.18;

        ctx.beginPath();

        ctx.arc(
            x1,
            y,
            3+pulse*4,
            0,
            Math.PI*2
        );

        ctx.arc(
            x2,
            y,
            3+pulse*4,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            `rgba(255,255,255,${.1+intensity*.5})`;

        ctx.fill();

        if(i%5===0){

            ctx.beginPath();
            ctx.moveTo(x1,y);
            ctx.lineTo(x2,y);

            ctx.strokeStyle=
                "rgba(255,255,255,.08)";

            ctx.stroke();
        }
    }
}


/* =========================================================
   19 EXPLOSION
========================================================= */

function drawExplosion(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(let i=0;i<350;i++){

        const a=i*.618;
        const r=
            ((i*17)%100)/100*
            Math.max(W,H)*
            (.15+intensity*1.1);

        const x=
            cx+Math.cos(a)*r;

        const y=
            cy+Math.sin(a)*r;

        ctx.fillStyle=
            `rgba(255,255,255,${.03+intensity*.5})`;

        ctx.fillRect(
            x,
            y,
            1+pulse*3,
            1+pulse*3
        );
    }
}


/* =========================================================
   20 FRACTAL FLOW
========================================================= */

function drawFractalFlow(t){

    clear();

    for(let i=0;i<100;i++){

        const a=i*.37+t*.0002;

        let x=W/2;
        let y=H/2;

        ctx.beginPath();
        ctx.moveTo(x,y);

        for(let j=0;j<8;j++){

            const r=
                15+j*25+
                intensity*80;

            x+=Math.cos(a+j*.8)*r*.12;
            y+=Math.sin(a-j*.7)*r*.12;

            ctx.lineTo(x,y);
        }

        ctx.strokeStyle=
            `rgba(255,255,255,${.015+intensity*.05})`;

        ctx.stroke();
    }
}


/* =========================================================
   21 STAR WARP
========================================================= */

function drawStarWarp(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(const s of stars){

        const z=
            (s.z-
            t*.00015*(.2+intensity*5))%1;

        const zz=z<0?z+1:z;

        const x=
            cx+
            s.x/zz*
            Math.max(W,H);

        const y=
            cy+
            s.y/zz*
            Math.max(W,H);

        if(
            x<-50||
            x>W+50||
            y<-50||
            y>H+50
        )continue;

        const px=
            cx+
            s.x/(zz+.03)*
            Math.max(W,H);

        const py=
            cy+
            s.y/(zz+.03)*
            Math.max(W,H);

        ctx.beginPath();

        ctx.moveTo(px,py);
        ctx.lineTo(x,y);

        ctx.strokeStyle=
            `rgba(255,255,255,${.05+(1-zz)*.8})`;

        ctx.lineWidth=
            s.size*(1-zz)*3;

        ctx.stroke();
    }
}


/* =========================================================
   22 RIPPLE WORLD
========================================================= */

function drawRippleWorld(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(let i=0;i<35;i++){

        const r=
            (
                i*45+
                t*.06*(.2+intensity*4)
            )%
            (Math.max(W,H)*1.2);

        ctx.beginPath();

        ctx.ellipse(
            cx,
            cy,
            r,
            r*.45,
            0,
            0,
            Math.PI*2
        );

        ctx.strokeStyle=
            `rgba(255,255,255,${.02+intensity*.08})`;

        ctx.lineWidth=
            1+pulse*2;

        ctx.stroke();
    }
}


/* =========================================================
   23 MAGNETIC FIELD
========================================================= */

function drawMagneticField(t){

    clear();

    for(let x=0;x<W;x+=28){

        for(let y=0;y<H;y+=28){

            const dx=x-W/2;
            const dy=y-H/2;

            const angle=
                Math.atan2(dy,dx)+
                Math.sin(
                    Math.sqrt(dx*dx+dy*dy)*.01+
                    t*.001
                );

            const len=
                8+intensity*15+pulse*10;

            ctx.beginPath();

            ctx.moveTo(x,y);

            ctx.lineTo(
                x+Math.cos(angle)*len,
                y+Math.sin(angle)*len
            );

            ctx.strokeStyle=
                `rgba(255,255,255,${.025+intensity*.06})`;

            ctx.stroke();
        }
    }
}


/* =========================================================
   24 CRYSTAL CAVE
========================================================= */

function drawCrystalCave(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(let i=0;i<80;i++){

        const a=i*.47;
        const r=
            50+
            i*12+
            Math.sin(t*.001+i)*30;

        const x=
            cx+Math.cos(a)*r;

        const y=
            cy+Math.sin(a)*r;

        const s=
            10+i*.2+pulse*20;

        ctx.beginPath();

        ctx.moveTo(x,y-s);
        ctx.lineTo(x+s*.5,y);
        ctx.lineTo(x,y+s);
        ctx.lineTo(x-s*.5,y);
        ctx.closePath();

        ctx.strokeStyle=
            `rgba(255,255,255,${.02+intensity*.08})`;

        ctx.stroke();
    }
}


/* =========================================================
   25 SOLAR FLARE
========================================================= */

function drawSolarFlare(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(let i=0;i<180;i++){

        const a=i*.17+t*.0003;
        const r=
            30+
            Math.sin(i*2+t*.003)*
            40+
            intensity*100+
            pulse*150;

        ctx.beginPath();

        ctx.moveTo(cx,cy);

        ctx.lineTo(
            cx+Math.cos(a)*r,
            cy+Math.sin(a)*r
        );

        ctx.strokeStyle=
            `rgba(255,255,255,${.01+intensity*.06})`;

        ctx.stroke();
    }

    const g=ctx.createRadialGradient(
        cx,cy,0,
        cx,cy,
        100+intensity*150
    );

    g.addColorStop(
        0,
        `rgba(255,255,255,${.15+pulse*.5})`
    );

    g.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        cx-250,
        cy-250,
        500,
        500
    );
}


/* =========================================================
   26 RAINBOW WORMHOLE
========================================================= */

function drawRainbowWormhole(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(let i=0;i<180;i++){

        const a=
            i*.18+
            t*.0005;

        const r=
            Math.pow(
                i/180,
                1.8
            )*
            Math.max(W,H)*.7;

        const wobble=
            Math.sin(
                i*.2+t*.002
            )*
            30*
            intensity;

        const x=
            cx+
            Math.cos(a)*r+
            wobble;

        const y=
            cy+
            Math.sin(a)*r;

        ctx.fillStyle=
            `rgba(255,255,255,${.02+i/180*.35})`;

        ctx.fillRect(
            x,
            y,
            2+pulse*3,
            2+pulse*3
        );
    }
}


/* =========================================================
   27 SHATTER
========================================================= */

function drawShatter(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(let i=0;i<80;i++){

        const a=i*.47;
        const r=
            (i*13+
            pulse*300+
            intensity*100)%
            Math.max(W,H);

        const x=
            cx+Math.cos(a)*r;

        const y=
            cy+Math.sin(a)*r;

        ctx.beginPath();

        ctx.moveTo(
            cx+Math.cos(a)*20,
            cy+Math.sin(a)*20
        );

        ctx.lineTo(x,y);

        ctx.strokeStyle=
            `rgba(255,255,255,${.015+intensity*.1})`;

        ctx.lineWidth=
            1+pulse*3;

        ctx.stroke();
    }
}


/* =========================================================
   28 ELECTRIC VINES
========================================================= */

function drawElectricVines(t){

    clear();

    for(let v=0;v<25;v++){

        let x=
            (v/25)*W;

        let y=H;

        ctx.beginPath();
        ctx.moveTo(x,y);

        for(let i=0;i<15;i++){

            x+=
                Math.sin(
                    t*.002+
                    i+
                    v
                )*
                (10+intensity*30);

            y-=H/15;

            ctx.lineTo(x,y);
        }

        ctx.strokeStyle=
            `rgba(255,255,255,${.02+intensity*.08})`;

        ctx.lineWidth=
            1+pulse*2;

        ctx.stroke();
    }
}


/* =========================================================
   29 QUANTUM FIELD
========================================================= */

function drawQuantumField(t){

    clear();

    const cx=W/2;
    const cy=H/2;

    for(let i=0;i<900;i++){

        const a=
            i*.618+
            t*.0001;

        const r=
            Math.sqrt(i/900)*
            Math.max(W,H)*.7;

        const wobble=
            Math.sin(
                i*.13+
                t*.002
            )*
            30*
            (1+intensity);

        const x=
            cx+
            Math.cos(a)*r+
            wobble;

        const y=
            cy+
            Math.sin(a)*r;

        ctx.fillStyle=
            `rgba(255,255,255,${.01+intensity*.08})`;

        ctx.fillRect(
            x,y,
            1+pulse*2,
            1+pulse*2
        );
    }
}


/* =========================================================
   RENDER
========================================================= */

function render(t){

    chooseScene();

    if(
        energy<.025 &&
        audio.paused
    ){

        clear();
        return;
    }

    switch(scene){

        case"VOID":drawVoid();break;
        case"NEON_RAIN":drawNeonRain(t);break;
        case"COSMIC_TUNNEL":drawCosmicTunnel(t);break;
        case"LIQUID_LIGHT":drawLiquidLight(t);break;
        case"GLASS_CITY":drawGlassCity(t);break;
        case"PARTICLE_STORM":drawParticleStorm(t);break;
        case"LASER_GARDEN":drawLaserGarden(t);break;
        case"DREAM_WAVE":drawDreamWave(t);break;
        case"GEOMETRIC_DREAM":drawGeometricDream(t);break;

        case"BLACK_HOLE":drawBlackHole(t);break;
        case"GALAXY_SPIRAL":drawGalaxySpiral(t);break;
        case"ENERGY_ORB":drawEnergyOrb(t);break;
        case"MIRROR_WORLD":drawMirrorWorld(t);break;
        case"DIGITAL_OCEAN":drawDigitalOcean(t);break;
        case"LIGHTNING":drawLightning(t);break;
        case"INFINITE_GRID":drawInfiniteGrid(t);break;
        case"AURORA":drawAurora(t);break;
        case"DNA_TWIST":drawDNATwist(t);break;
        case"EXPLOSION":drawExplosion(t);break;

        case"FRACTAL_FLOW":drawFractalFlow(t);break;
        case"STAR_WARP":drawStarWarp(t);break;
        case"RIPPLE_WORLD":drawRippleWorld(t);break;
        case"MAGNETIC_FIELD":drawMagneticField(t);break;
        case"CRYSTAL_CAVE":drawCrystalCave(t);break;
        case"SOLAR_FLARE":drawSolarFlare(t);break;
        case"RAINBOW_WORMHOLE":drawRainbowWormhole(t);break;
        case"SHATTER":drawShatter(t);break;
        case"ELECTRIC_VINES":drawElectricVines(t);break;
        case"QUANTUM_FIELD":drawQuantumField(t);break;
    }
}


/* =========================================================
   UI
========================================================= */

let uiTimer=null;

function showUI(){

    ui.classList.remove("hidden");

    clearTimeout(uiTimer);

    uiTimer=setTimeout(()=>{

        if(
            !audio.paused &&
            (
                document.fullscreenElement||
                document.webkitFullscreenElement
            )
        ){
            ui.classList.add("hidden");
        }

    },2500);
}


/* =========================================================
   CURSOR TOGGLE
========================================================= */

let cursorHidden=false;

function toggleCursor(){

    cursorHidden=!cursorHidden;

    document.body.classList.toggle(
        "cursor-hidden",
        cursorHidden
    );

    status.textContent=
        cursorHidden
        ?"CURSOR AUS"
        :"CURSOR AN";

    if(!cursorHidden)
        showUI();
}

addEventListener("keydown",e=>{

    if(
        e.key.toLowerCase()==="t" &&
        e.target.tagName!=="INPUT"
    ){

        e.preventDefault();

        toggleCursor();
    }

    if(e.code==="Space"){

        e.preventDefault();

        togglePlay();
    }

    if(e.key.toLowerCase()==="f"){

        e.preventDefault();

        fullscreen();
    }

});


/* =========================================================
   FILE
========================================================= */

let objectURL=null;

fileInput.addEventListener("change",async e=>{

    const file=e.target.files[0];

    if(!file)return;

    if(objectURL)
        URL.revokeObjectURL(objectURL);

    objectURL=URL.createObjectURL(file);

    audio.src=objectURL;
    audio.load();

    songName.textContent=file.name;

    songFinished=false;
    scene="VOID";
    sceneStart=performance.now();

    await initAudio();

    try{

        await audio.play();

        playButton.textContent="❚❚ Pause";
        status.textContent="Analyse läuft";

    }catch{

        status.textContent="Bereit – Play drücken";
    }
});


/* =========================================================
   PLAY
========================================================= */

async function togglePlay(){

    if(!audio.src){

        fileInput.click();
        return;
    }

    await initAudio();

    if(audio.paused){

        if(songFinished){

            audio.currentTime=0;
            songFinished=false;
        }

        await audio.play();

        playButton.textContent="❚❚ Pause";

    }else{

        audio.pause();

        playButton.textContent="▶ Play";
    }
}

playButton.addEventListener(
    "click",
    togglePlay
);


/* =========================================================
   FULLSCREEN
========================================================= */

let wasFullscreen=false;
let fullscreenUsed=false;
let songFinished=false;
let reloadDone=false;

async function fullscreen(){

    try{

        if(
            !document.fullscreenElement &&
            !document.webkitFullscreenElement
        ){

            fullscreenUsed=true;

            if(document.documentElement.requestFullscreen)
                await document.documentElement.requestFullscreen();

            else if(document.documentElement.webkitRequestFullscreen)
                document.documentElement.webkitRequestFullscreen();

        }else{

            if(document.exitFullscreen)
                await document.exitFullscreen();

            else if(document.webkitExitFullscreen)
                document.webkitExitFullscreen();
        }

    }catch{

        status.textContent="Vollbild nicht verfügbar";
    }
}

fullscreenButton.addEventListener(
    "click",
    fullscreen
);


/* =========================================================
   FULLSCREEN CHANGE
========================================================= */

function fullscreenChange(){

    const active=
        !!(
            document.fullscreenElement||
            document.webkitFullscreenElement
        );

    if(active){

        wasFullscreen=true;

    }else{

        /*
          Genau hier erfolgt der gewünschte
          automatische Reload.

          Song muss komplett fertig sein
          UND Vollbild muss vorher aktiv
          gewesen sein.
        */

        if(
            wasFullscreen&&
            fullscreenUsed&&
            songFinished&&
            !reloadDone
        ){

            reloadDone=true;

            setTimeout(
                ()=>location.reload(),
                350
            );
        }
    }
}

document.addEventListener(
    "fullscreenchange",
    fullscreenChange
);

document.addEventListener(
    "webkitfullscreenchange",
    fullscreenChange
);


/* =========================================================
   SONG ENDED
========================================================= */

audio.addEventListener("ended",()=>{

    songFinished=true;

    playButton.textContent="▶ Play";

    status.textContent="■ ENDE";

    progressBar.style.width="100%";

    clear();
});


/* =========================================================
   PROGRESS
========================================================= */

audio.addEventListener(
    "timeupdate",
    ()=>{

        if(
            audio.duration&&
            isFinite(audio.duration)
        ){

            progressBar.style.width=
                (
                    audio.currentTime/
                    audio.duration*
                    100
                )+"%";
        }
    }
);


/* =========================================================
   TOUCH
========================================================= */

let touchX=0;
let touchY=0;

canvas.addEventListener(
    "touchstart",
    e=>{

        if(e.touches.length!==1)return;

        touchX=e.touches[0].clientX;
        touchY=e.touches[0].clientY;

        showUI();

    },
    {passive:true}
);

canvas.addEventListener(
    "touchend",
    e=>{

        if(e.changedTouches.length!==1)return;

        const x=e.changedTouches[0].clientX;
        const y=e.changedTouches[0].clientY;

        const dx=x-touchX;
        const dy=y-touchY;

        if(
            Math.abs(dx)>60&&
            Math.abs(dx)>Math.abs(dy)
        ){

            if(dx>0)
                previousScene();
            else
                nextScene();

        }else{

            showUI();
        }
    },
    {passive:true}
);


/* =========================================================
   DOUBLE TAP / DOUBLE CLICK
========================================================= */

let lastTap=0;

canvas.addEventListener(
    "click",
    ()=>{

        const now=Date.now();

        if(now-lastTap<350){

            fullscreen();
        }

        lastTap=now;

    }
);


/* =========================================================
   MOUSE
========================================================= */

addEventListener(
    "mousemove",
    showUI,
    {passive:true}
);


/* =========================================================
   MAIN LOOP
========================================================= */

let lastTime=performance.now();

function loop(t){

    lastTime=t;

    analyse();

    render(t);

    if(!songFinished){

        const mode=
            intensity>.72
            ?"WILD"
            :
            intensity<.2
            ?"CALM"
            :"NORMAL";

        status.textContent=
            mode+
            " • "+
            scene.replaceAll("_"," ");
    }

    requestAnimationFrame(loop);
}


/* =========================================================
   INIT
========================================================= */

resize();

requestAnimationFrame(loop);

</script>
