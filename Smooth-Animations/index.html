<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50 Animationen</title>

<style>
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --text: #111111;
  --secondary-text: #666666;
  --accent: #ff7a00;
  --shadow: 0 8px 24px rgba(0,0,0,0.08);
  --border: #eaeaea;
}

body.dark {
  --bg: #0f1115;
  --card: #171a21;
  --text: #ffffff;
  --secondary-text: #bdbdbd;
  --accent: #ff7a00;
  --shadow: 0 8px 24px rgba(0,0,0,0.3);
  --border: #2b2f38;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, sans-serif;
  transition: .3s;
}

/* Navbar */
nav {
  position: sticky;
  top: 0;
  z-index: 900;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 20px 40px;
}

body.dark nav {
  background: rgba(15,17,21,0.7);
}

.navbar-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.navbar-logo {
  display: flex;
  align-items: center;
  gap: 15px;
  text-decoration: none;
}

.navbar-logo-img {
  height: 40px;
  width: auto;
}

.navbar-logo-text {
  font-size: 1.2rem;
  color: var(--text);
  font-weight: 700;
}

.navbar-menu {
  display: flex;
  align-items: center;
  gap: 20px;
}

.theme-toggle {
  width: 50px;
  height: 50px;
  border: none;
  cursor: pointer;
  border-radius: 50%;
  overflow: hidden;
  transition: .3s;
  background: var(--card);
  border: 1px solid var(--border);
}

.theme-toggle:hover {
  transform: scale(1.1);
}

.theme-toggle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Header */
#startPage {
  max-width: 1200px;
  margin: 0 auto;
  padding: 80px 40px 40px 40px;
}

h1 {
  font-size: clamp(2.8rem, 5vw, 5rem);
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 16px;
  text-align: center;
}

.header-description {
  font-size: 1.1rem;
  color: var(--secondary-text);
  margin-bottom: 40px;
  text-align: center;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}

/* Grid */
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
  max-width: 1200px;
  margin: 0 auto 40px auto;
  padding: 0 20px;
}

.card {
  padding: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  cursor: pointer;
  position: relative;
  text-align: center;
  font-weight: 500;
  transition: .3s;
  box-shadow: var(--shadow);
}

.card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}

.card.selected {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  box-shadow: 0 12px 32px rgba(255, 122, 0, 0.2);
}

.card.favorite::after {
  content: "❤️";
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 16px;
}

/* Controls */
.controls {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  text-align: center;
  box-shadow: var(--shadow);
}

#chosenLabel {
  font-size: 1.1rem;
  color: var(--secondary-text);
  display: block;
  margin-bottom: 20px;
  font-weight: 500;
}

.control-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.btn {
  border: none;
  padding: 12px 24px;
  font-size: 1rem;
  cursor: pointer;
  font-weight: 600;
  border-radius: 12px;
  transition: .3s;
  font-family: Inter, sans-serif;
}

.btn.primary {
  background: var(--accent);
  color: white;
}

.btn.primary:hover:not(:disabled) {
  transform: translateY(-2px);
}

.btn.primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn.secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn.secondary:hover {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.control-checkbox {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-weight: 500;
}

.control-checkbox input {
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--accent);
}

/* Overlay für Animation */
#overlay {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
  overflow: hidden;
  z-index: 2000;
}

#stage {
  width: 100vw;
  height: 100vh;
  display: block;
}

#escBtn {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 12px 24px;
  font-size: 1rem;
  background: rgba(255,122,0,0.9);
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  z-index: 2100;
  font-weight: 600;
  transition: .3s;
  font-family: Inter, sans-serif;
}

#escBtn:hover {
  background: var(--accent);
  transform: translateY(-2px);
}

/* Responsive */
@media(max-width: 768px) {
  nav {
    padding: 15px 20px;
  }

  #startPage {
    padding: 60px 20px 40px 20px;
  }

  h1 {
    font-size: 2rem;
  }

  #grid {
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 12px;
    padding: 0 16px;
  }

  .controls {
    margin: 0 16px 40px 16px;
    padding: 24px;
  }

  .control-buttons {
    flex-direction: column;
  }

  .btn {
    width: 100%;
  }
}

@media(max-width: 480px) {
  #startPage {
    padding: 40px 16px 30px 16px;
  }

  h1 {
    font-size: 1.8rem;
  }

  #grid {
    grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    padding: 0 12px;
  }

  .card {
    padding: 12px;
    font-size: 0.9rem;
  }

  .controls {
    margin: 0 12px 40px 12px;
    padding: 16px;
  }

  #chosenLabel {
    font-size: 1rem;
  }

  #escBtn {
    padding: 10px 16px;
    font-size: 0.9rem;
  }
}
</style>

<style>
  #lamac-ai { font-family:Arial,sans-serif; }
  #lamac-ai-open {
    position:fixed; right:24px; bottom:24px; z-index:9999;
    width:58px; height:58px; border:0; border-radius:50%;
    background:#007e62; color:#fff; font-size:25px; cursor:pointer;
    box-shadow:0 8px 24px #0004;
  }
  #lamac-ai-window {
    display:none; position:fixed; right:24px; bottom:94px; z-index:9999;

  .lamac-bot, .lamac-user {
    max-width:82%; margin:8px 0; padding:10px; border-radius:10px;
    white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px;
  }
  .lamac-bot { background:#fff; }
  .lamac-user { margin-left:auto; background:#d8f8e8; }
  #lamac-ai-form { display:flex; gap:8px; padding:11px; background:#f0f2f5; }
  #lamac-ai-input { flex:1; min-width:0; border:0; border-radius:20px; padding:11px; }
  #lamac-ai-form button { width:42px; border:0; border-radius:50%; background:#007e62; color:#fff; cursor:pointer; }
</style>

<script>
  const WORKER_URL = "https://lamacai.oslamu.workers.dev/chat";

  const chatWindow = document.querySelector("#lamac-ai-window");
  const chatMessages = document.querySelector("#lamac-ai-messages");
  const chatInput = document.querySelector("#lamac-ai-input");
  let history = [];
  let messageCount = 0;

  document.querySelector("#lamac-ai-open").onclick = () => {
    chatWindow.classList.add("open");
    chatInput.focus();
  };

  document.querySelector("#lamac-ai-close").onclick = () => {
    chatWindow.classList.remove("open");
  };

  function addMessage(text, type) {
    const item = document.createElement("div");
    item.className = type;
    item.textContent = text;
    chatMessages.appendChild(item);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  document.querySelector("#lamac-ai-form").onsubmit = async event => {
    event.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;

    addMessage(text, "lamac-user");
    chatInput.value = "";
    messageCount++;

    if (messageCount === 15) {
      addMessage(
        "Hinweis: Bitte fassen Sie Ihr Anliegen möglichst in wenigen, konkreten Nachrichten zusammen.",
        "lamac-bot"
      );
    }

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error);

      addMessage(data.reply, "lamac-bot");
      history.push(
        { role: "user", content: text },
        { role: "assistant", content: data.reply }
      );

      history = history.slice(-12);
    } catch {
      addMessage(
        "Der Kundenservice ist gerade nicht erreichbar. Bitte versuchen Sie es später erneut.",
        "lamac-bot"
      );
    }
  };
</script>

<!-- Main Content -->
<div id="startPage">

<!-- Overlay für Animation -->
<div id="overlay">
  <canvas id="stage"></canvas>
  <button id="escBtn">✕ Schließen</button>
</div>

<script>
  /* ---------- Theme Toggle ---------- */
  const body = document.body;
  const themeImage = document.getElementById("themeImage");

  const sunImage = "https://raw.githubusercontent.com/lamacOs/lamacos.github.io/main/lamacOsInfo/Lightmode.png";
  const moonImage = "https://raw.githubusercontent.com/lamacOs/lamacos.github.io/main/lamacOsInfo/Darkmode.png";

  function toggleTheme(){
    body.classList.toggle("dark");

    if(body.classList.contains("dark")){
      themeImage.src = moonImage;
      localStorage.setItem("theme", "dark");
    }else{
      themeImage.src = sunImage;
      localStorage.setItem("theme", "light");
    }
  }

  if(localStorage.getItem("theme") === "dark"){
    body.classList.add("dark");
    themeImage.src = moonImage;
  }

  /* ---------- Animation Manager ---------- */
  const TOTAL = 50;
  const DURATION = 8000;

  const grid = document.getElementById("grid");
  const playBtn = document.getElementById("playBtn");
  const randomBtn = document.getElementById("randomBtn");
  const chosenLabel = document.getElementById("chosenLabel");
  const overlay = document.getElementById("overlay");
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const loopCheckbox = document.getElementById("loopCheckbox");
  const escBtn = document.getElementById("escBtn");

  let chosen = null;
  let W = 0, H = 0;
  let loopForever = false;
  let currentAnim = null;

  // Favoriten aus localStorage
  let favs = JSON.parse(localStorage.getItem("favAnims") || "[]");

  /* ---------- Auswahl & Favoriten ---------- */
  for (let i = 1; i <= TOTAL; i++) {
    const c = document.createElement("div");
    c.className = "card";
    c.textContent = i;
    if(favs.includes(i)) c.classList.add("favorite");
    
    c.onclick = () => select(i, c);
    c.ondblclick = () => toggleFavorite(i, c);
    
    grid.appendChild(c);
  }

  function select(i, el) {
    document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
    el.classList.add("selected");
    chosen = i;
    chosenLabel.textContent = "Ausgewählt: Animation " + i;
    playBtn.disabled = false;
  }

  function toggleFavorite(i, el){
    if(favs.includes(i)){
      favs = favs.filter(x=>x!==i);
      el.classList.remove("favorite");
    } else {
      favs.push(i);
      el.classList.add("favorite");
    }
    localStorage.setItem("favAnims", JSON.stringify(favs));
  }

  /* ---------- Buttons ---------- */
  playBtn.onclick = () => play();
  randomBtn.onclick = () => {
    const r = Math.floor(Math.random() * TOTAL) + 1;
    grid.children[r-1].click();
    play();
  };

  /* ---------- Canvas Resize ---------- */
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    canvas.width = W*dpr;
    canvas.height = H*dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resizeCanvas);

  /* ---------- ESC-Knopf ---------- */
  escBtn.onclick = () => {
    overlay.style.display = "none";
    if(currentAnim) cancelAnimationFrame(currentAnim);
  };

  /* ---------- Play ---------- */
  async function play() {
    overlay.style.display = "block";
    resizeCanvas();
    loopForever = loopCheckbox.checked;
    await runAnimation(chosen);
    if(loopForever && overlay.style.display !== "none") play();
    else overlay.style.display = "none";
  }

  /* ---------- Runner ---------- */
  function runAnimation(id){
    return new Promise(resolve=>{
      const anim = animations[id-1];
      const start = performance.now();

      function loop(now){
        const t = (now - start)/1000;
        ctx.clearRect(0,0,W,H);
        ctx.fillStyle = "white";
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        ctx.globalAlpha = 1;

        anim(t);

        if(now - start >= DURATION){
          resolve();
        } else {
          currentAnim = requestAnimationFrame(loop);
        }
      }

      currentAnim = requestAnimationFrame(loop);
    });
  }

  /* ---------- Helper ---------- */
  function center(){ return [W/2, H/2]; }

  /* ========================================================= */
  /* =================== ANIMATIONEN ========================= */
  /* ========================================================= */

  const animations = [];

  // 1–50 Animationen
  function circlePulse(t){const [x,y]=center();ctx.strokeStyle=`hsl(${t*100},80%,60%)`;ctx.lineWidth=6;ctx.beginPath();ctx.arc(x,y,100+Math.sin(t*3)*60,0,Math.PI*2);ctx.stroke();}
  function squareSpin(t){const [x,y]=center();ctx.save();ctx.translate(x,y);ctx.rotate(t);ctx.fillStyle="cyan";ctx.fillRect(-80,-80,160,160);ctx.restore();}
  function particleRain(t){for(let i=0;i<300;i++){ctx.fillStyle="white";ctx.fillRect(Math.random()*W,(Math.random()+t)%1*H,2,6);}}
  function radialLines(t){const [x,y]=center();for(let i=0;i<32;i++){const a=i/32*Math.PI*2+t;ctx.strokeStyle=`hsl(${i*10},80%,60%)`;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*300,y+Math.sin(a)*300);ctx.stroke();}}
  function colorFade(t){ctx.fillStyle=`hsl(${t*80},80%,50%)`;ctx.fillRect(0,0,W,H);}
  function waveRings(t){const [x,y]=center();for(let r=20;r<300;r+=20){ctx.beginPath();ctx.arc(x,y,r+Math.sin(t+r)*10,0,Math.PI*2);ctx.stroke();}}
  function zigzag(t){ctx.beginPath();for(let x=0;x<W;x+=20)ctx.lineTo(x,H/2+Math.sin(x*0.05+t*5)*100);ctx.stroke();}
  function textBounce(t){ctx.fillStyle="white";ctx.font="60px Inter";ctx.fillText("Animation",W/2-150,H/2+Math.sin(t*5)*100);}
  function spiral(t){const [x,y]=center();for(let i=0;i<200;i++){const a=i*0.1+t;ctx.fillStyle=`hsl(${i},100%,60%)`;ctx.fillRect(x+Math.cos(a)*i,y+Math.sin(a)*i,3,3);}}
  function sineField(t){
    for(let y=0;y<H;y+=20){
      ctx.strokeStyle=`hsl(${y},80%,60%)`;
      ctx.beginPath();
      for(let x=0;x<W;x+=10) ctx.lineTo(x,y+Math.sin(x*0.05+t)*20);
      ctx.stroke();
    }
  }
  function fireworks(t){for(let i=0;i<100;i++){const a=i/100*Math.PI*2;ctx.fillStyle="yellow";ctx.fillRect(W/2+Math.cos(a+t)*200,H/2+Math.sin(a+t)*200,4,4);}}
  function gridPulse(t){for(let x=0;x<W;x+=60)for(let y=0;y<H;y+=60){ctx.fillStyle=`hsl(${(x+y+t*50)%360},80%,60%)`;ctx.fillRect(x,y,40+Math.sin(t+x)*10,40+Math.cos(t+y)*10);}}
  function fallingSquares(t){for(let i=0;i<200;i++){ctx.fillStyle=`hsl(${i*5+t*50},80%,60%)`;ctx.fillRect((i*50)%W,(t*200+i*40)%H,20,20);}}
  function orbitDots(t){for(let i=0;i<100;i++){ctx.fillStyle="white";const a=i+t;ctx.fillRect(W/2+Math.cos(a)*200,H/2+Math.sin(a)*200,4,4);}}
  function scanline(t){ctx.fillStyle="lime";ctx.fillRect(0,(t*200)%H,W,40);}
  function explodingCircle(t){ctx.strokeStyle="orange";ctx.beginPath();ctx.arc(W/2,H/2,(t*200)%400,0,Math.PI*2);ctx.stroke();}
  function starfield(t){for(let i=0;i<300;i++){ctx.fillStyle="white";ctx.fillRect(Math.random()*W,(Math.random()+t*0.2)%1*H,2,2);}}
  function rotatingBars(t){ctx.save();ctx.translate(W/2,H/2);ctx.rotate(t);for(let i=0;i<12;i++){ctx.fillStyle=`hsl(${i*30},80%,60%)`;ctx.fillRect(-20,-300,40,150);ctx.rotate(Math.PI/6);}ctx.restore();}
  function noiseFlash(t){for(let i=0;i<2000;i++){ctx.fillStyle=`hsl(${Math.random()*360},100%,50%)`;ctx.fillRect(Math.random()*W,Math.random()*H,2,2);}}
  function bouncingBalls(t){for(let i=0;i<20;i++){ctx.fillStyle="cyan";ctx.beginPath();ctx.arc((t*100+i*80)%W,H/2+Math.sin(t+i)*200,20,0,Math.PI*2);ctx.fill();}}
  function dnaWave(t){for(let y=0;y<H;y+=20){ctx.fillStyle="magenta";ctx.fillRect(W/2+Math.sin(y*0.05+t)*100,y,5,5);ctx.fillRect(W/2-Math.sin(y*0.05+t)*100,y,5,5);}}
  function checkerZoom(t){for(let x=0;x<W;x+=50)for(let y=0;y<H;y+=50){ctx.fillStyle=((x+y)/50+t|0)%2?"#000":"#fff";ctx.fillRect(x,y,50,50);}}
  function pulseCross(t){ctx.fillStyle="red";ctx.fillRect(W/2-20,0,40,H);ctx.fillRect(0,H/2-20,W,40);}
  function floatingText(t){ctx.fillStyle="white";ctx.font="80px Inter";ctx.fillText("WOW",W/2-100,H/2+Math.sin(t)*200);}
  function ringTunnel(t){ctx.strokeStyle="white";for(let i=0;i<20;i++){ctx.beginPath();ctx.arc(W/2,H/2,i*40+((t*100)%40),0,Math.PI*2);ctx.stroke();}}
  function diagonalRain(t){ctx.fillStyle="blue";for(let i=0;i<300;i++)ctx.fillRect((i*30+t*100)%W,(i*50)%H,4,20);}
  function radarSweep(t){ctx.strokeStyle="lime";ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.lineTo(W/2+Math.cos(t)*W,H/2+Math.sin(t)*H);ctx.stroke();}
  function spiralLines(t){ctx.fillStyle="cyan";for(let i=0;i<300;i++){const a=i*0.05+t;ctx.fillRect(W/2+Math.cos(a)*i,H/2+Math.sin(a)*i,2,2);}}
  function zoomRects(t){ctx.strokeStyle="magenta";ctx.strokeRect(W/2-t*50,H/2-t*50,t*100,t*100);}
  function colorGrid(t){for(let x=0;x<W;x+=40)for(let y=0;y<H;y+=40){ctx.fillStyle=`hsl(${x+y+t*50},80%,60%)`;ctx.fillRect(x,y,40,40);}}
  function waveColumns(t){ctx.fillStyle="white";for(let x=0;x<W;x+=30)ctx.fillRect(x,H/2,20,Math.sin(t+x*0.1)*200);}
  function plasma(t){for(let x=0;x<W;x+=10)for(let y=0;y<H;y+=10){ctx.fillStyle=`hsl(${Math.sin(x*0.02+t)+Math.cos(y*0.02+t)*180},80%,60%)`;ctx.fillRect(x,y,10,10);}}
  function orbitRings(t){ctx.strokeStyle="yellow";for(let i=0;i<10;i++){ctx.beginPath();ctx.arc(W/2,H/2,100+i*30+t*10,0,Math.PI*2);ctx.stroke();}}
  function pixelExplosion(t){ctx.fillStyle="white";for(let i=0;i<500;i++)ctx.fillRect(W/2+Math.random()*400-200,H/2+Math.random()*400-200,4,4);}
  function heartbeat(t){ctx.strokeStyle="red";ctx.strokeRect(W/2-100,H/2-50,200+Math.sin(t*5)*50,100);}
  function neonTriangles(t){ctx.strokeStyle="magenta";for(let i=0;i<20;i++){ctx.beginPath();ctx.moveTo(W/2,H/2-i*20);ctx.lineTo(W/2+i*20,H/2+i*20);ctx.lineTo(W/2-i*20,H/2+i*20);ctx.closePath();ctx.stroke();}}
  function vortex(t){ctx.fillStyle="cyan";for(let i=0;i<300;i++){const a=i*0.05+t;ctx.fillRect(W/2+Math.cos(a)*i,H/2+Math.sin(a)*i,2,2);}}
  function randomCircles(t){ctx.strokeStyle="white";for(let i=0;i<50;i++){ctx.beginPath();ctx.arc(Math.random()*W,Math.random()*H,20,0,Math.PI*2);ctx.stroke();}}
  function mirrorWave(t){ctx.fillStyle="white";for(let x=0;x<W;x+=10){const y=Math.sin(t+x*0.05)*100;ctx.fillRect(x,H/2+y,5,5);ctx.fillRect(x,H/2-y,5,5);}}
  function sunburst(t){ctx.strokeStyle="yellow";for(let i=0;i<60;i++){ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.lineTo(W/2+Math.cos(i+t)*W,H/2+Math.sin(i+t)*H);ctx.stroke();}}
  function movingGrid(t){gridPulse(t);}
  function lightBeams(t){ctx.fillStyle="lime";for(let i=0;i<10;i++)ctx.fillRect(i*100+t*50,0,30,H);}
  function confetti(t){ctx.fillStyle="white";for(let i=0;i<300;i++)ctx.fillRect(Math.random()*W,(Math.random()+t)%1*H,6,6);}
  function pulseDots(t){ctx.fillStyle="cyan";for(let i=0;i<200;i++)ctx.fillRect(Math.random()*W,Math.random()*H,4+Math.sin(t*5)*3,4);}
  function hexSpin(t){ctx.strokeStyle="magenta";ctx.save();ctx.translate(W/2,H/2);ctx.rotate(t);for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);ctx.strokeRect(100,0,50,50);}ctx.restore();}
  function flowField(t){ctx.strokeStyle="white";for(let x=0;x<W;x+=30)for(let y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(t+x)*20,y+Math.sin(t+y)*20);ctx.stroke();}}
  function glitchFlash(t){if(Math.random()<0.1){ctx.fillStyle="white";ctx.fillRect(0,0,W,H);}}
  function snow(t){ctx.fillStyle="white";for(let i=0;i<300;i++)ctx.fillRect(Math.random()*W,(Math.random()+t*0.1)%1*H,3,3);}
  function finalExplosion(t){ctx.fillStyle="orange";for(let i=0;i<600;i++)ctx.fillRect(W/2+Math.random()*t*200-t*100,H/2+Math.random()*t*200-t*100,4,4);}
  function blackWhiteFlash(t){ctx.fillStyle = Math.sin(t*10)>0?"white":"black";ctx.fillRect(0,0,W,H);}

  /* ---------- Push alle Animationen ---------- */
  animations.push(
    circlePulse,squareSpin,particleRain,radialLines,colorFade,waveRings,zigzag,textBounce,spiral,sineField,
    fireworks,gridPulse,fallingSquares,orbitDots,scanline,explodingCircle,starfield,rotatingBars,noiseFlash,bouncingBalls,
    dnaWave,checkerZoom,pulseCross,floatingText,ringTunnel,diagonalRain,radarSweep,spiralLines,zoomRects,colorGrid,
    waveColumns,plasma,orbitRings,pixelExplosion,heartbeat,neonTriangles,vortex,randomCircles,mirrorWave,sunburst,
    movingGrid,lightBeams,confetti,pulseDots,hexSpin,flowField,glitchFlash,snow,finalExplosion,blackWhiteFlash
  );
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    updateProfile,
    setPersistence,
    browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    getDatabase,
    ref,
    set,
    get,
    update,
    serverTimestamp,
    onDisconnect
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

  // ============================================================
  // KONFIGURATION – HIER ANPASSEN
  // ============================================================
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyArPBdSmaqqQpqITjs3iCKvY8hxDQg5qFQ",
    authDomain: "jump-and-run-f58e2.firebaseapp.com",
    databaseURL: "https://jump-and-run-f58e2-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "jump-and-run-f58e2",
    storageBucket: "jump-and-run-f58e2.firebasestorage.app",
    messagingSenderId: "1093030272732",
    appId: "1:1093030272732:web:4939ea7a726c69ba78de19",
    measurementId: "G-HM07HRVX34"
  };

  // Welche Site ist das? Wird als Namespace in der DB benutzt:
  //   users/{uid}/sites/{SITE_KEY}/...
  const SITE_KEY  = "animationen";            // z.B. "playhub", "pack-o-mat", "tickets"
  const SITE_NAME = "50 Animationen";     // nur Anzeige

  // ============================================================

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db   = getDatabase(app);
  await setPersistence(auth, browserLocalPersistence);

  // ---------- DOM ----------
  const btn         = document.getElementById("fb-auth-btn");
  const modal       = document.getElementById("fb-auth-modal");
  const closeBtn    = document.getElementById("fb-auth-close");
  const tabs        = document.querySelectorAll("#fb-auth-widget .fb-tab");
  const loginForm   = document.getElementById("fb-login-form");
  const regForm     = document.getElementById("fb-register-form");
  const loginMsg    = loginForm.querySelector(".fb-msg");
  const regMsg      = regForm.querySelector(".fb-msg");
  const userPanel   = document.getElementById("fb-auth-user");
  const userName    = document.getElementById("fb-auth-name");
  const userMeta    = document.getElementById("fb-auth-meta");
  const logoutBtn   = document.getElementById("fb-auth-logout");

  // ---------- Helpers ----------
  const openModal  = () => { modal.classList.add("is-open"); modal.setAttribute("aria-hidden", "false"); };
  const closeModal = () => { modal.classList.remove("is-open"); modal.setAttribute("aria-hidden", "true"); };
  const setMsg     = (el, text, ok = false) => { el.textContent = text; el.classList.toggle("success", !!ok); };

  // ---------- Public API fuer die Seite ----------
  // Andere Scripts koennen mit window.LamacAuth auf Daten zugreifen:
  //   await window.LamacAuth.user()       -> aktueller User oder null
  //   await window.LamacAuth.siteData()   -> site-spezifische Daten
  //   await window.LamacAuth.saveSite(p)  -> site-Daten speichern (merge)
  //   window.LamacAuth.onAuth(cb)         -> Callback bei Login/Logout
  let authListeners = [];
  window.LamacAuth = {
    onAuth(cb){ authListeners.push(cb); if (auth.currentUser) cb(auth.currentUser); },
    user(){ return auth.currentUser; },
    async siteData(){
      const u = auth.currentUser;
      if (!u) return null;
      const snap = await get(ref(db, `users/${u.uid}/sites/${SITE_KEY}`));
      return snap.exists() ? snap.val() : null;
    },
    async saveSite(partial){
      const u = auth.currentUser;
      if (!u) throw new Error("Nicht eingeloggt");
      await update(ref(db, `users/${u.uid}/sites/${SITE_KEY}`), partial);
    }
  };

  // ---------- UI-State ----------
  function applyAuthUI(user){
    if (user) {
      btn.textContent = "Account";
      btn.dataset.state = "in";
      userPanel.classList.add("is-active");
      loginForm.classList.remove("is-active");
      regForm.classList.remove("is-active");
      userName.textContent = user.displayName || user.email;
      userMeta.textContent = user.email;
    } else {
      btn.textContent = "Anmelden";
      btn.dataset.state = "out";
      userPanel.classList.remove("is-active");
      loginForm.classList.add("is-active");
      tabs.forEach(t => t.classList.toggle("is-active", t.dataset.tab === "login"));
    }
  }

  onAuthStateChanged(auth, (user) => {
    applyAuthUI(user);
    authListeners.forEach(cb => cb(user));

    // lastLogin / lastSeen aktualisieren (sehr klein)
    if (user) {
      const uRef = ref(db, `users/${user.uid}/profile/lastLogin`);
      set(uRef, serverTimestamp()).catch(() => {});

      // site-spezifische Meta
      const sRef = ref(db, `users/${user.uid}/sites/${SITE_KEY}/meta`);
      set(sRef, { lastSeen: serverTimestamp(), siteName: SITE_NAME })
        .catch(() => {});

      // Präsenz
      const presenceRef = ref(db, `users/${user.uid}/presence`);
      set(presenceRef, { online: true, since: serverTimestamp() });
      onDisconnect(presenceRef).set({ online: false, since: serverTimestamp() });
    }
  });

  // ---------- Button-Klick ----------
  btn.addEventListener("click", () => openModal());

  // ---------- Modal-Steuerung ----------
  closeBtn.addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  tabs.forEach(t => t.addEventListener("click", () => {
    tabs.forEach(x => x.classList.remove("is-active"));
    t.classList.add("is-active");
    const isLogin = t.dataset.tab === "login";
    loginForm.classList.toggle("is-active", isLogin);
    regForm.classList.toggle("is-active",   !isLogin);
    userPanel.classList.remove("is-active");
  }));

  logoutBtn.addEventListener("click", async () => {
    await signOut(auth);
    closeModal();
  });

  // ---------- LOGIN ----------
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    setMsg(loginMsg, "");
    const submit = loginForm.querySelector("button[type=submit]");
    submit.disabled = true;

    const email    = loginForm.email.value.trim();
    const password = loginForm.password.value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      setMsg(loginMsg, "Erfolgreich angemeldet.", true);
      loginForm.reset();
      setTimeout(closeModal, 600);
    } catch (err) {
      setMsg(loginMsg, err.message);
    } finally {
      submit.disabled = false;
    }
  });

  // ---------- REGISTER ----------
  regForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    setMsg(regMsg, "");
    const submit = regForm.querySelector("button[type=submit]");
    submit.disabled = true;

    const displayName = regForm.displayName.value.trim();
    const email       = regForm.email.value.trim();
    const password    = regForm.password.value;

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName });

      // Profil + site-Meta in EINEM Schreibvorgang (klein!)
      await update(ref(db, `users/${cred.user.uid}`), {
        profile: {
          uid: cred.user.uid,
          email,
          displayName,
          createdAt: serverTimestamp()
        },
        [`sites/${SITE_KEY}/meta`]: {
          siteName: SITE_NAME,
          createdAt: serverTimestamp()
        }
      });

      setMsg(regMsg, "Konto erstellt – du bist eingeloggt.", true);
      regForm.reset();
      setTimeout(closeModal, 700);
    } catch (err) {
      setMsg(regMsg, err.message);
    } finally {
      submit.disabled = false;
    }
  });
</script>


<script>
/* ===== 50 Animationen: Daten-Migration auf Firebase ===== */
(function() {
  const STORAGE_KEY = "favAnims";
  const SITE_KEY    = "animationen";

  // Originale localStorage-Funktionen kapern, damit die Site weiter
  // funktioniert, aber Daten unter dem Account gespeichert werden.
  window.addEventListener('load', async () => {
    // Warten bis Widget-Script geladen ist
    const t = setInterval(async () => {
      if (!window.LamacAuth) return;
      clearInterval(t);

      window.LamacAuth.onAuth(async (user) => {
        if (!user) {
          // Ausgeloggt -> localStorage lesen
          const raw = localStorage.getItem(STORAGE_KEY);
          window.__siteData = raw ? JSON.parse(raw) : {};
          if (window.__render) window.__render();
          return;
        }

        // Eingeloggt -> Cloud-Daten holen, ggf. localStorage migrieren
        try {
          let cloud = await window.LamacAuth.siteData();
          if (!cloud) cloud = { data: {} };

          // Wenn noch nichts in der Cloud, aber localStorage hat Daten: hochladen
          if (cloud.data == null) {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              try {
                cloud.data = JSON.parse(raw);
                await window.LamacAuth.saveSite({ data: cloud.data, migratedAt: Date.now() });
              } catch(e) { cloud.data = {}; }
            } else {
              cloud.data = {};
              await window.LamacAuth.saveSite({ data: {} });
            }
          }

          window.__siteData = cloud.data || {};
          if (window.__render) window.__render();
        } catch (err) {
          console.warn("Cloud-Sync fehlgeschlagen:", err);
        }
      });

      // Hilfsfunktion: Site-Daten speichern (lokal + cloud)
      window.__saveSite = async (data) => {
        window.__siteData = data;
        if (window.LamacAuth && window.LamacAuth.user()) {
          await window.LamacAuth.saveSite({ data, updatedAt: Date.now() });
        } else {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
      };
    }, 50);
  });
})();
</script>


<script>
/* 50 Animationen: Favoriten unter Account speichern */
(function(){
  window.addEventListener('load', () => {
    const t = setInterval(() => {
      if (!window.LamacAuth) return;
      clearInterval(t);

      window.LamacAuth.onAuth(async (user) => {
        if (user) {
          const sd = await window.LamacAuth.siteData();
          const favs = (sd && sd.data && sd.data.favs) || [];
          localStorage.setItem("favAnims", JSON.stringify(favs));
          if (typeof window.renderFavs === 'function') window.renderFavs();
        } else {
          localStorage.removeItem("favAnims");
        }
      });

      // toggleFavorite überschreiben
      if (typeof window.toggleFavorite === 'function') {
        const orig = window.toggleFavorite;
        window.toggleFavorite = async function(i, el) {
          let favs = JSON.parse(localStorage.getItem("favAnims") || "[]");
          if (favs.includes(i)) favs = favs.filter(x => x !== i);
          else favs.push(i);
          localStorage.setItem("favAnims", JSON.stringify(favs));
          if (window.LamacAuth.user()) {
            await window.LamacAuth.saveSite({ data: { favs } });
          }
          orig(i, el);
        };
      }
    }, 50);
  });
})();
</script>
