name: Update Support Knowledge

on:
  push:
    paths-ignore:
      - "support-knowledge/**"
      - ".github/workflows/update-support-knowledge.yml"
  schedule:
    # Weekly refresh; GitHub may delay scheduled runs during busy periods.
    - cron: "23 11 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: support-knowledge
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate AI support documentation
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/generate_support_knowledge.py

      - name: Commit generated documentation
        run: |
          if [[ -n "$(git status --porcelain support-knowledge)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add support-knowledge/
            git commit -m "docs: update AI support knowledge"
            git push
          else
            echo "No documentation changes."
          fi
