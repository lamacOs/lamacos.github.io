<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>lamacOs PlayHub</title>
<script>
function toggleTheme(){
  const r=document.documentElement;
  r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";
}
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#ffffff;
  --text:#111;
  --card:#f6f7fb;
  --accent:#ff7a00;
  --border:rgba(0,0,0,0.08);
}

[data-theme="dark"]{
  --bg:#0f0f12;
  --text:#ffffff;
  --card:#17171c;
  --border:rgba(255,255,255,0.08);
}

*{
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 22px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:var(--bg);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  width:34px;
  height:34px;
  border-radius:8px;
}

.logo span{
  font-weight:700;
  color:var(--text);
}

.toggle{
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}

/* LAYOUT */
.container{
  max-width:900px;
  margin:30px auto;
  padding:0 20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}

h2,h3{
  color:var(--accent);
  margin-top:0;
}

input,button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
}

button{
  background:var(--accent);
  color:#fff;
  font-weight:600;
  cursor:pointer;
  border:none;
}

button:hover{
  opacity:0.9;
}

.small{
  font-size:13px;
  opacity:0.7;
}

/* GAME GRID */
#game-list{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.game-card{
  width:140px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  text-align:center;
  transition:.2s;
}

.game-card:hover{
  transform:translateY(-3px);
}

.game-card img{
  width:100%;
  height:100px;
  object-fit:cover;
}

/* IFRAME GAME */
iframe{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  border:none;
  z-index:999;
  background:#000;
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">
    <img src="https://raw.githubusercontent.com/lamacOs/lamacos.github.io/refs/heads/main/logo.png">
    <span>PlayHub</span>
  </div>

  <button class="toggle" onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<!-- (old login UI removed; replaced by LamacAuth widget) -->

<style>
  :root {
    --fb-orange: #ff6a00;
    --fb-orange-dark: #e85d00;
    --fb-orange-soft: #fff1e6;
    --fb-text: #2a2a2a;
    --fb-muted: #6b6b6b;
    --fb-white: #ffffff;
    --fb-shadow: 0 12px 40px rgba(255, 106, 0, 0.25);
  }
  #fb-auth-widget { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }

  /* Button fest rechts oben, 1 cm Abstand */
  #fb-auth-btn {
    position: fixed;
    top: 10mm;
    right: 10mm;
    background: var(--fb-orange);
    color: var(--fb-white);
    border: none;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(255, 106, 0, 0.35);
    transition: transform .15s ease, background .15s ease;
    z-index: 10000;
  }
  #fb-auth-btn:hover  { background: var(--fb-orange-dark); transform: translateY(-1px); }
  @media (max-width: 480px) {
    #fb-auth-btn { top: 8mm; right: 8mm; padding: 8px 16px; font-size: 14px; }
  }

  /* Modal */
  .fb-modal {
    position: fixed; inset: 0;
    background: rgba(20, 20, 20, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 16px;
  }
  .fb-modal.is-open { display: flex; }
  .fb-modal-card {
    background: var(--fb-white);
    width: 100%;
    max-width: 420px;
    border-radius: 18px;
    padding: 28px 28px 24px;
    box-shadow: var(--fb-shadow);
    position: relative;
    animation: fb-pop .25s ease-out;
    color: var(--fb-text);
  }
  @keyframes fb-pop {
    from { opacity: 0; transform: translateY(20px) scale(.96); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }
  .fb-close {
    position: absolute; top: 10px; right: 14px;
    background: transparent; border: 0;
    font-size: 26px; line-height: 1;
    color: var(--fb-muted); cursor: pointer;
  }
  .fb-close:hover { color: var(--fb-orange); }

  /* Tabs */
  .fb-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .fb-tab {
    flex: 1;
    background: var(--fb-orange-soft);
    color: var(--fb-orange-dark);
    border: none;
    padding: 9px 0;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .fb-tab.is-active {
    background: var(--fb-orange);
    color: var(--fb-white);
  }

  .fb-form { display: none; }
  .fb-form.is-active { display: block; }
  .fb-form h2 {
    margin: 4px 0 14px;
    color: var(--fb-text);
    font-size: 20px;
  }
  .fb-form label {
    display: block;
    font-size: 13px;
    color: var(--fb-muted);
    margin-bottom: 12px;
  }
  .fb-form input {
    width: 100%;
    margin-top: 4px;
    padding: 10px 12px;
    border: 1px solid #e6e6e6;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .fb-form input:focus {
    border-color: var(--fb-orange);
    box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.15);
  }
  .fb-primary {
    width: 100%;
    background: var(--fb-orange);
    color: var(--fb-white);
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    margin-top: 6px;
    transition: background .15s ease;
  }
  .fb-primary:hover { background: var(--fb-orange-dark); }
  .fb-primary:disabled { opacity: .6; cursor: not-allowed; }
  .fb-msg { min-height: 18px; margin: 10px 0 0; font-size: 13px; color: #c0392b; }
  .fb-msg.success { color: #1f8a4c; }

  /* Logged-in Panel */
  .fb-user { display: none; }
  .fb-user.is-active { display: block; }
  .fb-user h2 { margin: 4px 0 10px; font-size: 18px; }
  .fb-meta { font-size: 13px; color: var(--fb-muted); margin-bottom: 14px; word-break: break-all; }
  .hidden  { display: none !important; }
</style>

<!-- (old firebase module removed; replaced by LamacAuth widget) -->


<script>
/* ===== PlayHub: Daten-Migration auf Firebase ===== */
(function() {
  const STORAGE_KEY = "playhub_games";
  const SITE_KEY    = "playhub";

  // Originale localStorage-Funktionen kapern, damit die Site weiter
  // funktioniert, aber Daten unter dem Account gespeichert werden.
  window.addEventListener('load', async () => {
    // Warten bis Widget-Script geladen ist
    const t = setInterval(async () => {
      if (!window.LamacAuth) return;
      clearInterval(t);

      window.LamacAuth.onAuth(async (user) => {
        if (!user) {
          // Ausgeloggt -> localStorage lesen
          const raw = localStorage.getItem(STORAGE_KEY);
          window.__siteData = raw ? JSON.parse(raw) : {};
          if (window.__render) window.__render();
          return;
        }

        // Eingeloggt -> Cloud-Daten holen, ggf. localStorage migrieren
        try {
          let cloud = await window.LamacAuth.siteData();
          if (!cloud) cloud = { data: {} };

          // Wenn noch nichts in der Cloud, aber localStorage hat Daten: hochladen
          if (cloud.data == null) {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              try {
                cloud.data = JSON.parse(raw);
                await window.LamacAuth.saveSite({ data: cloud.data, migratedAt: Date.now() });
              } catch(e) { cloud.data = {}; }
            } else {
              cloud.data = {};
              await window.LamacAuth.saveSite({ data: {} });
            }
          }

          window.__siteData = cloud.data || {};
          if (window.__render) window.__render();
        } catch (err) {
          console.warn("Cloud-Sync fehlgeschlagen:", err);
        }
      });

      // Hilfsfunktion: Site-Daten speichern (lokal + cloud)
      window.__saveSite = async (data) => {
        window.__siteData = data;
        if (window.LamacAuth && window.LamacAuth.user()) {
          await window.LamacAuth.saveSite({ data, updatedAt: Date.now() });
        } else {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
      };
    }, 50);
  });
})();
</script>


<script>
/* PlayHub: Games werden jetzt unter dem Account gespeichert */
(function(){
  window.addEventListener('load', () => {
    const t = setInterval(() => {
      if (!window.LamacAuth) return;
      clearInterval(t);

      let games = [];
      const gameList = document.getElementById('game-list');
      const LOGO_URL = "https://raw.githubusercontent.com/lamacOs/lamacos.github.io/refs/heads/main/logo.png";

      function render() {
        if (!gameList) return;
        gameList.innerHTML = '';
        games.forEach((g, i) => {
          const div = document.createElement('div');
          div.className = 'game-card';
          div.innerHTML = `
            <img src="${LOGO_URL}">
            <div style="padding:6px">${g.name}</div>
          `;
          div.onclick = () => window.playGame(g.link);
          gameList.appendChild(div);
        });
      }
      window.__render = render;

      // Upload-Funktion überschreiben
      window.uploadGame = async () => {
        const name  = document.getElementById('game-name').value.trim();
        const link  = document.getElementById('game-link').value.trim();
        const cover = document.getElementById('game-cover').value.trim();
        if (!name || !link) { alert("Name und Link benötigt."); return; }
        if (!window.LamacAuth.user()) { alert("Bitte erst anmelden."); return; }
        games.push({ name, link, cover });
        await window.__saveSite({ games });
        document.getElementById('game-name').value = '';
        document.getElementById('game-link').value = '';
        document.getElementById('game-cover').value = '';
        render();
      };

      // Auth-State: Sichtbarkeit der UI
      window.LamacAuth.onAuth((user) => {
        const uploadBox = document.getElementById('upload');
        if (uploadBox) uploadBox.style.display = user ? 'block' : 'none';
        const authBox = document.getElementById('auth');
        if (authBox) authBox.style.display = user ? 'none' : 'block';

        // Games vom Cloud-Account laden
        if (user) {
          window.LamacAuth.siteData().then(sd => {
            games = (sd && sd.data && sd.data.games) || [];
            render();
          });
        } else {
          games = [];
          render();
        }
      });
    }, 50);
  });
})();
</script>

</body>
</html>
