<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR to PDF</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<!-- Tesseract + jsPDF -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
body{
    margin:0;
    font-family:Inter, sans-serif;
    background:#f5f5f5;
    color:#111;
}

.navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 40px;
    background:white;
    border-bottom:1px solid #eee;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:700;
    color:#ff7a00;
    font-size:18px;
}

.container{
    max-width:900px;
    margin:60px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

h1{
    color:#ff7a00;
    margin-bottom:10px;
}

input[type="file"]{
    padding:12px;
    border:2px dashed #ddd;
    border-radius:12px;
    width:100%;
    cursor:pointer;
}

button{
    margin-top:20px;
    padding:12px 18px;
    border:none;
    border-radius:12px;
    background:#ff7a00;
    color:white;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#status{
    margin-top:15px;
    font-size:14px;
    color:#555;
}

pre{
    margin-top:20px;
    background:#fafafa;
    padding:15px;
    border-radius:12px;
    white-space:pre-wrap;
    max-height:300px;
    overflow:auto;
}
</style>
</head>
<div id="lamac-ai">
  <button id="lamac-ai-open" aria-label="Kundensupport öffnen">💬</button>

  <section id="lamac-ai-window" aria-label="lamachub Kundensupport">
    <header>
      <div>
        <strong>lamachub Kundenservice</strong>
        <small>KI-gestützter Support</small>
      </div>
      <button id="lamac-ai-close" aria-label="Chat schließen">×</button>
    </header>

    <div id="lamac-ai-messages">
      <div class="lamac-bot">Hallo! Wie kann ich Ihnen weiterhelfen?</div>
    </div>

    <form id="lamac-ai-form">
      <input id="lamac-ai-input" placeholder="Nachricht schreiben" maxlength="1800">
      <button aria-label="Senden">➤</button>
    </form>
  </section>
</div>

<style>
  #lamac-ai { font-family:Arial,sans-serif; }
  #lamac-ai-open {
    position:fixed; right:24px; bottom:24px; z-index:9999;
    width:58px; height:58px; border:0; border-radius:50%;
    background:#007e62; color:#fff; font-size:25px; cursor:pointer;
    box-shadow:0 8px 24px #0004;
  }
  #lamac-ai-window {
    display:none; position:fixed; right:24px; bottom:94px; z-index:9999;
    width:min(370px,calc(100vw - 32px)); height:520px;
    overflow:hidden; border-radius:16px; background:#efeae2;
    box-shadow:0 12px 40px #0004;
  }
  #lamac-ai-window.open { display:flex; flex-direction:column; }
  #lamac-ai-window header {
    display:flex; justify-content:space-between; align-items:center;
    padding:15px; color:#fff; background:#11211d;
  }
  #lamac-ai-window small { display:block; margin-top:2px; color:#b5c6bf; font-size:11px; }
  #lamac-ai-close { border:0; background:transparent; color:#fff; font-size:27px; cursor:pointer; }
  #lamac-ai-messages { flex:1; overflow:auto; padding:15px; }
  .lamac-bot, .lamac-user {
    max-width:82%; margin:8px 0; padding:10px; border-radius:10px;
    white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px;
  }
  .lamac-bot { background:#fff; }
  .lamac-user { margin-left:auto; background:#d8f8e8; }
  #lamac-ai-form { display:flex; gap:8px; padding:11px; background:#f0f2f5; }
  #lamac-ai-input { flex:1; min-width:0; border:0; border-radius:20px; padding:11px; }
  #lamac-ai-form button { width:42px; border:0; border-radius:50%; background:#007e62; color:#fff; cursor:pointer; }
</style>

<script>
  const WORKER_URL = "https://lamacai.oslamu.workers.dev/chat";

  const chatWindow = document.querySelector("#lamac-ai-window");
  const chatMessages = document.querySelector("#lamac-ai-messages");
  const chatInput = document.querySelector("#lamac-ai-input");
  let history = [];
  let messageCount = 0;

  document.querySelector("#lamac-ai-open").onclick = () => {
    chatWindow.classList.add("open");
    chatInput.focus();
  };

  document.querySelector("#lamac-ai-close").onclick = () => {
    chatWindow.classList.remove("open");
  };

  function addMessage(text, type) {
    const item = document.createElement("div");
    item.className = type;
    item.textContent = text;
    chatMessages.appendChild(item);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  document.querySelector("#lamac-ai-form").onsubmit = async event => {
    event.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;

    addMessage(text, "lamac-user");
    chatInput.value = "";
    messageCount++;

    if (messageCount === 15) {
      addMessage(
        "Hinweis: Bitte fassen Sie Ihr Anliegen möglichst in wenigen, konkreten Nachrichten zusammen.",
        "lamac-bot"
      );
    }

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error);

      addMessage(data.reply, "lamac-bot");
      history.push(
        { role: "user", content: text },
        { role: "assistant", content: data.reply }
      );

      history = history.slice(-12);
    } catch {
      addMessage(
        "Der Kundenservice ist gerade nicht erreichbar. Bitte versuchen Sie es später erneut.",
        "lamac-bot"
      );
    }
  };
</script>
<body>

<div class="navbar">
    <div class="logo">🟠 lamacOCR</div>
    <div>© 2026 lamacHub</div>
</div>

<div class="container">
    <div class="card">
        <h1>Bild → Text → PDF</h1>
        <p>Lade ein Bild hoch, erkenne den Text und exportiere ihn als PDF.</p>

        <input type="file" id="imageInput" accept="image/*">

        <button onclick="startOCR()">Text erkennen</button>
        <button onclick="downloadPDF()">PDF herunterladen</button>

        <div id="status"></div>
        <pre id="output"></pre>
    </div>
</div>

<script>
let extractedText = "";

async function startOCR(){
    const file = document.getElementById("imageInput").files[0];
    if(!file){
        alert("Bitte erst ein Bild auswählen");
        return;
    }

    document.getElementById("status").innerText = "Erkenne Text... ⏳";

    const reader = new FileReader();
    reader.onload = async function(){
        const img = reader.result;

        const result = await Tesseract.recognize(
            img,
            "deu+eng",
            {
                logger: m => {
                    if(m.status){
                        document.getElementById("status").innerText =
                        m.status + " " + Math.round(m.progress*100) + "%";
                    }
                }
            }
        );

        extractedText = result.data.text;
        document.getElementById("output").innerText = extractedText;

        document.getElementById("status").innerText = "Fertig ✅";
    };

    reader.readAsDataURL(file);
}

function downloadPDF(){
    if(!extractedText){
        alert("Kein Text vorhanden");
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const lines = doc.splitTextToSize(extractedText, 180);
    doc.text(lines, 10, 10);

    doc.save("ocr-text.pdf");
}
</script>
<script>
(function () {
  if (typeof window === 'undefined' || typeof document === 'undefined') return;

  // 1) Nur anzeigen, wenn der Referrer exakt https://www.lamachub.de ist
  let referrer = '';
  try { referrer = new URL(document.referrer); } catch (e) {}
  if (
    referrer.protocol !== 'https:' ||
    referrer.hostname.toLowerCase() !== 'www.lamachub.de'
  ) return;

  // 2) Container in Shadow DOM, damit die Styles der Host-Seite nicht stören
  const root = document.createElement('div');
  root.setAttribute('data-lamachub-back', '');
  Object.assign(root.style, {
    all: 'initial',
    position: 'fixed',
    top: '0',
    left: '0',
    zIndex: '2147483647',
    pointerEvents: 'none'
  });
  document.documentElement.appendChild(root);

  const shadow = root.attachShadow({ mode: 'open' });
  shadow.innerHTML = `
    <style>
      :host { all: initial; }
      button {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 12px;
        padding: 10px 16px;
        background: #ff6a00;
        color: #fff;
        font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,.2);
        transition: background .15s ease, transform .1s ease;
      }
      button:hover  { background: #e65f00; }
      button:active { transform: scale(.97); }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .arrow { font-size: 16px; line-height: 1; }
    </style>
    <button type="button" aria-label="Zurück zu lamachub.de">
      <span class="arrow">←</span>
      <span>Zurück</span>
    </button>
  `;

  shadow.querySelector('button').addEventListener('click', () => {
    // Navigation im selben Tab (window.top bricht ggf. aus iFrames aus)
    window.top.location.href = 'https://www.lamachub.de/';
  });
})();
</script>
</body>
</html>
