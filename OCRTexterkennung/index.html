<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR to PDF</title>

<!-- Fonts -->

<!-- Tesseract + jsPDF -->

<style>

    font-family:Inter, sans-serif;

}

<div id="lamac-ai">
  <button id="lamac-ai-open" aria-label="Kundensupport öffnen">
    💬
  </button>

  <section id="lamac-ai-window" aria-label="lamacHub Kundenservice" aria-hidden="true">
    <header>
      <div>
        <strong>lamacHub Kundenservice</strong>
        <small>KI-gestützter Support</small>
      </div>
      <button id="lamac-ai-close" aria-label="Chat schließen">×</button>
    </header>

    <div id="lamac-ai-messages" aria-live="polite" aria-relevant="additions">
      <div class="lamac-bot">
        Hallo! Wie kann ich dir weiterhelfen?
      </div>
    </div>

    <form id="lamac-ai-form">
      <input
        id="lamac-ai-input"
        placeholder="Nachricht schreiben …"
        maxlength="1800"
        aria-label="Deine Nachricht"
        autocomplete="off"
        required
      >
      <button type="submit" aria-label="Nachricht senden">➤</button>
    </form>
  </section>
</div>

<script>
(() => {
  "use strict";

  // Dieselbe Worker-Adresse für alle Websites verwenden.
  const WORKER_URL =
    "https://carescape-ai.oslamuoslamu.workers.dev/";

  const root = document.querySelector("#lamac-ai");

  // Verhindert doppelte Initialisierung, falls der Code versehentlich
  // zweimal auf derselben Seite eingebunden wurde.
  if (!root || root.dataset.initialized === "true") return;
  root.dataset.initialized = "true";

  const chatWindow = root.querySelector("#lamac-ai-window");
  const openButton = root.querySelector("#lamac-ai-open");
  const closeButton = root.querySelector("#lamac-ai-close");
  const chatMessages = root.querySelector("#lamac-ai-messages");
  const chatInput = root.querySelector("#lamac-ai-input");
  const chatForm = root.querySelector("#lamac-ai-form");
  const sendButton = chatForm.querySelector("button");

  let history = [];
  let busy = false;

  function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function addUserMessage(text) {
    const item = document.createElement("div");
    item.className = "lamac-user";
    item.textContent = text;
    chatMessages.appendChild(item);
    scrollToBottom();
  }

  function addBotMessage(text) {
    const item = document.createElement("div");
    item.className = "lamac-bot";

    // Markdown wird in kontrollierte HTML-Elemente umgewandelt.
    // HTML aus der Antwort wird vorher escaped.
    item.innerHTML = renderMarkdown(text);

    chatMessages.appendChild(item);
    scrollToBottom();
  }

  function showTyping() {
    const typing = document.createElement("div");
    typing.className = "lamac-bot lamac-typing";
    typing.setAttribute("role", "status");
    typing.setAttribute("aria-label", "Kundenservice antwortet");
    typing.innerHTML =
      '<span class="lamac-typing-dot"></span>' +
      '<span class="lamac-typing-dot"></span>' +
      '<span class="lamac-typing-dot"></span>';

    chatMessages.appendChild(typing);
    scrollToBottom();

    return typing;
  }

  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function safeLink(url) {
    try {
      const parsed = new URL(url);

      if (
        parsed.protocol === "https:" ||
        parsed.protocol === "http:"
      ) {
        return parsed.href;
      }
    } catch (_) {}

    return null;
  }

  function renderInline(text) {
    // Zuerst den gesamten Inhalt escapen, damit die KI
    // keine eigenen HTML-Tags einschleusen kann.
    let value = escapeHTML(text);

    // Inline-Code vor anderen Formatierungen schützen.
    const codeParts = [];

    value = value.replace(/`([^`\n]+)`/g, (_, code) => {
      const index = codeParts.length;
      codeParts.push("<code>" + code + "</code>");
      return "LAMACCODE" + index + "END";
    });

    // Markdown-Links: ausschließlich HTTP(S) erlauben.
    value = value.replace(
      /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      (match, label, url) => {
        const safe = safeLink(url.replace(/&amp;/g, "&"));

        if (!safe) return label;

        return (
          '<a href="' + escapeHTML(safe) +
          '" target="_blank" rel="noopener noreferrer">' +
          label + "</a>"
        );
      }
    );

    // URLs, die die KI ohne Markdown ausgibt, ebenfalls verlinken.
    value = value.replace(
      /(^|[\s(])(https?:\/\/[^\s<]+)/g,
      (match, prefix, url) => {
        const cleanURL = url.replace(/[.,!?;:]+$/, "");
        const trailing = url.slice(cleanURL.length);
        const safe = safeLink(
          cleanURL.replace(/&amp;/g, "&")
        );

        if (!safe) return match;

        return (
          prefix +
          '<a href="' + escapeHTML(safe) +
          '" target="_blank" rel="noopener noreferrer">' +
          cleanURL + "</a>" + trailing
        );
      }
    );

    // Fett und kursiv.
    value = value.replace(
      /\*\*\*(.+?)\*\*\*/g,
      "<strong><em>$1</em></strong>"
    );
    value = value.replace(
      /___(.+?)___/g,
      "<strong><em>$1</em></strong>"
    );
    value = value.replace(
      /\*\*(.+?)\*\*/g,
      "<strong>$1</strong>"
    );
    value = value.replace(
      /__(.+?)__/g,
      "<strong>$1</strong>"
    );
    value = value.replace(
      /(^|[^*])\*([^*\n]+)\*(?!\*)/g,
      "$1<em>$2</em>"
    );
    value = value.replace(
      /(^|[^_])_([^_\n]+)_(?!_)/g,
      "$1<em>$2</em>"
    );
    value = value.replace(
      /~~(.+?)~~/g,
      "<del>$1</del>"
    );

    // Geschützte Inline-Code-Stellen wieder einsetzen.
    value = value.replace(
      /LAMACCODE(\d+)END/g,
      (_, index) => codeParts[Number(index)] || ""
    );

    return value;
  }

  function isTableSeparator(line) {
    const cells = line.trim().replace(/^\||\|$/g, "").split("|");

    return (
      cells.length > 0 &&
      cells.every(cell =>
        /^\s*:?-{3,}:?\s*$/.test(cell)
      )
    );
  }

  function parseTableRow(line) {
    return line
      .trim()
      .replace(/^\||\|$/g, "")
      .split("|")
      .map(cell => cell.trim());
  }

  function renderMarkdown(markdown) {
    const lines = String(markdown || "")
      .replace(/\r\n?/g, "\n")
      .split("\n");

    const output = [];
    let paragraph = [];
    let listType = null;
    let inCodeBlock = false;
    let codeLines = [];

    function flushParagraph() {
      if (!paragraph.length) return;

      output.push(
        "<p>" +
        paragraph.map(renderInline).join("<br>") +
        "</p>"
      );

      paragraph = [];
    }

    function closeList() {
      if (listType) {
        output.push("</" + listType + ">");
        listType = null;
      }
    }

    function closeParagraphAndList() {
      flushParagraph();
      closeList();
    }

    function renderTable(headerLine, bodyLines) {
      const headers = parseTableRow(headerLine);
      const rows = bodyLines.map(parseTableRow);

      let html = '<div class="lamac-table-wrap"><table><thead><tr>';

      for (const cell of headers) {
        html += "<th>" + renderInline(cell) + "</th>";
      }

      html += "</tr></thead><tbody>";

      for (const row of rows) {
        html += "<tr>";

        headers.forEach((_, index) => {
          html += "<td>" +
            renderInline(row[index] || "") +
            "</td>";
        });

        html += "</tr>";
      }

      html += "</tbody></table></div>";

      return html;
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      // Mehrzeilige Codeblöcke.
      if (/^\s*```/.test(line)) {
        if (inCodeBlock) {
          output.push(
            "<pre><code>" +
            escapeHTML(codeLines.join("\n")) +
            "</code></pre>"
          );

          codeLines = [];
          inCodeBlock = false;
        } else {
          closeParagraphAndList();
          inCodeBlock = true;
          codeLines = [];
        }

        continue;
      }

      if (inCodeBlock) {
        codeLines.push(line);
        continue;
      }

      // Markdown-Tabelle mit Kopfzeile und Trennzeile.
      if (
        line.includes("|") &&
        i + 1 < lines.length &&
        isTableSeparator(lines[i + 1])
      ) {
        closeParagraphAndList();

        const header = line;
        i += 2;

        const rows = [];

        while (
          i < lines.length &&
          lines[i].trim() &&
          lines[i].includes("|")
        ) {
          rows.push(lines[i]);
          i++;
        }

        i--;

        output.push(renderTable(header, rows));
        continue;
      }

      // Leerzeile trennt Absätze.
      if (!line.trim()) {
        closeParagraphAndList();
        continue;
      }

      // Überschriften.
      const heading = line.match(/^(#{1,4})\s+(.+)$/);

      if (heading) {
        closeParagraphAndList();

        const level = heading[1].length;

        output.push(
          "<h" + level + ">" +
          renderInline(heading[2]) +
          "</h" + level + ">"
        );

        continue;
      }

      // Horizontale Trennlinie.
      if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) {
        closeParagraphAndList();
        output.push("<hr>");
        continue;
      }

      // Aufzählungen und nummerierte Listen.
      const unordered = line.match(/^\s*[-*+]\s+(.+)$/);
      const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);

      if (unordered || ordered) {
        flushParagraph();

        const nextType = unordered ? "ul" : "ol";

        if (listType !== nextType) {
          closeList();
          output.push("<" + nextType + ">");
          listType = nextType;
        }

        const itemText = (unordered || ordered)[1];

        output.push(
          "<li>" + renderInline(itemText) + "</li>"
        );

        continue;
      }

      // Zitat.
      const quote = line.match(/^\s*>\s?(.*)$/);

      if (quote) {
        closeParagraphAndList();

        output.push(
          "<blockquote>" +
          renderInline(quote[1]) +
          "</blockquote>"
        );

        continue;
      }

      closeList();
      paragraph.push(line);
    }

    if (inCodeBlock) {
      output.push(
        "<pre><code>" +
        escapeHTML(codeLines.join("\n")) +
        "</code></pre>"
      );
    }

    closeParagraphAndList();

    return output.join("");
  }

  function setBusy(value) {
    busy = value;
    sendButton.disabled = value;
    chatInput.disabled = value;
    sendButton.setAttribute("aria-busy", String(value));
  }

  openButton.addEventListener("click", () => {
    chatWindow.classList.add("open");
    chatWindow.setAttribute("aria-hidden", "false");
    chatInput.focus();
  });

  closeButton.addEventListener("click", () => {
    chatWindow.classList.remove("open");
    chatWindow.setAttribute("aria-hidden", "true");
    openButton.focus();
  });

  chatForm.addEventListener("submit", async event => {
    event.preventDefault();

    const text = chatInput.value.trim();

    if (!text || busy) return;

    addUserMessage(text);
    chatInput.value = "";

    // Bisherige Nachrichten plus neue Nutzernachricht.
    const messages = [
      ...history,
      { role: "user", content: text }
    ];

    setBusy(true);

    // Sofort sichtbar: Der Bot verarbeitet die Nachricht.
    const typingIndicator = showTyping();

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          mode: "support",
          messages
        })
      });

      const rawResponse = await response.text();
      let data;

      try {
        data = JSON.parse(rawResponse);
      } catch (_) {
        throw new Error("Ungültige Antwort vom Kundenservice");
      }

      if (!response.ok) {
        throw new Error(
          data.error || "Support nicht erreichbar"
        );
      }

      if (
        typeof data.reply !== "string" ||
        !data.reply.trim()
      ) {
        throw new Error("Leere Antwort vom Kundenservice");
      }

      typingIndicator.remove();
      addBotMessage(data.reply);

      // Verlauf begrenzen, damit Anfragen nicht unbegrenzt wachsen.
      history = [
        ...messages,
        { role: "assistant", content: data.reply }
      ].slice(-12);

    } catch (error) {
      typingIndicator.remove();

      console.error(
        "lamacHub Support-Chat:",
        error?.message || error
      );

      addBotMessage(
        "Der Kundenservice ist gerade nicht erreichbar. Bitte versuche es später erneut."
      );

    } finally {
      setBusy(false);

      if (chatWindow.classList.contains("open")) {
        chatInput.focus();
      }
    }
  });
})();
</script>
<body>

<div class="navbar">
    <div class="logo">🟠 lamacOCR</div>
    <div>© 2026 lamacHub</div>
</div>

<div class="container">
    <div class="card">
        <h1>Bild → Text → PDF</h1>
        <p>Lade ein Bild hoch, erkenne den Text und exportiere ihn als PDF.</p>

        <input type="file" id="imageInput" accept="image/*">

        <button onclick="startOCR()">Text erkennen</button>
        <button onclick="downloadPDF()">PDF herunterladen</button>

        <div id="status"></div>
        <pre id="output"></pre>
    </div>
</div>

<script>
let extractedText = "";

async function startOCR(){
    const file = document.getElementById("imageInput").files[0];
    if(!file){
        alert("Bitte erst ein Bild auswählen");
        return;
    }

    document.getElementById("status").innerText = "Erkenne Text... ⏳";

    const reader = new FileReader();
    reader.onload = async function(){
        const img = reader.result;

        const result = await Tesseract.recognize(
            img,
            "deu+eng",
            {
                logger: m => {
                    if(m.status){
                        document.getElementById("status").innerText =
                        m.status + " " + Math.round(m.progress*100) + "%";
                    }
                }
            }
        );

        extractedText = result.data.text;
        document.getElementById("output").innerText = extractedText;

        document.getElementById("status").innerText = "Fertig ✅";
    };

    reader.readAsDataURL(file);
}

function downloadPDF(){
    if(!extractedText){
        alert("Kein Text vorhanden");
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const lines = doc.splitTextToSize(extractedText, 180);
    doc.text(lines, 10, 10);

    doc.save("ocr-text.pdf");
}
</script>
<script>
(function () {
  if (typeof window === 'undefined' || typeof document === 'undefined') return;

  // 1) Nur anzeigen, wenn der Referrer exakt https://www.lamachub.de ist
  let referrer = '';
  try { referrer = new URL(document.referrer); } catch (e) {}
  if (
    referrer.protocol !== 'https:' ||
    referrer.hostname.toLowerCase() !== 'www.lamachub.de'
  ) return;

  // 2) Container in Shadow DOM, damit die Styles der Host-Seite nicht stören
  const root = document.createElement('div');
  root.setAttribute('data-lamachub-back', '');
  Object.assign(root.style, {
    all: 'initial',
    position: 'fixed',
    top: '0',
    left: '0',
    zIndex: '2147483647',
    pointerEvents: 'none'
  });
  document.documentElement.appendChild(root);

  const shadow = root.attachShadow({ mode: 'open' });
  shadow.innerHTML = `
    <style>
      :host { all: initial; }
      button {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 12px;
        padding: 10px 16px;
        background: #ff6a00;
        color: #fff;
        font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,.2);
        transition: background .15s ease, transform .1s ease;
      }
      button:hover  { background: #e65f00; }
      button:active { transform: scale(.97); }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .arrow { font-size: 16px; line-height: 1; }
    </style>
    <button type="button" aria-label="Zurück zu lamachub.de">
      <span class="arrow">←</span>
      <span>Zurück</span>
    </button>
  `;

  shadow.querySelector('button').addEventListener('click', () => {
    // Navigation im selben Tab (window.top bricht ggf. aus iFrames aus)
    window.top.location.href = 'https://www.lamachub.de/';
  });
})();
</script>
